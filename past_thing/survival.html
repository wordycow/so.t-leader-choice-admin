<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 생존 전략 - 산업 트렌드 분석</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- ✨ THE UNIQUE LEGENDARY DESIGN SYSTEM v4.0 -->
  <link rel="stylesheet" href="css/the-unique-core.css">
  
  <!-- 🎯 HOVER VISIBILITY ENHANCEMENT v4.1 -->
  <link rel="stylesheet" href="css/hover-visibility-enhanced.css">
  
  <style>
    :root {
      --danger-red: #ef4444;
      --warning-orange: #f97316;
      --success-green: #10b981;
      --growth-blue: #3b82f6;
      --dark-bg: #0f1419;
      --card-bg: #1a1f2e;
      --border-color: #2d3748;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --accent-gold: #fbbf24;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* 첨단 SF 도시 배경 애니메이션 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(90deg, transparent 0%, rgba(0, 200, 255, 0.03) 50%, transparent 100%),
        radial-gradient(circle at 20% 30%, rgba(0, 150, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 255, 200, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(100, 200, 255, 0.08) 0%, transparent 60%);
      animation: futuristicPulse 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 150, 255, 0.03) 2px,
          rgba(0, 150, 255, 0.03) 4px
        );
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
    }

    @keyframes futuristicPulse {
      0%, 100% { opacity: 0.8; filter: brightness(1); }
      50% { opacity: 1; filter: brightness(1.2); }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* 헤더 */
    .header {
      text-align: center;
      padding: 40px 20px;
      margin-bottom: 40px;
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(135deg, #00d4ff 0%, #0099ff 50%, #0066ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
      text-shadow: 0 0 40px rgba(0, 150, 255, 0.6);
      animation: cyberGlow 2s ease-in-out infinite;
      letter-spacing: 2px;
    }

    @keyframes cyberGlow {
      0%, 100% { 
        filter: brightness(1) drop-shadow(0 0 20px rgba(0, 200, 255, 0.5)); 
      }
      50% { 
        filter: brightness(1.3) drop-shadow(0 0 30px rgba(0, 200, 255, 0.8)); 
      }
    }

    .subtitle {
      font-size: 20px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .update-time {
      font-size: 14px;
      color: #fff;
      font-weight: 600;
      display: inline-block;
      padding: 8px 20px;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(251, 191, 36, 0.25));
      border: 1px solid rgba(251, 191, 36, 0.5);
      border-radius: 20px;
      margin-top: 15px;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
    }

    /* 새로고침 버튼 */
    .refresh-btn {
      display: block;
      margin: 20px auto;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(0, 200, 255, 0.9), rgba(0, 150, 255, 0.9));
      border: 2px solid rgba(0, 200, 255, 0.6);
      border-radius: 30px;
      color: white;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.1);
      font-family: 'Noto Sans KR', sans-serif;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.8);
      position: relative;
      overflow: hidden;
    }
    
    .refresh-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .refresh-btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .refresh-btn:hover {
      background: linear-gradient(135deg, rgba(0, 220, 255, 1), rgba(0, 170, 255, 1));
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.8), inset 0 0 25px rgba(255, 255, 255, 0.2);
      border-color: rgba(0, 220, 255, 0.8);
    }

    .refresh-btn:active {
      transform: translateY(-1px) scale(0.98);
    }

    /* 메인 그리드 */
    .trends-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 40px;
    }

    /* 트렌드 카드 */
    .trend-card {
      background: linear-gradient(145deg, rgba(26, 31, 46, 0.9), rgba(15, 20, 37, 0.9));
      border-radius: 20px;
      padding: 30px;
      border: 2px solid rgba(0, 150, 255, 0.2);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(0, 200, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: slideIn 0.6s ease-out;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    
    .trend-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.1), transparent);
      transition: left 0.5s;
    }
    
    .trend-card:hover::before {
      left: 100%;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .trend-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 
        0 12px 48px rgba(0, 150, 255, 0.3),
        inset 0 1px 1px rgba(0, 200, 255, 0.2);
      border-color: rgba(0, 200, 255, 0.5);
    }

    .trend-card.declining {
      border-color: rgba(255, 80, 80, 0.4);
      background: linear-gradient(145deg, rgba(40, 20, 30, 0.9), rgba(30, 15, 25, 0.9));
    }
    
    .trend-card.declining:hover {
      box-shadow: 
        0 12px 48px rgba(255, 80, 80, 0.3),
        inset 0 1px 1px rgba(255, 100, 100, 0.2);
      border-color: rgba(255, 80, 80, 0.6);
    }

    .trend-card.growing {
      border-color: rgba(0, 255, 150, 0.4);
      background: linear-gradient(145deg, rgba(20, 40, 35, 0.9), rgba(15, 30, 25, 0.9));
    }
    
    .trend-card.growing:hover {
      box-shadow: 
        0 12px 48px rgba(0, 255, 150, 0.3),
        inset 0 1px 1px rgba(0, 255, 150, 0.2);
      border-color: rgba(0, 255, 150, 0.6);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 28px;
      font-weight: 900;
    }

    .card-title.declining {
      color: var(--danger-red);
    }

    .card-title.growing {
      color: var(--success-green);
    }

    .trend-icon {
      font-size: 36px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .trend-badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badge-decline {
      background: rgba(255, 80, 80, 0.15);
      color: #ff5050;
      border: 1px solid rgba(255, 80, 80, 0.5);
      box-shadow: 0 0 10px rgba(255, 80, 80, 0.2);
    }

    .badge-growth {
      background: rgba(0, 255, 150, 0.15);
      color: #00ff96;
      border: 1px solid rgba(0, 255, 150, 0.5);
      box-shadow: 0 0 10px rgba(0, 255, 150, 0.2);
    }

    /* 산업 리스트 */
    .industry-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .industry-item {
      background: rgba(26, 31, 46, 0.6);
      border-radius: 12px;
      padding: 20px;
      border-left: 4px solid;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      backdrop-filter: blur(5px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .industry-item:hover {
      background: rgba(26, 31, 46, 0.8);
      transform: translateX(8px);
      box-shadow: 0 4px 16px rgba(0, 150, 255, 0.2);
    }

    .industry-item.decline {
      border-left-color: var(--danger-red);
    }

    .industry-item.growth {
      border-left-color: var(--success-green);
    }

    .industry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .industry-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .industry-change {
      font-size: 18px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
    }

    .change-decline {
      color: #ff5050;
      background: rgba(255, 80, 80, 0.15);
      border: 1px solid rgba(255, 80, 80, 0.3);
    }

    .change-growth {
      color: #00ff96;
      background: rgba(0, 255, 150, 0.15);
      border: 1px solid rgba(0, 255, 150, 0.3);
    }

    .industry-description {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .industry-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tag {
      padding: 5px 12px;
      background: rgba(0, 150, 255, 0.1);
      border: 1px solid rgba(0, 150, 255, 0.4);
      border-radius: 15px;
      font-size: 12px;
      color: #00b4ff;
      font-weight: 600;
      box-shadow: 0 0 8px rgba(0, 150, 255, 0.15);
    }

    /* 로딩 */
    .loading {
      text-align: center;
      padding: 60px 20px;
      display: none;
    }

    .loading.active {
      display: block;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(59, 130, 246, 0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* 홈 버튼 */
    .home-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 12px 24px;
      background: #0a0e27 url('img/survival-background.png') center/cover no-repeat fixed;
      border: 2px solid var(--accent-gold);
      border-radius: 15px;
      color: var(--accent-gold);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
    }

    .home-btn:hover {
      background: #0a0e27 url('img/survival-background.png') center/cover no-repeat fixed;
      transform: scale(1.05);
    }

    /* 비용 표시 */
    .cost-badge {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 24px;
      background: #0a0e27 url('img/survival-background.png') center/cover no-repeat fixed;
      border: 3px solid #f59e0b;
      border-radius: 20px;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
      z-index: 100;
      letter-spacing: 2px;
    }

    /* 모바일 반응형 */
    @media (max-width: 768px) {
      .main-title {
        font-size: 36px;
      }

      .subtitle {
        font-size: 16px;
      }

      .trends-grid {
        grid-template-columns: 1fr;
      }

      .card-title {
        font-size: 22px;
      }

      .industry-name {
        font-size: 18px;
      }

      .cost-badge {
        top: 10px;
        right: 10px;
        font-size: 16px;
        padding: 8px 16px;
      }

      .home-btn {
        top: 10px;
        left: 10px;
        font-size: 14px;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
  <!-- 홈 버튼 -->
  <a href="the-unique-main.html" class="home-btn">
    🏠 <span>HOME</span>
  </a>

  <!-- 비용 배지 -->
  <div class="cost-badge">FREE</div>

  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <h1 class="main-title">📊 SURVIVAL STRATEGY</h1>
      <p class="subtitle">실시간 산업 트렌드 분석 - 생존을 위한 전략</p>

    <!-- 새로고침 버튼 -->
    <button class="refresh-btn" id="refreshBtn">🔄 최신 데이터 업데이트</button>

    <!-- 로딩 -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">산업 트렌드 분석 중...</div>
    </div>

    <!-- 트렌드 그리드 -->
    <div class="trends-grid" id="trendsGrid"></div>
  </div>

  <script>
    const loading = document.getElementById('loading');
    const trendsGrid = document.getElementById('trendsGrid');
    const updateTime = document.getElementById('updateTime');
    const refreshBtn = document.getElementById('refreshBtn');

    // 더미 데이터 (실제로는 API나 웹 검색을 통해 가져옴)

        },
        {

          tags: ['메타버스', 'NFT', '가상자산', '블록체인']
        },
        {

          tags: ['태양광', '풍력', '탄소중립', '그린에너지']
        },
        {
          name: '사이버 보안',
          change: '+22%',
          description: '랜섬웨어, 해킹 증가로 보안 수요 폭증. 제로 트러스트, 클라우드 보안 솔루션 인기.',
          tags: ['보안', '랜섬웨어', '제로트러스트', '해킹방어']
        }
      ]
    };

    // 트렌드 표시
    function displayTrends() {
      showLoading();
      trendsGrid.innerHTML = '';

      setTimeout(() => {
        hideLoading();

        // 축소 업종 카드
        const decliningCard = createTrendCard('축소 업종', 'declining', dummyData.declining);
        trendsGrid.appendChild(decliningCard);

        // 성장 업종 카드
        const growingCard = createTrendCard('성장 업종', 'growing', dummyData.growing);
        trendsGrid.appendChild(growingCard);

        // 업데이트 시간 표시
        const now = new Date();
        updateTime.textContent = `⏰ ${now.toLocaleString('ko-KR')} 업데이트`;
      }, 1500);
    }

    // 트렌드 카드 생성
    function createTrendCard(title, type, industries) {
      const card = document.createElement('div');
      card.className = `trend-card ${type}`;

      const icon = type === 'declining' ? '📉' : '📈';
      const badge = type === 'declining' ? 'DECLINE' : 'GROWTH';
      const badgeClass = type === 'declining' ? 'badge-decline' : 'badge-growth';

      let industriesHTML = '';
      industries.forEach(industry => {
        industriesHTML += `
          <div class="industry-item ${type === 'declining' ? 'decline' : 'growth'}">
            <div class="industry-header">
              <div class="industry-name">${industry.name}</div>
              <div class="industry-change ${type === 'declining' ? 'change-decline' : 'change-growth'}">
                ${industry.change}
              </div>
            </div>
            <div class="industry-description">${industry.description}</div>
            <div class="industry-tags">
              ${industry.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
            </div>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="card-header">
          <div class="card-title ${type}">
            <span class="trend-icon">${icon}</span>
            <span>${title}</span>
          </div>
          <div class="trend-badge ${badgeClass}">${badge}</div>
        </div>
        <div class="industry-list">
          ${industriesHTML}
        </div>
      `;

      return card;
    }

    // UI 제어
    function showLoading() {
      loading.classList.add('active');
    }

    function hideLoading() {
      loading.classList.remove('active');
    }

    // 이벤트 리스너
    refreshBtn.addEventListener('click', () => {
      displayTrends();
    });

    // 초기 로드
    window.addEventListener('load', () => {
      displayTrends();
    });
  </script>
  
  <!-- ✨ THE UNIQUE LEGENDARY CORE FRAMEWORK v4.0 -->
  <script src="js/the-unique-core.js"></script>
</body>
