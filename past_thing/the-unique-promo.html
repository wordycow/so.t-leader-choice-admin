<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>THE UNIQUE TREASURE BOX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    :root{
      --gold:#fbbf24;
      --panel:#1e293b;
      --text:#f9fafb;
      --muted:#94a3b8;
      --bg:#000;
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      color:var(--text);
      background:#0a0e27 url('img/promo-v2-background.png') center/cover no-repeat fixed;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .scene{position:fixed;inset:0;overflow:hidden;z-index:-1}
    .scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}

    .page-wrap{position:relative;z-index:10;max-width:720px;width:100%;margin:40px auto;padding:20px}
    .card{
      background:rgba(15,23,42,.95);
      border-radius:24px;
      border:1px solid var(--gold);
      box-shadow:0 0 30px rgba(251,191,36,.15);
      padding:28px 22px;
    }

    .top-bar{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,.1);
      padding-bottom:16px;
    }
    .title{
      font-size:22px;font-weight:700;color:#fff;
      font-family:"Cinzel",serif;letter-spacing:.05em;
    }
    .user-info{font-size:13px;color:var(--gold);font-weight:700;margin-top:4px}
    .btn-close{
      background:var(--panel);border:1px solid rgba(255,255,255,.18);
      color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;
    }

    .info-box{
      background:var(--panel);
      padding:18px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      margin-bottom:16px;
      position:relative;
    }
    .gold-box{
      border-color:rgba(251,191,36,.6);
      background:rgba(251,191,36,.06);
    }

    .label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:8px;display:block}
    .value{font-size:30px;font-weight:950;color:#fff}
    .sub-text{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}

    .btn-copy{
      position:absolute;top:16px;right:16px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.20);
      color:var(--gold);
      padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;
    }

    .input-group{margin-bottom:10px}
    .input-field{
      width:100%;padding:12px;
      background:#0f172a;border:1px solid #334155;
      color:#fff;border-radius:10px;font-size:13px;
    }
    .input-field:focus{border-color:var(--gold);outline:none}

    .action-btn{
      width:100%;padding:14px;border-radius:12px;
      font-weight:900;cursor:pointer;border:none;font-size:14px;
      transition:transform .1s;
    }
    .action-btn:active{transform:scale(.98)}
    .btn-gold{background:var(--gold);color:#000}
    .action-btn[disabled]{opacity:.65;cursor:not-allowed}

    .mini-result{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(2,6,23,.25);
      color:#cbd5e1;
      font-size:12px;
      line-height:1.45;
      word-break:break-word;
      display:none;
    }
    .mini-result.show{display:block}
    .mini-result b{color:#fff}

    .ranking-list{margin-top:10px}
    .rank-item{
      display:flex;justify-content:space-between;align-items:center;
      padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);
      font-size:13px;
    }
    .rank-badge{
      display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;
      font-weight:900;margin-right:8px;border-radius:50%;font-size:11px;
      background:#334155;color:#fff;
    }
    .rank-1{background:#FFD700;color:#000}
    .rank-2{background:#C0C0C0;color:#000}
    .rank-3{background:#CD7F32;color:#000}

    @media (max-width:480px){
      .page-wrap{padding:15px;margin-top:20px}
      .title{font-size:18px}
    }
  </style>

  
  
  


  <!-- Medieval Magic Theme (골드 + 딥블루) -->
  <link rel="stylesheet" href="css/medieval-magic.css">
  <link rel="stylesheet" href="css/medieval-override.css">

</head>

<body>
  <div class="scene">
    <img src="img/bg-unique-promo.jpg" class="scene-bg" alt="Background" onerror="this.style.display='none'" / loading="lazy" decoding="async">
  </div>

  <div class="page-wrap">
    <div class="card">

      <div class="top-bar">
        <div>
          <div class="title">THE UNIQUE TREASURE BOX</div>
          <div class="user-info" id="user-display">[User]</div>
        </div>
        <button class="btn-close" type="button" onclick="tryClose()">닫기 ✕</button>
      </div>

      <!-- 금고 잔액/주소 -->
      <div class="info-box">
        <button class="btn-copy" onclick="copyVaultAddress()">주소 복사</button>
        <div class="label">공동기금 (REAL USDT)</div>
        <div class="value" id="vault-balance-num">Loading...</div>
        <div class="sub-text">TRON Network (USDT TRC20 / TRX)</div>
        <div class="sub-text" id="vault-addr" style="margin-top:6px; word-break:break-all;"></div>
      </div>

      <!-- TXID 즉시 충전 -->
      <div class="info-box gold-box">
        <div class="label" style="color:var(--gold); font-size:14px;">🪙 UT 충전 (TXID 자동 검증 → 즉시 충전)</div>

        <div class="sub-text" style="margin-bottom:10px;">
          1) 위 <b style="color:#fff;">금고 주소</b>로 <b style="color:#fff;">USDT(TRC20) 또는 TRX</b> 입금<br>
          2) 입금한 <b style="color:#fff;">TXID(트랜잭션 해시)</b> 입력<br>
          3) 서버가 체인에서 확인되면 <b style="color:#fff;">즉시 UT 충전</b><br>
          <span style="color:#94a3b8;">※ 금액/자산 선택 같은 건 필요 없음. TXID가 전부 판단합니다.</span>
        </div>

        <div class="input-group">
          <input id="donate-name" class="input-field" placeholder="성함 (명예의 전당 표시용)" />
        </div>
        <div class="input-group">
          <input id="donate-txid" class="input-field" placeholder="TXID (64자리 해시)" />
        </div>

        <button id="btn-submit-topup" class="action-btn btn-gold" onclick="submitDonation()">TXID 확인 후 즉시 충전</button>

        <div id="verify-mini" class="mini-result"></div>

        <div class="sub-text" style="margin-top:10px; text-align:center;">
          ⚠️ 충전 반영 계정: <b style="color:#fff" id="credit-user">[unknown]</b>
        </div>
      </div>

      <!-- 명예의 전당 -->
      <div class="info-box">
        <div class="label">💖 명예의 전당 (충전 완료)</div>
        <div id="donation-ranking" class="ranking-list">
          <div style="text-align:center; color:#64748b; font-size:12px; padding:10px;">데이터 로딩 중...</div>
        </div>
      </div>

    </div>
  </div>

<script>
  // ======================================================
  // Supabase (랭킹/기금 표시용)
  // ======================================================
  const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ======================================================
  // Apps Script(JSONP): 단일 진실(검증/충전)
  // ======================================================
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";

  function api(action, params = {}) {
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      params.action = action;
      params.callback = cb;
      params._t = Date.now();

      const qs = new URLSearchParams(params).toString();
      const s = document.createElement("script");
      s.src = GOOGLE_SCRIPT_URL + (GOOGLE_SCRIPT_URL.includes("?") ? "&" : "?") + qs;

      const t = setTimeout(() => { cleanup(); reject(new Error("API timeout")); }, 20000);
      window[cb] = (data) => { cleanup(); resolve(data); };
      s.onerror = () => { cleanup(); reject(new Error("API load failed")); };

      function cleanup(){
        clearTimeout(t);
        try { delete window[cb]; } catch(_) {}
        try { s.remove(); } catch(_) {}
      }
      document.body.appendChild(s);
    });
  }

  // ======================================================
  // 상수/상태
  // ======================================================
  const VAULT_TRON_ADDRESS = "TLb5D3uDQjPQt6CzATM21t21etxGsSvtbt";
  const TOPUP_TYPE_VERIFIED = "donation_verify";

  let myUsername = "";
  let myCurrentBalance = 0;

  function escapeHtml(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }

  function tryClose(){
    try{ window.close(); }catch(_){}
    setTimeout(() => {
      if (document.visibilityState === "visible") {
        if(history.length > 1) history.back();
        else location.href = "the-unique-main.html";
      }
    }, 120);
  }

  function copyVaultAddress(){
    navigator.clipboard.writeText(VAULT_TRON_ADDRESS)
      .then(()=>alert("입금 주소가 복사되었습니다."))
      .catch(()=>{});
  }

  function setMiniResult(html, show=true){
    const box = document.getElementById("verify-mini");
    if(!box) return;
    box.innerHTML = html || "";
    box.classList.toggle("show", !!show);
  }

  function setBusyTopup(isBusy){
    const btn = document.getElementById("btn-submit-topup");
    if(btn){
      btn.disabled = !!isBusy;
      btn.textContent = isBusy ? "확인 중..." : "TXID 확인 후 즉시 충전";
    }
  }

  function getTopupAdminToken_(){
    // 필요 시 localStorage.setItem("topup_admin_token","...") 로 넣어둔 토큰 사용
    const t = String(localStorage.getItem("topup_admin_token") || "").trim();
    return t || "";
  }

  // ======================================================
  // Supabase: TXID 기준 upsert (표시용 로그)
  // ======================================================
  async function upsertTxByTxid_(txidNorm, payload){
    const { data: exist, error: e1 } = await db
      .from('transactions')
      .select('id, created_at')
      .eq('txid', txidNorm)
      .order('created_at', {ascending:false})
      .limit(1);

    if (e1) throw e1;

    if (exist && exist.length && exist[0].id != null){
      const id = exist[0].id;
      const { error: e2 } = await db.from('transactions').update(payload).eq('id', id);
      if (e2) throw e2;
      return { mode: "update", id };
    } else {
      const { error: e3 } = await db.from('transactions').insert([payload]);
      if (e3) throw e3;
      return { mode: "insert" };
    }
  }

  // ======================================================
  // 초기 로드
  // ======================================================
  document.addEventListener('DOMContentLoaded', async () => {
    const rawUser = localStorage.getItem('uniqueCurrentUser');
    if (!rawUser) {
      alert("로그인 정보가 없습니다. 메인 화면에서 접속해주세요.");
      tryClose();
      return;
    }

    try {
      const userObj = JSON.parse(rawUser);
      myUsername = String(userObj.id || userObj.name || "Unknown").trim();

      document.getElementById("user-display").textContent = `[${myUsername}]`;
      document.getElementById("credit-user").textContent = `[${myUsername}]`;
      document.getElementById("vault-addr").textContent = VAULT_TRON_ADDRESS;

      await fetchMyBalance();        // 내부 상태 업데이트(필수는 아니지만 안전)
      await fetchVaultSumSince();    // 표시
      await fetchRanking();          // 표시
    } catch(e) {
      console.error(e);
      alert("초기화 오류: " + (e.message || e));
    }
  });

  async function fetchMyBalance() {
    // 화면 표시용은 아니고, 추후 확장/안전용으로만 유지
    const localBal = localStorage.getItem('myUtPoints');
    if (localBal != null) myCurrentBalance = parseFloat(localBal) || 0;

    try{
      const r = await api("getUser", { id: myUsername });
      if (r && r.ok && r.user) {
        myCurrentBalance = Number(r.user.balance || 0);
        localStorage.setItem('myUtPoints', String(myCurrentBalance));
      }
    }catch(e){
      console.warn("fetchMyBalance(getUser) fail:", e);
    }
  }

  async function fetchVaultSumSince() {
    const CUTOFF_UTC = "2025-12-20T15:00:00.000Z";
    const mainEl = document.getElementById("vault-balance-num");
    if (!mainEl) return;

    try {
      const { data, error } = await db
        .from("transactions")
        .select("amount, created_at")
        .eq("type", TOPUP_TYPE_VERIFIED)
        .gte("created_at", CUTOFF_UTC);

      if (error) throw error;

      const sum = (data || []).reduce((acc, r) => acc + (Number(r.amount) || 0), 0);
      mainEl.textContent = `${sum.toLocaleString()} USDT`;
    } catch (e) {
      console.warn("fetchVaultSumSince fail:", e);
      mainEl.textContent = "Error";
    }
  }

  async function fetchRanking() {
    const container = document.getElementById("donation-ranking");
    if(!container) return;

    const { data: list, error } = await db.from('transactions')
      .select('donor_name, amount, created_at')
      .eq('type', TOPUP_TYPE_VERIFIED)
      .order('created_at', {ascending:false})
      .limit(500);

    if (error) {
      container.innerHTML = '<div style="text-align:center; color:#f87171; font-size:12px; padding:10px;">랭킹 로딩 오류</div>';
      return;
    }

    if (!list || list.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:10px;">아직 충전 완료 내역이 없습니다.</div>';
      return;
    }

    const agg = new Map();
    for (const r of list) {
      const dn = String(r.donor_name || "").trim();
      if (!dn) continue;
      const a = Number(r.amount || 0);
      agg.set(dn, (agg.get(dn) || 0) + a);
    }

    const ranked = Array.from(agg.entries())
      .map(([donor_name, amount]) => ({ donor_name, amount }))
      .sort((a,b) => b.amount - a.amount)
      .slice(0, 10);

    container.innerHTML = ranked.map((item, idx) => {
      let badge = `<span class="rank-badge">${idx+1}</span>`;
      if(idx===0) badge = `<span class="rank-badge rank-1">${idx+1}</span>`;
      if(idx===1) badge = `<span class="rank-badge rank-2">${idx+1}</span>`;
      if(idx===2) badge = `<span class="rank-badge rank-3">${idx+1}</span>`;

      return `
        <div class="rank-item">
          <div style="display:flex; align-items:center;">
            ${badge}
            <span style="font-weight:900; color:#fff; font-size:12px;">${escapeHtml(item.donor_name)}</span>
          </div>
          <div style="color:#fbbf24; font-weight:900;">${Number(item.amount || 0).toLocaleString()} USDT</div>
        </div>
      `;
    }).join('');
  }

  // ======================================================
  // ✅ TXID 검증 → 즉시 충전
  // ======================================================
  async function submitDonation() {
    const name = document.getElementById("donate-name").value.trim();
    const txid = document.getElementById("donate-txid").value.trim();
    if(!name || !txid) return alert("성함과 TXID를 입력해주세요.");

    const txidNorm = txid.toLowerCase().trim();
    if(!/^[0-9a-f]{64}$/.test(txidNorm)){
      return alert("TXID 형식이 올바르지 않습니다. (64자리 hex)");
    }

    setBusyTopup(true);
    setMiniResult("", false);

    try{
      // 1) 체인 검증
      const v = await api("verifyTopupTxid", { txid: txidNorm });
      if(!v || !v.ok || !v.verify || !v.verify.ok){
        const msg = v?.error || v?.msg || v?.verify?.error || "verify_failed";
        setMiniResult(`❌ 검증 실패: <b>${escapeHtml(msg)}</b><br>TXID가 금고주소 입금 트랜잭션이 아닐 수 있습니다.`, true);
        return;
      }

      const ver = v.verify;
      const symbol = String(ver.symbol || "");
      const amountExact = Number(ver.amountExact || 0);
      const usdtExact = Number(ver.usdtExact || 0);
      const utTarget = Math.floor(Number(ver.utTarget || 0));
      const utApplied = Math.floor(Number(ver.utApplied || 0));

      setMiniResult(
        `✅ 검증 성공<br>` +
        `자산: <b>${escapeHtml(symbol)}</b> / 실입금: <b>${amountExact}</b> ${escapeHtml(symbol)}<br>` +
        `USDT 등가: <b>${usdtExact}</b><br>` +
        `충전 대상 UT: <b>${utTarget.toLocaleString()}</b> UT` +
        (utApplied > 0 ? `<br>이미 적용된 UT: <b>${utApplied.toLocaleString()}</b> UT` : ``),
        true
      );

      if(!utTarget || utTarget <= 0){
        return alert("검증은 되었지만 충전 대상 UT가 0입니다. (지원 자산/금액 확인)");
      }

      // 2) 즉시 충전 (Apps Script가 중복/클레임 차단)
      const token = getTopupAdminToken_();
      const payload = { id: myUsername, txid: txidNorm };
      if(token) payload.token = token;

      const a = await api("topupByTxid", payload);

      if(!a || !a.ok){
        const err = a?.error || a?.msg || "topup_failed";
        if(String(err).includes("txid_already_claimed")){
          setMiniResult(`❌ 충전 실패: <b>이미 다른 계정에 사용된 TXID</b>`, true);
          alert("이미 다른 계정에 사용된 TXID입니다.");
          return;
        }
        if(String(err).includes("forbidden")){
          setMiniResult(`❌ 충전 실패: <b>forbidden</b><br>TOPUP_ADMIN_TOKEN 설정 시 token 필요`, true);
          alert("충전 권한 오류(forbidden). 토큰 설정 확인.");
          return;
        }
        setMiniResult(`❌ 충전 실패: <b>${escapeHtml(err)}</b>`, true);
        alert("충전 실패: " + err);
        return;
      }

      // 3) 잔액 갱신
      if(a.newBalance != null) myCurrentBalance = Number(a.newBalance || 0);
      else if(a.user && a.user.balance != null) myCurrentBalance = Number(a.user.balance || 0);
      else await fetchMyBalance();

      localStorage.setItem('myUtPoints', String(myCurrentBalance));

      const utAdded = Math.floor(Number(a.utAdded || 0));
      const appliedFlag = !!a.applied;

      // 4) Supabase 표시용 로그(업서트)
      try{
        const desc =
          `[UT충전:${appliedFlag ? "완료" : "확인"}] ${name} / ` +
          `paid:${amountExact} ${symbol} (≈ ${usdtExact} USDT) / ` +
          `UT_target:${utTarget.toLocaleString()} (added:${utAdded.toLocaleString()}) / user:${myUsername}`;

        await upsertTxByTxid_(txidNorm, {
          username: myUsername,
          donor_name: name,
          type: TOPUP_TYPE_VERIFIED,
          amount: usdtExact,     // ✅ 랭킹/기금은 USDT 등가로 집계
          description: desc,
          txid: txidNorm
        });
      }catch(e){
        console.warn("supabase upsert fail:", e);
      }

      alert(
        (appliedFlag
          ? `✅ 충전 완료!\n${utAdded.toLocaleString()} UT가 충전되었습니다.`
          : `✅ 확인 완료!\n이미 반영된 TXID라 추가 충전은 없었습니다.`) +
        `\n\nTXID: ${txidNorm}`
      );

      document.getElementById("donate-txid").value = "";

      // 5) 화면 갱신
      fetchVaultSumSince();
      fetchRanking();

    } catch(e){
      console.error(e);
      alert("처리 오류: " + (e.message || e));
    } finally {
      setBusyTopup(false);
    }
  }
</script>
</body>
</html>
