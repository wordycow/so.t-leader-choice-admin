<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNIQUE 마켓 – 게시글</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --gold-text: linear-gradient(135deg, #FDE68A 0%, #D4AF37 50%, #B48E25 100%);
      --lime: #d9f99d;
      --lime-accent: #84cc16;
      --card-bg: rgba(6, 78, 59, 0.45);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(0, 0, 0, 0.3);
      --input-focus: rgba(0, 0, 0, 0.5);
      --ink: #f1f5f9;
      --sub: #94a3b8;
      --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.4);
      --r: 24px;
      --r2: 14px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; overflow-x: hidden; }

    body {
      margin: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      color: var(--ink);
      background: #0a0e27 url('img/market-view-background.png') center/cover no-repeat fixed;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15), rgba(2, 6, 23, 0.85) 80%);
      backdrop-filter: blur(2px);
      z-index: -1;
      pointer-events: none;
    }

    .wrap { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }

    .topbar {
      display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;
      margin-bottom: 24px; padding: 12px 20px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 999px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .brand {
      font-weight: 800; font-size: 18px;
      background: var(--gold-text);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 2px 20px rgba(212, 175, 55, 0.3);
    }
    .who { font-size: 13px; color: var(--sub); margin-top: 2px; }

    .btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button { cursor: pointer; user-select: none; }

    .btn {
      padding: 9px 16px; border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #fff; font-weight: 600; font-size: 13px;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }
    .btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-1px); }

    .btn.primary {
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      border: none; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    .btn.primary:hover { box-shadow: 0 6px 16px rgba(16, 185, 129, 0.6); }

    .btn.danger {
      background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); color: #fca5a5;
    }
    .btn.danger:hover { background: rgba(239, 68, 68, 0.4); }

    .btn.bell { position: relative; padding-right: 32px; }
    .badge {
      position: absolute; top: -2px; right: -2px;
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 10px;
      background: #ef4444; color: #fff; font-size: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .pill {
      padding: 12px 16px; border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7; font-size: 13px; margin-bottom: 20px;
      display: none; backdrop-filter: blur(4px);
      text-align: center;
    }

    .card {
      border-radius: var(--r);
      border: 1px solid var(--card-border);
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 100%), var(--card-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 24px; margin-bottom: 24px;
      box-shadow: var(--shadow-soft);
      overflow: visible;
    }

    .title {
      font-size: 24px; font-weight: 800; color: #fff;
      margin-bottom: 12px; line-height: 1.3;
    }
    .meta {
      font-size: 14px; color: var(--sub);
      background: rgba(0,0,0,0.2);
      padding: 12px; border-radius: 12px;
      line-height: 1.6; border: 1px solid rgba(255,255,255,0.05);
    }
    .meta b { color: #e2e8f0; font-weight: 600; }

    .desc {
      margin-top: 20px; font-size: 15px; line-height: 1.7; color: #f1f5f9;
      white-space: pre-wrap;
    }

    #imgBox { margin: 20px 0; }
    .mainImg {
      width: 100%; border-radius: 16px; overflow: hidden;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 10px;
    }
    .mainImg img { width: 100%; display: block; object-fit: contain; max-height: 600px; }

    .thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .thumb {
      min-width: 80px; width: 80px; height: 80px; border-radius: 12px;
      overflow: hidden; border: 1px solid rgba(255,255,255,0.1); cursor: pointer;
      opacity: 0.7; transition: 0.2s; position: relative;
    }
    .thumb:hover { opacity: 1; border-color: var(--lime); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .x {
      position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
      border-radius: 50%; background: rgba(0,0,0,0.7); color: #fff;
      border: none; font-size: 10px; display: flex; align-items: center; justify-content: center;
    }

    input, textarea {
      width: 100%; padding: 14px; border-radius: var(--r2);
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--input-bg); color: #fff; font-size: 14px; outline: none;
      transition: 0.2s;
    }
    input:focus, textarea:focus {
      background: var(--input-focus); border-color: rgba(16, 185, 129, 0.5);
    }
    textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media(max-width:600px){ .row{ grid-template-columns: 1fr; } }

    .muted { color: var(--sub); font-size: 13px; margin-top: 4px; }
    .previewBox {
      background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px;
      border: 1px dashed rgba(255,255,255,0.15); margin-top: 8px; font-size: 13px; color: #cbd5e1;
    }

    #commentList { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }

    .comment {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px; padding: 16px;
      transition: background 0.2s;
    }
    .comment.reply {
      background: rgba(255,255,255,0.03);
      border-left: 2px solid rgba(255,255,255,0.1);
      margin-top: 8px;
    }
    .comment.highlight {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .commentTop { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .commentName { font-weight: 700; font-size: 14px; color: #e2e8f0; }
    .commentTime { font-size: 11px; color: #64748b; margin-top: 2px; }

    .commentBody { font-size: 14px; line-height: 1.5; color: #cbd5e1; white-space: pre-wrap; }

    .commentBtn, .commentDel {
      font-size: 11px; padding: 4px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
      color: var(--lime); cursor: pointer; transition: 0.2s;
    }
    .commentBtn:hover { background: rgba(255,255,255,0.1); }
    .commentDel { color: #fca5a5; border-color: rgba(239,68,68,0.3); }
    .commentDel:hover { background: rgba(239,68,68,0.2); }

    .rich-text a { color: #fbbf24; text-decoration: none; border-bottom: 1px solid rgba(251, 191, 36, 0.4); }
    .rich-text a:hover { color: #fcd34d; border-bottom-color: #fcd34d; }

    .notiPanel {
      position: fixed; top: 80px; right: 20px; width: 340px;
      max-height: calc(100vh - 100px); overflow-y: auto;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      padding: 16px; z-index: 100; display: none;
      backdrop-filter: blur(12px);
    }
    .notiHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .notiItem {
      border-radius: 12px; background: rgba(255,255,255,0.03); padding: 12px; margin-top: 8px; cursor: pointer;
    }
    .notiItem:hover { background: rgba(255,255,255,0.08); }
    .notiItem.unread { background: rgba(16, 185, 129, 0.1); border-left: 3px solid #10b981; }
    .notiTitle { font-weight: 600; font-size: 13px; color: #fff; }
    .notiTime { font-size: 11px; color: #64748b; margin-top: 4px; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    @media (max-width: 520px){
      .wrap { padding: 16px; }
      .title { font-size: 20px; }
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="brand">UNIQUE 마켓 – 게시글</div>
      <div id="who" class="who">로그인 확인 중...</div>
    </div>
    <div class="btns">
      <button class="btn bell" id="btnBell" type="button" style="display:none;">
        🔔 알림 <span id="badge" class="badge">0</span>
      </button>

      <button class="btn" id="btnBack" type="button">← 마켓</button>
      <button class="btn danger" id="btnExit" type="button">나가기</button>
      <button class="btn primary" id="btnLogin" type="button">구글 로그인</button>
      <button class="btn" id="btnReset" type="button">초기화</button>
    </div>
  </div>

  <div id="status" class="pill"></div>

  <div class="card" id="postCard">
    <div id="postTitle" class="title">로딩 중...</div>
    <div id="postMeta" class="meta"></div>
    <div id="imgBox"></div>
    <div id="postDesc" class="desc rich-text"></div>
  </div>

  <div class="card" id="editCard" style="display:none;">
    <div id="editCardTitle" style="font-weight:700; font-size:18px; color:#fff; margin-bottom:12px;">게시글 수정</div>
    <div class="muted" style="margin-bottom:16px;">새 이미지를 선택하면 기존 이미지는 “교체”됩니다. (최대 3개)</div>

    <div class="row">
      <div>
        <div class="muted">제목</div>
        <input id="eTitle" placeholder="제목" />
      </div>
      <div>
        <div class="muted">수량</div>
        <input id="eQty" type="number" placeholder="수량" />
      </div>
    </div>

    <div class="row" style="margin-top:16px;">
      <div>
        <div class="muted">연락처</div>
        <input id="eContact" placeholder="연락처" />
        <div id="eContactPreview" class="previewBox rich-text" style="display:none;"></div>
      </div>
      <div>
        <div class="muted">지역</div>
        <input id="eRegion" placeholder="지역" />
      </div>
    </div>

    <div style="margin-top:16px;">
      <div class="muted">설명</div>
      <textarea id="eDesc" placeholder="설명"></textarea>
      <div id="eDescPreview" class="previewBox rich-text" style="display:none;"></div>
    </div>

    <div style="margin-top:16px;">
      <div class="muted">이미지 교체(선택)</div>
      <input id="eImages" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple style="background:rgba(0,0,0,0.2); cursor:pointer;" />
      <div id="eImgPreview" class="thumbs" style="margin-top:12px;"></div>
    </div>

    <div class="btns" style="margin-top:20px;">
      <button class="btn primary" id="btnUpdate" type="button">수정 저장</button>
      <button class="btn danger" id="btnDeletePost" type="button">게시글 삭제</button>
      <button class="btn" id="btnResetEdit" type="button">되돌리기</button>
    </div>
    <div id="editHint" class="muted" style="margin-top:8px;"></div>
  </div>

  <div class="card" id="comments">
    <div style="font-weight:700; font-size:18px; color:#fff; margin-bottom:12px;">댓글</div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <div id="replying" class="muted" style="display:none;flex:1;min-width:220px;color:var(--lime);"></div>
      <button class="miniBtn" id="btnCancelReply" type="button" style="display:none;padding:4px 8px;border-radius:8px;background:#334155;color:#fff;border:none;">취소</button>
    </div>

    <textarea id="cBody" placeholder="댓글을 입력하세요"></textarea>
    <div id="cBodyPreview" class="previewBox rich-text" style="display:none;"></div>

    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn primary" id="btnComment" type="button">등록</button>
      <button class="btn" id="btnReload" type="button">새로고침</button>
    </div>

    <div id="commentList"></div>
    <div id="commentHint" class="muted" style="margin-top:12px;"></div>
  </div>
</div>

<aside id="notiPanel" class="notiPanel"></aside>

<script>
(() => {
  const SUPABASE_URL = "https://lrpscubricemcgfssjgg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8mMA4oEsuB9j0rc6KsLmtQ_UkJo0Zaq";
  const BUCKET = "market";

  const MARKET_PAGE = "market.html";
  const TOKEN_KEY = "market_access_token";
  const REFRESH_KEY = "market_refresh_token";
  const RETURN_TO_KEY = "market_return_to";
  const NOTI_LAST_ALERT_KEY_PREFIX = "market_noti_last_alert_";

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const notiPanel = $("notiPanel");
  const badge = $("badge");
  const btnBell = $("btnBell");

  const eContactPreview = $("eContactPreview");
  const eDescPreview = $("eDescPreview");
  const cBodyPreview = $("cBodyPreview");

  let accessToken = null;
  let refreshToken = null;
  let user = null;
  let isAdmin = false;
  let currentPost = null;
  let postOwnerId = null;
  let replyToId = null;
  let replyToName = null;
  let commentMap = new Map();

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: {
      fetch: async (url, init = {}) => {
        const headers = new Headers(init.headers || {});
        if (!headers.has("apikey")) headers.set("apikey", SUPABASE_ANON_KEY);
        const u = String(url);
        if (accessToken && (u.includes("/rest/v1/") || u.includes("/storage/v1/") || u.includes("/auth/v1/"))) {
          headers.set("Authorization", "Bearer " + accessToken);
        }
        return fetch(url, { ...init, headers });
      }
    },
    auth: {
      flowType: "implicit",
      detectSessionInUrl: false,
      persistSession: false,
      autoRefreshToken: false,
      storageKey: "sb-market-view"
    }
  });

  async function loadIsAdmin(){
    try{
      const { data, error } = await sb
        .from("market_admins").select("user_id").eq("user_id", user.id).limit(1);
      return !error && Array.isArray(data) && data.length > 0;
    }catch(e){ return false; }
  }

  function setStatus(msg, isErr=false){
    if (!msg){ statusEl.style.display="none"; return; }
    statusEl.style.display="block";
    statusEl.textContent = msg;
    statusEl.style.borderColor = isErr ? "rgba(239,68,68,0.5)" : "rgba(16,185,129,0.3)";
    statusEl.style.background = isErr ? "rgba(239,68,68,0.15)" : "rgba(16,185,129,0.15)";
    statusEl.style.color = isErr ? "#fca5a5" : "#6ee7b7";
  }

  function safeLSSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function safeLSGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function safeLSRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }

  function cleanUrlAll(){
    const u = new URL(location.href);
    u.searchParams.delete("code");
    u.searchParams.delete("state");
    history.replaceState({}, document.title, u.pathname + u.search + u.hash);
  }

  function base64UrlToJson(b64url){
    const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
    const pad = "=".repeat((4 - (b64.length % 4)) % 4);
    const binary = atob(b64 + pad);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const json = new TextDecoder().decode(bytes);
    return JSON.parse(json);
  }

  function decodeJwtPayload(token){
    try{
      const parts = (token || "").split(".");
      if (parts.length < 2) return null;
      return base64UrlToJson(parts[1]);
    }catch(e){ return null; }
  }

  function decodeUserFromAccessToken(token){
    const payload = decodeJwtPayload(token);
    if (!payload) return null;
    return {
      id: payload.sub || "",
      email: payload.email || "",
      name: payload.user_metadata?.full_name || payload.user_metadata?.name || payload.name || ""
    };
  }

  function tokenExpiringSoon(token, skewSec = 120){
    const payload = decodeJwtPayload(token);
    const exp = payload?.exp ? payload.exp * 1000 : 0;
    if (!exp) return true;
    return Date.now() > (exp - skewSec*1000);
  }

  async function refreshTokens(){
    if (!refreshToken) return false;
    try{
      setStatus("로그인 갱신 중...");
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json?.error_description || json?.error || ("HTTP " + res.status));

      accessToken = json.access_token;
      refreshToken = json.refresh_token || refreshToken;
      safeLSSet(TOKEN_KEY, accessToken);
      safeLSSet(REFRESH_KEY, refreshToken);

      user = decodeUserFromAccessToken(accessToken);
      isAdmin = user?.id ? await loadIsAdmin() : false;
      setWho();
      setStatus("");
      return true;
    }catch(e){
      setStatus("로그인 만료: 다시 '구글 로그인' 해주세요.", true);
      return false;
    }
  }

  async function ensureValidAuth(){
    if (!accessToken || !refreshToken) return false;
    if (tokenExpiringSoon(accessToken, 120)) return await refreshTokens();
    return true;
  }

  function loadTokenFromHashOrStorage(){
    const hash = (location.hash || "").replace(/^#/, "");
    if (hash.includes("access_token=")){
      const p = new URLSearchParams(hash);
      const at = p.get("access_token");
      const rt = p.get("refresh_token");
      if (at){
        accessToken = at;
        refreshToken = rt || null;
        safeLSSet(TOKEN_KEY, accessToken);
        if (refreshToken) safeLSSet(REFRESH_KEY, refreshToken);
        cleanUrlAll();
      }
    }
    if (!accessToken){
      accessToken = safeLSGet(TOKEN_KEY);
      refreshToken = safeLSGet(REFRESH_KEY);
    }
  }

  function escapeHtml(s){
    return (s||"").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }

  function escapeAndLinkify(s){
    const safe = escapeHtml(s || "");
    const re = /((https?:\/\/|www\.)[^\s<]+)/gi;
    return safe.replace(re, (m) => {
      let url = m;
      let trail = "";
      while (/[.,!?)}\]]$/.test(url)) {
        trail = url.slice(-1) + trail;
        url = url.slice(0, -1);
      }
      const href = url.startsWith("http") ? url : `https://${url}`;
      return `<a href="${href}" target="_blank" rel="noopener noreferrer nofollow">${url}</a>${trail}`;
    });
  }

  function renderPreview(el, text){
    if (!el) return;
    const v = (text || "").trim();
    if (!v){ el.style.display="none"; el.innerHTML=""; return; }
    el.style.display="";
    el.innerHTML = escapeAndLinkify(v);
  }

  function refreshPreviews(){
    renderPreview(eContactPreview, $("eContact")?.value || "");
    renderPreview(eDescPreview, $("eDesc")?.value || "");
    renderPreview(cBodyPreview, $("cBody")?.value || "");
  }

  document.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (a && a.closest(".rich-text")) e.stopPropagation();
  }, true);

  function formatTime(iso){
    try{ return new Date(iso).toLocaleString(); }
    catch(e){ return iso || ""; }
  }

  function getPostId(){
    const u = new URL(location.href);
    return u.searchParams.get("id") || "";
  }

  function setWho(){
    if (!user?.id){
      $("who").textContent = "익명(열람)";
      $("commentHint").textContent = "댓글/답글/삭제/수정/알림은 로그인 후 가능합니다.";
      btnBell.style.display = "none";
      return;
    }
    const label = user.name || user.email || user.id.slice(0,8);
    $("who").textContent = `로그인: ${label}${isAdmin ? " (관리자)" : ""}`;
    $("commentHint").textContent = "";
    btnBell.style.display = "";
  }

  function marketHtmlUrl(){
    const base = location.pathname.replace(/\/[^\/]*$/, "");
    return location.origin + base + "/" + MARKET_PAGE;
  }

  $("btnBack").onclick = () => location.href = MARKET_PAGE;
  $("btnExit").onclick = () => location.replace("the-unique-gate.html");
  $("btnReset").onclick = () => {
    safeLSRemove(TOKEN_KEY);
    safeLSRemove(REFRESH_KEY);
    safeLSRemove(RETURN_TO_KEY);
    location.href = MARKET_PAGE + "?autologin=1";
  };

  $("btnLogin").onclick = async () => {
    safeLSSet(RETURN_TO_KEY, location.href);
    setStatus("구글 로그인 이동 중...");
    const { data, error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: marketHtmlUrl(), skipBrowserRedirect: true }
    });
    if (error) return setStatus("로그인 실패: " + error.message, true);
    if (data?.url) location.assign(data.url);
  };

  $("eContact").addEventListener("input", refreshPreviews);
  $("eDesc").addEventListener("input", refreshPreviews);
  $("cBody").addEventListener("input", refreshPreviews);

  // ✅ 로그인 없어도 게시글/댓글은 로드(여기서 ensureValidAuth 제거)
  async function loadPost(){
    const postId = getPostId();
    if (!postId) {
      setStatus("잘못된 접근: id가 없습니다.", true);
      $("postTitle").textContent = "ID 없음";
      return null;
    }

    const { data, error } = await sb.from("market_posts").select("*").eq("id", postId).single();
    if (error) {
      setStatus("게시글 불러오기 실패", true);
      $("postTitle").textContent = "불러오기 실패";
      return null;
    }
    postOwnerId = data.owner || null;
    return data;
  }

  function renderImages(urls){
    const box = $("imgBox");
    box.innerHTML = "";
    if (!urls || !urls.length) return;

    const main = document.createElement("div");
    main.className = "mainImg";
    main.innerHTML = `<img id="mainImg" src="${urls[0]}" alt="">`;
    box.appendChild(main);

    if (urls.length > 1){
      const thumbs = document.createElement("div");
      thumbs.className = "thumbs";
      urls.forEach((u) => {
        const t = document.createElement("div");
        t.className = "thumb";
        t.innerHTML = `<img src="${u}" alt="">`;
        t.onclick = () => { const img = document.getElementById("mainImg"); if (img) img.src = u; };
        thumbs.appendChild(t);
      });
      box.appendChild(thumbs);
    }
  }

  function renderPost(p){
    $("postTitle").textContent = p.title || "(제목 없음)";
    $("postMeta").innerHTML =
      `수량: <b>${escapeHtml(p.qty ?? "-")}</b> · 지역: <b>${escapeHtml(p.region || "-")}</b><br>` +
      `연락: <span class="rich-text"><b>${escapeAndLinkify(p.contact || "-")}</b></span><br>` +
      `작성자: <b>${escapeHtml(p.owner_name || "-")}</b> · ${escapeHtml(formatTime(p.created_at))}`;

    $("postDesc").innerHTML = escapeAndLinkify(p.description || "");
    renderImages(Array.isArray(p.images) ? p.images : []);
  }

  let selectedFiles = [];
  let previewUrls = [];

  function clearPreviews(){
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = [];
    $("eImages").value = "";
    $("eImgPreview").innerHTML = "";
  }

  function renderPreviews2(){
    const box = $("eImgPreview");
    box.innerHTML = "";
    selectedFiles.slice(0,3).forEach((file, idx) => {
      const url = URL.createObjectURL(file);
      previewUrls.push(url);
      const d = document.createElement("div");
      d.className = "thumb";
      d.innerHTML = `<img src="${url}" alt=""><button class="x" type="button">X</button>`;
      d.querySelector(".x").onclick = () => {
        selectedFiles.splice(idx, 1);
        renderPreviews2();
      };
      box.appendChild(d);
    });
  }

  $("eImages").addEventListener("change", (e) => {
    previewUrls.forEach(u => URL.revokeObjectURL(u));
    previewUrls = [];
    selectedFiles = Array.from(e.target.files || []).slice(0,3);
    renderPreviews2();
  });

  function fillEditForm(p){
    $("eTitle").value = p.title || "";
    $("eQty").value = (p.qty ?? "");
    $("eContact").value = p.contact || "";
    $("eRegion").value = p.region || "";
    $("eDesc").value = p.description || "";
    $("editHint").textContent = "";
    clearPreviews();
    refreshPreviews();
  }

  function fileExt(file){
    const n = file.name || "";
    const dot = n.lastIndexOf(".");
    return dot >= 0 ? n.slice(dot+1).toLowerCase() : "png";
  }

  function toPublicUrl(path){
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  function storagePathFromPublicUrl(url){
    try{
      const marker = `/storage/v1/object/public/${BUCKET}/`;
      const idx = url.indexOf(marker);
      if (idx < 0) return null;
      return url.slice(idx + marker.length);
    }catch(e){ return null; }
  }

  async function removeOldImages(urls){
    const paths = (urls || []).map(storagePathFromPublicUrl).filter(Boolean);
    if (!paths.length) return;
    await sb.storage.from(BUCKET).remove(paths);
  }

  async function uploadImages(postId){
    if (!selectedFiles.length) return null;
    const ok = await ensureValidAuth();
    if (!ok) throw new Error("로그인 필요");
    const urls = [];
    for (let i=0; i<Math.min(3, selectedFiles.length); i++){
      const f = selectedFiles[i];
      const ext = fileExt(f);
      const path = `posts/${postId}/${Date.now()}_${i}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, f, { upsert:false, contentType:f.type });
      if (error) throw new Error(error.message);
      urls.push(toPublicUrl(path));
    }
    return urls;
  }

  async function updatePost(){
    const ok = await ensureValidAuth();
    if (!ok) return setStatus("수정은 로그인 후 가능합니다.", true);
    user = decodeUserFromAccessToken(accessToken);
    if (!user?.id) return setStatus("유저 정보 확인 불가", true);
    if (!currentPost || !(currentPost.owner === user.id || isAdmin)) return setStatus("권한이 없습니다.", true);

    const title = ($("eTitle").value || "").trim();
    if (!title) return setStatus("제목은 필수입니다.", true);
    const qty = $("eQty").value ? parseInt($("eQty").value, 10) : null;
    const contact = ($("eContact").value || "").trim();
    const region = ($("eRegion").value || "").trim();
    const description = ($("eDesc").value || "").trim();

    setStatus("수정 중...");
    const { error: e1 } = await sb.from("market_posts").update({ title, qty, contact, region, description }).eq("id", currentPost.id);
    if (e1) return setStatus("수정 실패: " + e1.message, true);

    try{
      const newUrls = await uploadImages(currentPost.id);
      if (Array.isArray(newUrls) && newUrls.length){
        try{ await removeOldImages(Array.isArray(currentPost.images)?currentPost.images:[]); }catch(e){}
        const { error: e2 } = await sb.from("market_posts").update({ images: newUrls }).eq("id", currentPost.id);
        if (e2) return setStatus("이미지 갱신 실패", true);
      }
    }catch(e){ return setStatus("이미지 업로드 실패", true); }

    setStatus("수정 완료!");
    currentPost = await loadPost();
    if (currentPost){
      renderPost(currentPost);
      fillEditForm(currentPost);
    }
  }

  async function deletePost(){
    const ok = await ensureValidAuth();
    if (!ok) return setStatus("삭제는 로그인 후 가능합니다.", true);
    user = decodeUserFromAccessToken(accessToken);
    if (!user?.id) return setStatus("유저 정보 확인 불가", true);
    if (!currentPost || !(currentPost.owner === user.id || isAdmin)) return setStatus("권한이 없습니다.", true);

    if (!confirm("정말 게시글을 삭제할까요?")) return;
    setStatus("삭제 중...");
    try{ await removeOldImages(Array.isArray(currentPost.images)?currentPost.images:[]); }catch(e){}

    const { error } = await sb.from("market_posts").delete().eq("id", currentPost.id);
    if (error) return setStatus("게시글 삭제 실패 (댓글이 있으면 DB Cascade 필요)", true);

    setStatus("삭제 완료! 마켓으로 이동합니다.");
    setTimeout(() => location.href = MARKET_PAGE, 500);
  }

  $("btnUpdate").onclick = () => updatePost();
  $("btnDeletePost").onclick = () => deletePost();
  $("btnResetEdit").onclick = () => { if (currentPost) fillEditForm(currentPost); };

  function setReplyTarget(c){
    replyToId = c.id;
    replyToName = c.owner_name || "익명";
    $("replying").style.display = "";
    $("btnCancelReply").style.display = "";
    $("replying").textContent = `답글 대상: ${replyToName}`;
    const ta = $("cBody");
    ta.placeholder = `@${replyToName} 에게 답글...`;
    setTimeout(() => ta.focus(), 60);
  }

  function clearReplyTarget(){
    replyToId = null;
    replyToName = null;
    $("replying").style.display = "none";
    $("btnCancelReply").style.display = "none";
    $("cBody").placeholder = "댓글을 입력하세요";
  }
  $("btnCancelReply").onclick = () => clearReplyTarget();

  // ✅ 로그인 없어도 댓글 목록 로드 가능
  async function loadComments(){
    const postId = getPostId();
    const { data, error } = await sb.from("market_comments").select("*").eq("post_id", postId).order("created_at", { ascending: true });
    if (error) return [];
    return data || [];
  }

  function buildTree(raw){
    const list = (raw || []).map(c => ({...c, children:[]}));
    const byId = new Map();
    list.forEach(c => byId.set(c.id, c));
    const roots = [];
    list.forEach(c => {
      const pid = c.parent_id;
      if (pid && byId.has(pid)) byId.get(pid).children.push(c);
      else roots.push(c);
    });
    return { roots, byId };
  }

  function renderNode(c, depth){
    const canDelete = user?.id && (isAdmin || postOwnerId === user.id || c.owner === user.id);
    const indent = Math.min(depth, 5) * 20;

    return `
      <div class="comment ${depth ? "reply" : ""}" id="c_${c.id}" style="margin-left:${indent}px;">
        <div class="commentTop">
          <div>
            <span class="commentName">${escapeHtml(c.owner_name || "익명")}</span>
            <span class="commentTime"> · ${escapeHtml(formatTime(c.created_at))}</span>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="commentBtn" data-act="reply" data-id="${c.id}" type="button">답글</button>
            ${canDelete ? `<button class="commentDel" data-act="del" data-id="${c.id}" type="button">삭제</button>` : ``}
          </div>
        </div>
        <div class="commentBody rich-text">${escapeAndLinkify(c.body || "")}</div>
      </div>
      ${(c.children || []).map(ch => renderNode(ch, depth + 1)).join("")}
    `;
  }

  function renderComments(list){
    const box = $("commentList");
    if (!list.length) {
      box.innerHTML = `<div class="muted" style="margin-top:10px;">아직 댓글이 없습니다.</div>`;
      commentMap = new Map();
      return;
    }
    const { roots, byId } = buildTree(list);
    commentMap = byId;
    box.innerHTML = roots.map(r => renderNode(r, 0)).join("");
  }

  async function addComment(){
    const ok = await ensureValidAuth();
    if (!ok) return setStatus("댓글/답글은 로그인 후 가능합니다.", true);
    user = decodeUserFromAccessToken(accessToken);
    if (!user?.id) return setStatus("유저 정보 확인 불가", true);

    const postId = getPostId();
    const body = ($("cBody").value || "").trim();
    if (!body) return setStatus("내용을 입력하세요.", true);

    setStatus("등록 중...");
    const { error } = await sb.from("market_comments").insert({
      post_id: postId, owner: user.id, owner_name: user.name || user.email || "",
      body, parent_id: replyToId || null
    });

    if (error) return setStatus("등록 실패: " + error.message, true);

    $("cBody").value = "";
    clearReplyTarget();
    refreshPreviews();
    setStatus("등록 완료!");
    renderComments(await loadComments());
    await refreshBadge();
    await checkNewNotiAlert();
  }

  async function deleteComment(id){
    const ok = await ensureValidAuth();
    if (!ok) return setStatus("로그인 필요", true);
    if (!confirm("삭제하시겠습니까?")) return;
    const { error } = await sb.from("market_comments").delete().eq("id", id);
    if (error) return setStatus("삭제 실패", true);
    setStatus("삭제 완료");
    renderComments(await loadComments());
  }

  $("btnComment").onclick = () => addComment();
  $("btnReload").onclick = async () => renderComments(await loadComments());

  $("commentList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.getAttribute("data-act");
    const id = btn.getAttribute("data-id");
    const c = commentMap.get(id);
    if (!c) return;

    if (act === "reply"){
      if (!user?.id) return setStatus("답글은 로그인 후 가능합니다.", true);
      setReplyTarget(c);
      return;
    }
    if (act === "del"){
      deleteComment(id);
      return;
    }
  });

  function scrollToAnchor(){
    const h = location.hash || "";
    if (h === "#comments"){
      setTimeout(() => document.getElementById("comments")?.scrollIntoView({ behavior:"smooth", block:"start" }), 100);
      return;
    }
    if (h.startsWith("#c_")){
      const el = document.getElementById(h.slice(1));
      if (!el) return;
      setTimeout(() => {
        el.scrollIntoView({ behavior:"smooth", block:"center" });
        el.classList.add("highlight");
        setTimeout(() => el.classList.remove("highlight"), 2000);
      }, 150);
    }
  }
  window.addEventListener("hashchange", scrollToAnchor);

  function notiText(n){
    const who = n.actor_name || "누군가";
    if (n.type === "post_comment") return `${who}님이 내 게시물에 댓글을 달았어요`;
    if (n.type === "comment_reply") return `${who}님이 내 댓글에 답글을 달았어요`;
    return `${who}님의 알림`;
  }
  function toggleNotiPanel(show){
    const isOpen = notiPanel.style.display !== "none" && notiPanel.style.display !== "";
    const next = (show === undefined) ? !isOpen : show;
    notiPanel.style.display = next ? "" : "none";
  }
  async function getUnreadCount(){
    const { count, error } = await sb.from("market_notifications").select("id", { count: "exact", head: true }).eq("recipient", user.id).eq("read", false);
    return (!error && typeof count === "number") ? count : null;
  }
  async function loadNotiList(){
    const { data } = await sb.from("market_notifications").select("*").eq("recipient", user.id).order("created_at", { ascending:false }).limit(30);
    return data || [];
  }
  async function markAllRead(){
    await sb.from("market_notifications").update({ read: true }).eq("recipient", user.id).eq("read", false);
  }
  async function markRead(id){
    await sb.from("market_notifications").update({ read:true }).eq("id", id);
  }
  async function refreshBadge(){
    if (!user?.id) return;
    const c = await getUnreadCount();
    if (c !== null && c > 0) { badge.style.display = ""; badge.textContent = String(c); }
    else badge.style.display = "none";
  }

  function renderNotiPanel(list){
    const items = list.length
      ? list.map(n => `
        <div class="notiItem ${n.read ? "" : "unread"}" data-id="${n.id}"
             data-post="${n.post_id}" data-comment="${n.comment_id}">
          <div class="notiTitle">${escapeHtml(notiText(n))}</div>
          <div class="notiTime">${escapeHtml(formatTime(n.created_at))}</div>
        </div>
      `).join("")
      : `<div class="muted">알림이 없습니다.</div>`;

    notiPanel.innerHTML = `
      <div class="notiHead">
        <div style="font-weight:700;">알림</div>
        <div style="display:flex;gap:8px;">
          <button class="commentBtn" id="btnReadAll" type="button">모두 읽음</button>
          <button class="commentBtn" id="btnCloseNoti" type="button">닫기</button>
        </div>
      </div>
      ${items}
    `;

    notiPanel.querySelector("#btnCloseNoti").onclick = () => toggleNotiPanel(false);
    notiPanel.querySelector("#btnReadAll").onclick = async () => {
      await markAllRead();
      await refreshBadge();
      renderNotiPanel(await loadNotiList());
    };
    notiPanel.querySelectorAll(".notiItem").forEach(el => {
      el.addEventListener("click", async () => {
        const id = el.getAttribute("data-id");
        const postId = el.getAttribute("data-post");
        const cId = el.getAttribute("data-comment");
        if (id) await markRead(id);
        await refreshBadge();
        toggleNotiPanel(false);
        if (getPostId() === postId) { location.hash = `#c_${cId}`; scrollToAnchor(); }
        else location.href = `market-view.html?id=${encodeURIComponent(postId)}#c_${cId}`;
      });
    });
  }

  async function checkNewNotiAlert(){
    const key = NOTI_LAST_ALERT_KEY_PREFIX + user.id;
    const last = safeLSGet(key);
    const { data } = await sb.from("market_notifications").select("*").eq("recipient", user.id).eq("read", false).order("created_at", { ascending:false }).limit(1);
    const top = (data && data[0]) ? data[0] : null;
    if (!top) return;
    const topAt = top.created_at || "";
    if (last && topAt <= last) return;
    safeLSSet(key, topAt);
    setStatus("🔔 새 알림: " + notiText(top));
    setTimeout(() => setStatus(""), 3500);
  }

  btnBell.addEventListener("click", async () => {
    const ok = await ensureValidAuth();
    if (!ok) return setStatus("알림 확인은 로그인 필요", true);
    toggleNotiPanel();
    if (notiPanel.style.display !== "none") {
      renderNotiPanel(await loadNotiList());
      await refreshBadge();
    }
  });

  // Boot
  (async () => {
    loadTokenFromHashOrStorage();
    refreshPreviews();

    // 로그인 상태 세팅(없어도 OK)
    if (accessToken && refreshToken){
      await ensureValidAuth();
      user = decodeUserFromAccessToken(accessToken);
      if (user?.id) isAdmin = await loadIsAdmin();
    }
    setWho();

    currentPost = await loadPost();
    if (currentPost){
      renderPost(currentPost);

      const canEdit = user?.id && (currentPost.owner === user.id || isAdmin);
      $("editCard").style.display = canEdit ? "" : "none";
      if (canEdit){
        fillEditForm(currentPost);
        if (isAdmin && currentPost.owner !== user.id) $("editCardTitle").textContent += " (관리자)";
      }
    }

    renderComments(await loadComments());
    scrollToAnchor();

    if (user?.id){
      await refreshBadge();
      await checkNewNotiAlert();
      setInterval(async () => {
        if (!accessToken) return;
        if (tokenExpiringSoon(accessToken, 120)) await refreshTokens();
        if (user?.id) { await refreshBadge(); await checkNewNotiAlert(); }
      }, 15000);
    }
  })();
})();
</script>
</body>
</html>
