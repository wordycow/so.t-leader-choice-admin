<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>정통 사주팔자 - THE UNIQUE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- ✨ THE UNIQUE LEGENDARY DESIGN SYSTEM v4.0 -->
  <link rel="stylesheet" href="css/the-unique-core.css">
  
  <!-- 🎯 HOVER VISIBILITY ENHANCEMENT v4.1 -->
  <link rel="stylesheet" href="css/hover-visibility-enhanced.css">
  
  <style>
    :root {
      --bg-dark: #1a0f0a;
      --bg-paper: #f9f5e8;
      --gold: #d4af37;
      --gold-light: #f0d98c;
      --red: #c41e3a;
      --blue: #2e5090;
      --green: #2d5016;
      --brown: #6b4423;
      --text-dark: #2a1810;
      --text-light: #6b5545;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif KR', 'Nanum Myeongjo', serif;
      background: 
        #1a0f0a url('img/saju-background.png') center/cover no-repeat fixed;
      background-size: cover, 800px 800px, 600px 600px, 80px 80px;
      background-position: center, top left, bottom right, center;
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(212,175,55,0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(196,30,58,0.12) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
      animation: ambientGlow 8s ease-in-out infinite alternate;
    }

    @keyframes ambientGlow {
      0% { opacity: 0.5; }
      100% { opacity: 0.7; }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    
    @keyframes slideInRight {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes slideOutRight {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(400px); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease;
    }

    .header-title {
      font-size: 56px;
      font-weight: 900;
      font-family: 'Nanum Myeongjo', serif;
      background: linear-gradient(135deg, 
        #d4af37 0%,
        #f0d98c 30%,
        #c41e3a 50%,
        #f0d98c 70%,
        #d4af37 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.18em;
      margin-bottom: 16px;
      animation: gentleShine 6s linear infinite, headerFloat 4s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(212,175,55,0.6)) drop-shadow(0 0 15px rgba(196,30,58,0.3));
      position: relative;
    }

    .header-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 2px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        #d4af37 20%, 
        #c41e3a 50%, 
        #d4af37 80%, 
        transparent 100%
      );
      opacity: 0.6;
    }

    @keyframes gentleShine {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @keyframes headerFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .header-subtitle {
      font-size: 18px;
      color: var(--gold-light);
      letter-spacing: 0.3em;
      opacity: 0.85;
    }

    .main-card {
      background: 
        linear-gradient(135deg,
          rgba(249,245,232,0.98) 0%,
          rgba(255,251,240,0.95) 50%,
          rgba(249,245,232,0.98) 100%
        );
      border: 3px solid transparent;
      background-clip: padding-box;
      border-radius: 28px;
      padding: 55px 45px;
      position: relative;
      box-shadow: 
        0 25px 70px rgba(0,0,0,0.7),
        0 0 60px rgba(212,175,55,0.2),
        inset 0 1px 0 rgba(255,255,255,0.8),
        inset 0 -1px 0 rgba(0,0,0,0.1);
      animation: fadeInUp 0.8s ease 0.2s both, cardElegantFloat 8s ease-in-out infinite;
    }

    .main-card::before {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      background: linear-gradient(135deg, 
        #d4af37 0%,
        #c41e3a 25%,
        #d4af37 50%,
        #c41e3a 75%,
        #d4af37 100%
      );
      background-size: 300% 300%;
      border-radius: 28px;
      z-index: -1;
      animation: traditionalBorderFlow 6s ease infinite;
    }

    /* 한지 텍스처 오버레이 */
    .main-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, transparent 1px, transparent 2px, rgba(0,0,0,0.02) 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.02) 0px, transparent 1px, transparent 2px, rgba(0,0,0,0.02) 3px);
      opacity: 0.3;
      pointer-events: none;
      border-radius: 28px;
    }

    @keyframes traditionalBorderFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes cardElegantFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .form-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--red);
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 0.1em;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid rgba(212,175,55,0.3);
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Noto Serif KR', serif;
      background: rgba(255,255,255,0.9);
      color: var(--text-dark);
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
    }

    .date-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .time-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .gender-group {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 12px 24px;
      border: 2px solid rgba(212,175,55,0.3);
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .radio-label:hover {
      border-color: var(--gold);
      background: rgba(212,175,55,0.05);
    }

    .radio-label input[type="radio"]:checked + span {
      color: var(--red);
      font-weight: 700;
    }

    .btn-submit {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--red) 0%, #8b1028 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      margin-top: 30px;
      box-shadow: 0 10px 30px rgba(196,30,58,0.4);
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(196,30,58,0.5);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .result-section {
      display: none;
      animation: fadeIn 0.8s ease;
    }

    .result-section.active {
      display: block;
    }

    /* 사주 원국 테이블 */
    .saju-table {
      margin: 30px 0;
      border: 3px solid var(--gold);
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .saju-table table {
      width: 100%;
      border-collapse: collapse;
    }

    .saju-table th {
      background: linear-gradient(135deg, var(--gold) 0%, #c4975a 100%);
      color: white;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.1em;
    }

    .saju-table td {
      padding: 20px;
      text-align: center;
      border: 1px solid #e5e7eb;
      font-size: 20px;
      font-weight: 600;
    }

    .pillar-name {
      background: #f9fafb;
      font-weight: 700;
      color: var(--red);
    }

    .heavenly {
      font-size: 28px;
      font-weight: 900;
      color: var(--red);
    }

    .earthly {
      font-size: 28px;
      font-weight: 900;
      color: var(--blue);
    }

    /* 오행 분석 */
    .element-analysis {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin: 30px 0;
    }

    .element-card {
      background: white;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px 10px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .element-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .element-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .element-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .element-count {
      font-size: 24px;
      font-weight: 900;
    }

    .element-wood { border-color: #10b981; color: #10b981; }
    .element-fire { border-color: #ef4444; color: #ef4444; }
    .element-earth { border-color: #f59e0b; color: #f59e0b; }
    .element-metal { border-color: #6b7280; color: #6b7280; }
    .element-water { border-color: #3b82f6; color: #3b82f6; }

    /* 운세 섹션 */
    .fortune-section {
      background: white;
      border: 2px solid rgba(212,175,55,0.3);
      border-radius: 12px;
      padding: 30px;
      margin: 20px 0;
    }

    .fortune-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--red);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fortune-content {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-dark);
    }

    .fortune-rating {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .rating-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
    }

    .stars {
      display: flex;
      gap: 4px;
    }

    .star {
      font-size: 20px;
    }

    .star.filled {
      color: #fbbf24;
    }

    .star.empty {
      color: #d1d5db;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }

      .main-card {
        padding: 30px 20px;
      }

      .header-title {
        font-size: 32px;
      }

      .date-inputs {
        grid-template-columns: 1fr;
      }

      .element-analysis {
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }

      .element-card {
        padding: 15px 5px;
      }

      .element-icon {
        font-size: 24px;
      }

      .element-name {
        font-size: 13px;
      }

      .element-count {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="header-title">정통 사주팔자</h1>
      <p class="header-subtitle">四柱八字 萬歲曆</p>
      
      <!-- UT 잔액 표시 -->
      <div class="ut-balance-display" style="margin-top: 20px; padding: 12px 24px; background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.25)); border: 2px solid rgba(212,175,55,0.5); border-radius: 50px; display: inline-block; animation: pulse 2s ease-in-out infinite;">
        <span style="color: #f0d98c; font-size: 14px; font-weight: 600; letter-spacing: 0.05em;">💰 보유 UT: </span>
        <span id="saju-ut-balance" style="color: #fff; font-size: 18px; font-weight: 900; text-shadow: 0 0 10px rgba(212,175,55,0.8);">0</span>
        <span style="color: #f0d98c; font-size: 14px; font-weight: 600;"> UT</span>
      </div>
      
      <!-- 사주 분석 비용 안내 -->
      <div style="margin-top: 12px; color: #f0d98c; font-size: 13px; opacity: 0.9;">
        📋 사주 분석 비용: <strong style="color: #fff;">1000 UT</strong>
      </div>
    </div>

    <div class="main-card">
      <!-- 입력 폼 -->
      <div id="inputForm">
        <h2 class="form-title">생년월일시 입력</h2>
        
        <form id="sajuForm">
          <div class="form-group">
            <label class="form-label">성명</label>
            <input type="text" class="input-field" id="userName" placeholder="홍길동" required>
          </div>

          <div class="form-group">
            <label class="form-label">성별</label>
            <div class="gender-group">
              <label class="radio-label">
                <input type="radio" name="gender" value="M" checked>
                <span>남성</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="gender" value="F">
                <span>여성</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">생년월일 (양력)</label>
            <div class="date-inputs">
              <input type="number" class="input-field" id="birthYear" placeholder="1990" min="1900" max="2025" required>
              <input type="number" class="input-field" id="birthMonth" placeholder="1" min="1" max="12" required>
              <input type="number" class="input-field" id="birthDay" placeholder="1" min="1" max="31" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">출생 시간 (모르면 12시로 입력)</label>
            <div class="time-inputs">
              <input type="number" class="input-field" id="birthHour" placeholder="12" min="0" max="23" value="12" required>
              <input type="number" class="input-field" id="birthMinute" placeholder="0" min="0" max="59" value="0" required>
            </div>
          </div>

          <button type="submit" class="btn-submit">사주 풀이 시작</button>
        </form>
      </div>

      <!-- 결과 화면 -->
      <div id="resultSection" class="result-section">
        <h2 class="form-title" id="resultName"></h2>

        <!-- 사주 원국 -->
        <div class="saju-table">
          <table>
            <thead>
              <tr>
                <th>구분</th>
                <th>시주 (時柱)</th>
                <th>일주 (日柱)</th>
                <th>월주 (月柱)</th>
                <th>년주 (年柱)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="pillar-name">천간 (天干)</td>
                <td class="heavenly" id="hourStem"></td>
                <td class="heavenly" id="dayStem"></td>
                <td class="heavenly" id="monthStem"></td>
                <td class="heavenly" id="yearStem"></td>
              </tr>
              <tr>
                <td class="pillar-name">지지 (地支)</td>
                <td class="earthly" id="hourBranch"></td>
                <td class="earthly" id="dayBranch"></td>
                <td class="earthly" id="monthBranch"></td>
                <td class="earthly" id="yearBranch"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 오행 분석 -->
        <h3 class="fortune-title" style="margin-top: 40px;">🔮 오행 분석 (五行分析)</h3>
        <div class="element-analysis">
          <div class="element-card element-wood">
            <img src="img/cards/saju/wood.png" alt="木" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 12px rgba(45,80,22,0.3);">
            <div class="element-name">木</div>
            <div class="element-count" id="woodCount">0</div>
          </div>
          <div class="element-card element-fire">
            <img src="img/cards/saju/fire.png" alt="火" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 12px rgba(196,30,58,0.3);">
            <div class="element-name">火</div>
            <div class="element-count" id="fireCount">0</div>
          </div>
          <div class="element-card element-earth">
            <img src="img/cards/saju/earth.png" alt="土" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 12px rgba(107,68,35,0.3);">
            <div class="element-name">土</div>
            <div class="element-count" id="earthCount">0</div>
          </div>
          <div class="element-card element-metal">
            <img src="img/cards/saju/metal.png" alt="金" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 12px rgba(212,175,55,0.3);">
            <div class="element-name">金</div>
            <div class="element-count" id="metalCount">0</div>
          </div>
          <div class="element-card element-water">
            <img src="img/cards/saju/water.png" alt="水" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 12px rgba(46,80,144,0.3);">
            <div class="element-name">水</div>
            <div class="element-count" id="waterCount">0</div>
          </div>
        </div>

        <!-- 일간 분석 -->
        <div class="fortune-section">
          <h3 class="fortune-title">👤 일간 (日干) 분석 - 타고난 성격</h3>
          <div class="fortune-content" id="dayMasterAnalysis"></div>
        </div>

        <!-- 종합 운세 -->
        <div class="fortune-section">
          <h3 class="fortune-title">✨ 종합 사주 해석</h3>
          <div class="fortune-content" id="overallFortune"></div>
        </div>

        <!-- 직업운 -->
        <div class="fortune-section">
          <h3 class="fortune-title">💼 직업운 · 재물운</h3>
          <div class="fortune-content" id="careerFortune"></div>
          <div class="fortune-rating">
            <span class="rating-label">직업 적합도:</span>
            <div class="stars" id="careerStars"></div>
          </div>
        </div>

        <!-- 연애운 -->
        <div class="fortune-section">
          <h3 class="fortune-title">💕 연애운 · 대인관계</h3>
          <div class="fortune-content" id="loveFortune"></div>
          <div class="fortune-rating">
            <span class="rating-label">인연 지수:</span>
            <div class="stars" id="loveStars"></div>
          </div>
        </div>

        <!-- 건강운 -->
        <div class="fortune-section">
          <h3 class="fortune-title">🏥 건강운</h3>
          <div class="fortune-content" id="healthFortune"></div>
          <div class="fortune-rating">
            <span class="rating-label">건강 지수:</span>
            <div class="stars" id="healthStars"></div>
          </div>
        </div>

        <!-- 2026년 운세 -->
        <div class="fortune-section">
          <h3 class="fortune-title">🎯 2026년 운세 (丙午년)</h3>
          <div class="fortune-content" id="yearFortune"></div>
          <div class="fortune-rating">
            <span class="rating-label">올해 운세:</span>
            <div class="stars" id="yearStars"></div>
          </div>
        </div>

        <button type="button" class="btn-submit" onclick="resetForm()">다시 보기</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // 만세력 데이터베이스
    // ============================================
    
    // 천간 (天干) - 10개
    const HEAVENLY_STEMS = [
      { char: '甲', name: '갑목', element: 'wood', yin: false },
      { char: '乙', name: '을목', element: 'wood', yin: true },

    function calculateSaju(year, month, day, hour) {
      // 년주 계산
      const yearStemIdx = (year - 4) % 10;
      const yearBranchIdx = (year - 4) % 12;

      // 월주 계산 (간단한 알고리즘)
      const monthInfo = MONTH_STEMS[month - 1];
      const monthStemIdx = monthInfo.stem;
      const monthBranchIdx = monthInfo.branch;

      // 일주 계산 (율리우스일 기준)
      const baseDate = new Date(1900, 0, 1);
      const currentDate = new Date(year, month - 1, day);
      const daysDiff = Math.floor((currentDate - baseDate) / (1000 * 60 * 60 * 24));
      const dayStemIdx = (daysDiff + 6) % 10;
      const dayBranchIdx = (daysDiff + 0) % 12;

      // 시주 계산
      const hourBranchIdx = Math.floor((hour + 1) / 2) % 12;
      const hourStemIdx = (dayStemIdx * 2 + hourBranchIdx) % 10;

      return {
        year: { stem: HEAVENLY_STEMS[yearStemIdx], branch: EARTHLY_BRANCHES[yearBranchIdx] },
        month: { stem: HEAVENLY_STEMS[monthStemIdx], branch: EARTHLY_BRANCHES[monthBranchIdx] },
        day: { stem: HEAVENLY_STEMS[dayStemIdx], branch: EARTHLY_BRANCHES[dayBranchIdx] },
        hour: { stem: HEAVENLY_STEMS[hourStemIdx], branch: EARTHLY_BRANCHES[hourBranchIdx] }
      };
    }

        elements[saju[pillar].stem.element]++;
        elements[saju[pillar].branch.element]++;
      });

      return elements;
    }

        animation: slideInRight 0.5s ease;
      `;
      notification.innerHTML = `💸 ${SAJU_COST} UT 차감<br><small style="font-size:13px; opacity:0.9;">잔액: ${newBalance} UT</small>`;
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'slideOutRight 0.5s ease';
        setTimeout(() => notification.remove(), 500);
      }, 3000);

      const name = document.getElementById('userName').value.trim();
      const gender = document.querySelector('input[name="gender"]:checked').value;
      const year = parseInt(document.getElementById('birthYear').value);
      const month = parseInt(document.getElementById('birthMonth').value);
      const day = parseInt(document.getElementById('birthDay').value);
      const hour = parseInt(document.getElementById('birthHour').value);

      if (!name || !year || !month || !day) {
        alert('모든 필수 항목을 입력해주세요.');
        return;
      }

      // 사주 계산
      const saju = calculateSaju(year, month, day, hour);
      const elements = calculateElements(saju);

      // 결과 표시
      document.getElementById('resultName').textContent = `${name}님의 사주팔자`;

      // 사주 원국 표시
      document.getElementById('yearStem').textContent = saju.year.stem.char;
      document.getElementById('yearBranch').textContent = saju.year.branch.char;
      document.getElementById('monthStem').textContent = saju.month.stem.char;
      document.getElementById('monthBranch').textContent = saju.month.branch.char;
      document.getElementById('dayStem').textContent = saju.day.stem.char;
      document.getElementById('dayBranch').textContent = saju.day.branch.char;
      document.getElementById('hourStem').textContent = saju.hour.stem.char;
      document.getElementById('hourBranch').textContent = saju.hour.branch.char;

      // 오행 개수 표시
      document.getElementById('woodCount').textContent = elements.wood;
      document.getElementById('fireCount').textContent = elements.fire;
      document.getElementById('earthCount').textContent = elements.earth;
      document.getElementById('metalCount').textContent = elements.metal;
      document.getElementById('waterCount').textContent = elements.water;

      // 일간 분석
      document.getElementById('dayMasterAnalysis').textContent = analyzeDayMaster(saju.day.stem.char);

      // 종합 운세
      document.getElementById('overallFortune').textContent = analyzeOverallFortune(elements, saju.day.stem.char);

      // 직업운
      const career = analyzeCareerFortune(elements, saju.day.stem.char);
      document.getElementById('careerFortune').textContent = career.text;
      document.getElementById('careerStars').innerHTML = createStars(career.rating);

      // 연애운
      const love = analyzeLoveFortune(elements, gender);
      document.getElementById('loveFortune').textContent = love.text;
      document.getElementById('loveStars').innerHTML = createStars(love.rating);

      // 건강운
      const health = analyzeHealthFortune(elements);
      document.getElementById('healthFortune').textContent = health.text;
      document.getElementById('healthStars').innerHTML = createStars(health.rating);

      // 2026년 운세
      const year2026 = analyze2026Fortune(saju.day.stem.char);
      document.getElementById('yearFortune').textContent = year2026.text;
      document.getElementById('yearStars').innerHTML = createStars(year2026.rating);

      // 화면 전환
      document.getElementById('inputForm').style.display = 'none';
      document.getElementById('resultSection').classList.add('active');

      // 스크롤 최상단으로
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      // ⚡ AI 분석 버튼 추가
      setTimeout(() => initSajuAIButton(saju, elements, gender), 100);
    });

    function resetForm() {
      document.getElementById('inputForm').style.display = 'block';
      document.getElementById('resultSection').classList.remove('active');
      document.getElementById('sajuForm').reset();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      // AI 패널 제거
      const aiBtn = document.getElementById('saju-ai-btn');
      const aiPanel = document.getElementById('saju-ai-panel');
      if (aiBtn) aiBtn.remove();
      if (aiPanel) aiPanel.remove();
    }
    
    // ========================================
    // 🤖 사주 AI 분석 시스템
    // ========================================
    
    function initSajuAIButton(saju, elements, gender) {
      // 기존 버튼/패널 제거
      const existing = document.getElementById('saju-ai-btn');
      if (existing) existing.remove();
      const existingPanel = document.getElementById('saju-ai-panel');
      if (existingPanel) existingPanel.remove();
      
      // AI 분석 버튼 생성
      const resultSection = document.getElementById('resultSection');
      const aiButton = document.createElement('button');
      aiButton.id = 'saju-ai-btn';
      aiButton.innerHTML = '🤖 AI 심층 사주 분석';
      aiButton.style.cssText = `
        width: 100%; max-width: 400px; margin: 20px auto; display: block;
        padding: 16px 24px; font-size: 18px; font-weight: 700;
        background: linear-gradient(135deg, #d4af37, #c41e3a);
        border: none; border-radius: 999px; color: #fff;
        cursor: pointer; box-shadow: 0 10px 30px rgba(212,175,55,0.5);
        transition: all 0.3s ease;
      `;
      aiButton.onmouseover = () => aiButton.style.transform = 'translateY(-2px)';
      aiButton.onmouseout = () => aiButton.style.transform = 'translateY(0)';
      aiButton.onclick = () => performSajuAIAnalysis(saju, elements, gender);
      
      resultSection.appendChild(aiButton);
      
      // AI 분석 결과 패널 생성
      const aiPanel = document.createElement('div');
      aiPanel.id = 'saju-ai-panel';
      aiPanel.style.cssText = `
        display: none; margin-top: 24px; padding: 24px;
        background: linear-gradient(135deg, rgba(107,68,35,0.15), rgba(26,15,10,0.95));
        border-radius: 20px; border: 1px solid rgba(212,175,55,0.4);
        box-shadow: 0 0 30px rgba(212,175,55,0.3);
      `;
      aiPanel.innerHTML = `
        <h3 style="color:#d4af37; font-size:22px; margin-bottom:16px; text-align:center;">
          🔮 AI 심층 사주 분석 결과
        </h3>
        
        <div id="element-balance" style="margin-bottom:20px; padding:16px; background:rgba(26,15,10,0.8); border-radius:12px;">
          <h4 style="color:#f0d98c; font-size:16px; margin-bottom:10px;">⚖️ 오행 균형 분석</h4>
          <div id="element-content" style="color:#f9f5e8; line-height:1.6;"></div>
        </div>
        
        <div id="interaction-analysis" style="margin-bottom:20px; padding:16px; background:rgba(26,15,10,0.8); border-radius:12px;">
          <h4 style="color:#f0d98c; font-size:16px; margin-bottom:10px;">🔄 상생상극 관계</h4>
          <div id="interaction-content" style="color:#f9f5e8; line-height:1.6;"></div>
        </div>
        
        <div id="saju-insight" style="margin-bottom:20px; padding:16px; background:rgba(107,68,35,0.25); border-radius:12px; border:1px solid rgba(212,175,55,0.3);">
          <h4 style="color:#d4af37; font-size:16px; margin-bottom:10px;">💎 인생 통찰</h4>
          <div id="saju-insight-content" style="color:#f9f5e8; line-height:1.7; font-size:15px;"></div>
        </div>
        
        <div id="life-advice" style="padding:20px; background:linear-gradient(135deg, rgba(212,175,55,0.2), rgba(196,30,58,0.2)); border-radius:12px; text-align:center; border:2px solid rgba(212,175,55,0.4);">
          <h4 style="color:#f0d98c; font-size:16px; margin-bottom:12px;">✨ 맞춤 인생 조언</h4>
          <div id="advice-text" style="color:#f9f5e8; font-size:16px; font-weight:600; line-height:1.7;"></div>
        </div>
      `;
      
      resultSection.appendChild(aiPanel);
    }
    
    function performSajuAIAnalysis(saju, elements, gender) {
      // AI 엔진 실행
      const aiResult = SAJU_AI_ENGINE.generateAIReading(saju, elements, gender);
      
      // 결과 표시
      const panel = document.getElementById('saju-ai-panel');
      panel.style.display = 'block';
      
      // 오행 균형 분석
      const elementDiv = document.getElementById('element-content');
      elementDiv.innerHTML = `
        <p><strong>균형 상태:</strong> ${aiResult.balance.description}</p>
        <p><strong>부족한 기운:</strong> ${aiResult.balance.lacking.map(e => translateElement(e)).join(', ')}</p>
        <p><strong>과잉 기운:</strong> ${aiResult.balance.excessive.map(e => translateElement(e)).join(', ')}</p>
        <div style="margin-top:12px; padding:10px; background:rgba(212,175,55,0.1); border-radius:8px;">
          <strong>보완 방법:</strong> ${aiResult.recommendation.color} 색상 활용, ${aiResult.recommendation.direction} 방향 중시
        </div>
      `;
      
      // 상생상극 관계
      const interactionDiv = document.getElementById('interaction-content');
      interactionDiv.innerHTML = `
        <p><strong>지지하는 기운:</strong> ${aiResult.interaction.supporting.map(e => translateElement(e)).join(', ')}</p>
        <p><strong>충돌하는 기운:</strong> ${aiResult.interaction.conflicting.map(e => translateElement(e)).join(', ')}</p>
        <div style="margin-top:12px; padding:10px; background:rgba(212,175,55,0.1); border-radius:8px;">
          <strong>조화 방법:</strong> ${aiResult.interaction.harmony}
        </div>
      `;
      
      // 인생 통찰
      const insightDiv = document.getElementById('saju-insight-content');
      insightDiv.innerHTML = `
        <p><strong>🎭 성격:</strong> ${aiResult.insight.personality}</p>
        <p><strong>💼 직업:</strong> ${aiResult.insight.career}</p>
        <p><strong>💪 건강:</strong> ${aiResult.insight.health}</p>
        <p><strong>❤️ 인간관계:</strong> ${aiResult.insight.relationship}</p>
        <p><strong>💰 재물:</strong> ${aiResult.insight.fortune}</p>
      `;
      
      // 맞춤 인생 조언
      document.getElementById('advice-text').textContent = aiResult.advice;
      
      // 스크롤
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    
    function translateElement(element) {
      const names = {
        wood: '목(木)', fire: '화(火)', earth: '토(土)', metal: '금(金)', water: '수(水)'
      };
      return names[element] || element;
    }
    
    // ============================================
    // UT 잔액 초기화 및 업데이트
    // ============================================
    function updateUTDisplay() {
      const balance = parseInt(localStorage.getItem('ut_balance') || '0');
      const balanceEl = document.getElementById('saju-ut-balance');
      if (balanceEl) {
        balanceEl.textContent = balance;
      }
    }
    
    // 페이지 로드 시 UT 잔액 표시
    window.addEventListener('DOMContentLoaded', updateUTDisplay);
    
    // 다른 탭에서 UT 변경 시 업데이트
    window.addEventListener('storage', function(e) {
      if (e.key === 'ut_balance') {
        updateUTDisplay();
      }
    });
  </script>
