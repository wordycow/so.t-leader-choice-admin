<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 빗썸 실시간 트렌드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bithumb-orange: #ff6b00;
      --bithumb-yellow: #ffb700;
      --rise-red: #d60000;
      --fall-blue: #0062df;
      --dark-bg: #1a0f00;
      --card-bg: #2a1800;
      --border-color: #3d2400;
      --text-primary: #ffffff;
      --text-secondary: #c4a574;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0a0e27 url('img/bithumb-background.png') center/cover no-repeat fixed;
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* 배경 효과 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 107, 0, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 183, 0, 0.1) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* 헤더 */
    .header {
      text-align: center;
      padding: 40px 20px;
      margin-bottom: 30px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--bithumb-orange), var(--bithumb-yellow));
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 4px 20px rgba(255, 107, 0, 0.5);
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--bithumb-orange), var(--bithumb-yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .update-time {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 20px;
      background: rgba(255, 107, 0, 0.1);
      border: 1px solid rgba(255, 107, 0, 0.3);
      border-radius: 20px;
      font-size: 14px;
      color: var(--bithumb-yellow);
      font-weight: 600;
    }

    /* 통계 카드 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      transition: all 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(255, 107, 0, 0.3);
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 900;
      font-family: 'Orbitron', sans-serif;
    }

    .stat-value.rise {
      color: var(--rise-red);
    }

    .stat-value.fall {
      color: var(--fall-blue);
    }

    /* 코인 리스트 */
    .coin-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .coin-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      padding: 20px;
      display: grid;
      grid-template-columns: auto 1fr auto auto auto;
      gap: 20px;
      align-items: center;
      transition: all 0.3s;
      cursor: pointer;
    }

    .coin-item:hover {
      background: #3d2400;
      transform: translateX(5px);
      box-shadow: 0 4px 20px rgba(255, 107, 0, 0.2);
    }

    .coin-rank {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-secondary);
      width: 40px;
      text-align: center;
    }

    .coin-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .coin-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .coin-symbol {
      font-size: 14px;
      color: var(--text-secondary);
      font-family: 'Orbitron', sans-serif;
    }

    .coin-price {
      font-size: 22px;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      text-align: right;
    }

    .coin-change {
      font-size: 18px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 10px;
      text-align: center;
      min-width: 100px;
    }

    .coin-change.rise {
      color: var(--rise-red);
      background: rgba(214, 0, 0, 0.1);
    }

    .coin-change.fall {
      color: var(--fall-blue);
      background: rgba(0, 98, 223, 0.1);
    }

    .coin-volume {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: right;
      min-width: 120px;
    }

    /* 로딩 */
    .loading {
      text-align: center;
      padding: 60px 20px;
      display: none;
    }

    .loading.active {
      display: block;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 107, 0, 0.3);
      border-top-color: var(--bithumb-orange);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* 홈 버튼 */
    .home-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid var(--bithumb-orange);
      border-radius: 15px;
      color: var(--bithumb-yellow);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 0 20px rgba(255, 107, 0, 0.3);
    }

    .home-btn:hover {
      background: rgba(255, 107, 0, 0.2);
      transform: scale(1.05);
    }

    /* 새로고침 버튼 */
    .refresh-btn {
      display: block;
      margin: 20px auto;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--bithumb-orange), var(--bithumb-yellow));
      border: none;
      border-radius: 15px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
      font-family: 'Noto Sans KR', sans-serif;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(255, 107, 0, 0.6);
    }

    /* 비용 배지 */
    .cost-badge {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--bithumb-orange), var(--bithumb-yellow));
      border: 3px solid var(--bithumb-yellow);
      border-radius: 20px;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
      z-index: 100;
    }

    /* 모바일 반응형 */
    @media (max-width: 768px) {
      .main-title {
        font-size: 32px;
      }

      .coin-item {
        grid-template-columns: auto 1fr;
        gap: 10px;
      }

      .coin-price,
      .coin-volume {
        grid-column: 2;
        text-align: left;
      }

      .coin-change {
        grid-column: 1 / -1;
        margin-top: 10px;
      }

      .cost-badge {
        top: 10px;
        right: 10px;
        font-size: 16px;
        padding: 8px 16px;
      }

      .home-btn {
        top: 10px;
        left: 10px;
        font-size: 14px;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
  <!-- 홈 버튼 -->
  <a href="the-unique-main.html" class="home-btn">
    🏠 <span>HOME</span>
  </a>

  <!-- 비용 배지 -->
  <div class="cost-badge">FREE</div>

  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">🟠</div>
        <h1 class="main-title">BITHUMB TREND</h1>
      </div>
      <p class="subtitle">빗썸 실시간 암호화폐 트렌드</p>
      <div class="update-time" id="updateTime">⏰ 업데이트 중...</div>
    </div>

    <!-- 통계 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">상승 종목</div>
        <div class="stat-value rise" id="riseCount">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">하락 종목</div>
        <div class="stat-value fall" id="fallCount">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">24시간 거래대금</div>
        <div class="stat-value" id="totalVolume" style="color: var(--bithumb-yellow);">-</div>
      </div>
    </div>

    <!-- 새로고침 버튼 -->
    <button class="refresh-btn" id="refreshBtn">🔄 최신 데이터 업데이트</button>

    <!-- 로딩 -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">실시간 데이터 로딩 중...</div>
    </div>

    <!-- 코인 리스트 -->
    <div class="coin-list" id="coinList"></div>
  </div>

  <script>
    const loading = document.getElementById('loading');
    const coinList = document.getElementById('coinList');
    const updateTime = document.getElementById('updateTime');
    const refreshBtn = document.getElementById('refreshBtn');
    const riseCount = document.getElementById('riseCount');
    const fallCount = document.getElementById('fallCount');
    const totalVolume = document.getElementById('totalVolume');

    // 더미 데이터 (실제로는 Bithumb API를 사용)
    const dummyCoins = [
      { rank: 1, name: '비트코인', symbol: 'BTC/KRW', price: 88450000, change: 5.18, volume: '1.1조', isRise: true },
      { rank: 2, name: '이더리움', symbol: 'ETH/KRW', price: 4840000, change: 3.42, volume: '8,200억', isRise: true },
      { rank: 3, name: '리플', symbol: 'XRP/KRW', price: 1248, change: 12.89, volume: '6,000억', isRise: true },
      { rank: 4, name: '이오스', symbol: 'EOS/KRW', price: 980, change: -1.23, volume: '4,500억', isRise: false },
      { rank: 5, name: '트론', symbol: 'TRX/KRW', price: 285, change: 7.45, volume: '3,800억', isRise: true },
      { rank: 6, name: '라이트코인', symbol: 'LTC/KRW', price: 125000, change: -2.56, volume: '2,700억', isRise: false },
      { rank: 7, name: '비트코인캐시', symbol: 'BCH/KRW', price: 485000, change: 4.89, volume: '2,200억', isRise: true },
      { rank: 8, name: '퀀텀', symbol: 'QTUM/KRW', price: 4800, change: -3.45, volume: '1,900억', isRise: false },
      { rank: 9, name: '스텔라루멘', symbol: 'XLM/KRW', price: 185, change: 9.12, volume: '1,600억', isRise: true },
      { rank: 10, name: '에이다', symbol: 'ADA/KRW', price: 885, change: 8.76, volume: '1,400억', isRise: true }
    ];

    // 가격 포맷
    function formatPrice(price) {
      if (price >= 1000000) {
        return price.toLocaleString('ko-KR') + '원';
      } else if (price >= 1000) {
        return price.toLocaleString('ko-KR') + '원';
      } else {
        return price.toFixed(3) + '원';
      }
    }

    // 데이터 표시
    function displayCoins() {
      showLoading();
      coinList.innerHTML = '';

      setTimeout(() => {
        hideLoading();

        // 통계 계산
        const rises = dummyCoins.filter(c => c.isRise).length;
        const falls = dummyCoins.length - rises;
        
        riseCount.textContent = `${rises}개`;
        fallCount.textContent = `${falls}개`;
        totalVolume.textContent = '약 3.3조원';

        // 코인 리스트 표시
        dummyCoins.forEach(coin => {
          const item = document.createElement('div');
          item.className = 'coin-item';

          const changeClass = coin.isRise ? 'rise' : 'fall';
          const changeIcon = coin.isRise ? '▲' : '▼';

          item.innerHTML = `
            <div class="coin-rank">#${coin.rank}</div>
            <div class="coin-info">
              <div class="coin-name">${coin.name}</div>
              <div class="coin-symbol">${coin.symbol}</div>
            </div>
            <div class="coin-price">${formatPrice(coin.price)}</div>
            <div class="coin-change ${changeClass}">
              ${changeIcon} ${Math.abs(coin.change).toFixed(2)}%
            </div>
            <div class="coin-volume">거래대금<br>${coin.volume}</div>
          `;

          coinList.appendChild(item);
        });

        // 업데이트 시간
        const now = new Date();
        updateTime.textContent = `⏰ ${now.toLocaleString('ko-KR')} 업데이트`;
      }, 1500);
    }

    // UI 제어
    function showLoading() {
      loading.classList.add('active');
    }

    function hideLoading() {
      loading.classList.remove('active');
    }

    // 이벤트 리스너
    refreshBtn.addEventListener('click', () => {
      displayCoins();
    });

    // 초기 로드
    window.addEventListener('load', () => {
      displayCoins();
    });
  </script>
</body>
</html>
