<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>슬랭 사전 - THE UNIQUE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- ✨ THE UNIQUE LEGENDARY DESIGN SYSTEM v4.0 -->
  <link rel="stylesheet" href="css/the-unique-core.css">

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --text-dark: #1e293b;
      --text-gray: #64748b;
      --border: #e2e8f0;
      --shadow: rgba(0,0,0,0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #1a1a2e url('img/slang-background-v2.png') center/cover no-repeat fixed;
      min-height: 100vh;
      color: var(--text-dark);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 0.6s ease;
    }

    .header-title {
      font-size: 48px;
      font-weight: 900;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .header-subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.9);
      font-weight: 500;
    }

    .search-box {
      background: var(--bg-white);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px var(--shadow);
      margin-bottom: 30px;
      animation: fadeInUp 0.6s ease 0.1s both;
    }

    .search-input-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 18px 60px 18px 24px;
      font-size: 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.3s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
    }

    .search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .search-btn:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }

    .results-container {
      background: var(--bg-white);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px var(--shadow);
      animation: fadeInUp 0.6s ease 0.2s both;
    }

    .result-item {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      animation: slideInUp 0.4s ease;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-word {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .result-pronunciation {
      font-size: 16px;
      color: var(--text-gray);
      margin-bottom: 12px;
    }

    .result-meaning {
      font-size: 18px;
      line-height: 1.8;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .result-example {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-gray);
      background: var(--bg-light);
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }

    .suggestion-box {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .suggestion-title {
      font-size: 18px;
      font-weight: 700;
      color: #856404;
      margin-bottom: 12px;
    }

    .suggestion-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .suggestion-item {
      background: white;
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid var(--primary);
    }

    .suggestion-item:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-gray);
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .empty-text {
      font-size: 20px;
      font-weight: 600;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .header-title {
        font-size: 36px;
      }

      .result-word {
        font-size: 24px;
      }

      .search-box, .results-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

    <div class="search-box">

        <button class="search-btn" onclick="searchSlang()">검색</button>
      </div>
    </div>

    <div class="results-container" id="resultsContainer">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">검색어를 입력해주세요</div>
      </div>
    </div>
  </div>

    // 검색 입력 시 엔터키 처리
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        searchSlang();
      }
    });

    // 검색 함수
    function searchSlang() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      
      if (!query) {
        showEmptyState();
        return;
      }

      // 정확한 매치 찾기
      const exactMatches = SLANG_DATABASE.filter(item => 
        item.word.toLowerCase() === query
      );

      // 부분 매치 찾기 (단어나 태그에 포함)
      const partialMatches = SLANG_DATABASE.filter(item => 
        item.word.toLowerCase().includes(query) ||
        item.tags.some(tag => tag.includes(query)) ||
        item.meaning.toLowerCase().includes(query)
      );

      // 중복 제거
      const allMatches = [...new Set([...exactMatches, ...partialMatches])];

      if (allMatches.length > 0) {
        displayResults(allMatches);
      } else {
        displaySuggestions(query);
      }
    }

    // 결과 표시
    function displayResults(matches) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      matches.forEach((item, index) => {
        const resultItem = document.createElement('div');
        resultItem.className = 'result-item';
        resultItem.style.animationDelay = `${index * 0.1}s`;
        
        resultItem.innerHTML = `
          <div class="result-word">${item.word}</div>
          <div class="result-pronunciation">[${item.pronunciation}]</div>
          <div class="result-meaning">${item.meaning}</div>
          <div class="result-example">💬 예시: ${item.example}</div>
        `;
        
        container.appendChild(resultItem);
      });
    }

    // 제안 표시 (검색 결과 없을 때)
    function displaySuggestions(query) {
      const container = document.getElementById('resultsContainer');
      
      // 유사한 단어 찾기 (첫 글자가 같거나 발음이 비슷한 것)
      const suggestions = SLANG_DATABASE.filter(item => {
        const firstChar = query[0];
        return item.word[0] === firstChar || 
               item.pronunciation.includes(query) ||
               levenshteinDistance(item.word.toLowerCase(), query) <= 2;
      }).slice(0, 10);

      container.innerHTML = `
        <div class="suggestion-box">
          <div class="suggestion-title">🤔 "${query}"에 대한 정확한 결과가 없습니다</div>
          ${suggestions.length > 0 ? `
            <div style="margin-bottom: 16px; color: #856404;">혹시 이런 단어를 찾으셨나요?</div>
            <div class="suggestion-list">
              ${suggestions.map(item => `
                <div class="suggestion-item" onclick="selectSuggestion('${item.word}')">
                  ${item.word}
                </div>
              `).join('')}
            </div>
          ` : `
            <div style="color: #856404;">비슷한 단어를 찾지 못했습니다. 다른 검색어를 시도해보세요.</div>
          `}
        </div>
        <div class="empty-state">
          <div class="empty-icon">💡</div>
          <div class="empty-text">인기 검색어: ㅇㅈ, TMI, 억텐, 갓벽, 킹받네</div>
        </div>
      `;
    }

    // 제안 단어 선택
    function selectSuggestion(word) {
      document.getElementById('searchInput').value = word;
      searchSlang();
    }

    // 빈 상태 표시
    function showEmptyState() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div class="empty-text">검색어를 입력해주세요</div>
        </div>
      `;
    }

    // 레벤슈타인 거리 계산 (유사도 측정)
    function levenshteinDistance(str1, str2) {
      const len1 = str1.length;
      const len2 = str2.length;
      const matrix = [];

      for (let i = 0; i <= len1; i++) {
        matrix[i] = [i];
      }

      for (let j = 0; j <= len2; j++) {
        matrix[0][j] = j;
      }

      for (let i = 1; i <= len1; i++) {
        for (let j = 1; j <= len2; j++) {
          const cost = str1[i - 1] === str2[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }

      return matrix[len1][len2];
    }
