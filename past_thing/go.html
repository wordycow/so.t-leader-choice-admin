<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>이동하기</title>
  <style>
    body{
      margin:0; height:100vh; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Pretendard,sans-serif;
      background:#0a0e27 url('img/go-background.png') center/cover no-repeat fixed; color:#e5e7eb;
    }
    .wrap{width:min(520px,92vw); padding:20px; text-align:center;}
    .btn{
      display:block; width:100%;
      padding:18px 16px; border-radius:16px;
      text-decoration:none; font-weight:900; font-size:18px;
      color: rgba(250,204,21,0.95);
      border:1px solid rgba(250,204,21,.55);
      background: rgba(250,204,21,.12);
    }
    .btn:hover{ background: rgba(250,204,21,.18); }
    .muted{opacity:.8; font-size:12px; margin-top:10px;}
  </style>
</head>
<body>
  <div class="wrap">
    <h2 style="margin:0 0 14px;">👇 버튼 눌러 이동</h2>
    <a class="btn"
   href="https://wordycow.github.io/so.t-leader-choice/index.html"
   target="_blank"
   rel="noopener noreferrer">
      so.t 여행 신청하기
    </a>
    <div class="muted">링크가 안 열리면 브라우저에서 다시 시도해줘.</div>
  </div>
</body>
</html>
