<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Health UI</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:#0b1120;color:#e5e7eb}
    .wrap{max-width:900px;margin:0 auto;padding:18px}
    a{color:#cbd5e1}
    pre{background:rgba(255,255,255,0.06);padding:12px;border-radius:12px;overflow:auto;white-space:pre-wrap}
    button{background:#2563eb;color:#fff;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:800}
  </style>
</head>
<body>
<div class="wrap">
  <h2>Health UI</h2>
  <div><a href="/">OPS</a> · <a href="/dashboard">Dashboard</a> · <a href="/health">Health(JSON)</a></div>
  <p><button id="btn">새로고침</button></p>
  <pre id="out">loading...</pre>
</div>
<script>
  const API = (location.hostname.endsWith("github.io") || location.protocol === "file:")
    ? "http://127.0.0.1:5001"
    : location.origin;
  async function load(){
    const r = await fetch(API+"/health");
    const t = await r.text();
    try{ document.getElementById("out").textContent = JSON.stringify(JSON.parse(t), null, 2); }
    catch(e){ document.getElementById("out").textContent = t; }
  }
  document.getElementById("btn").onclick = load;
  load();
</script>
</body>
</html>
