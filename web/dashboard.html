<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>LeeMay Training Center</title>
  <style>
    :root{--bg:#0b1120;--panel:#0f172a;--text:#e5e7eb;--muted:#94a3b8;--line:#1f2a44;--ok:#22c55e;--fail:#ef4444;--btn:#2563eb;--btn2:#334155;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:var(--text);
      background:radial-gradient(circle at top, #1f2a44, var(--bg) 55%);}
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .brand{font-weight:900;font-size:18px}
    .pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,0.03);color:var(--muted);font-size:12px}
    a{color:#cbd5e1;text-decoration:none}
    a:hover{text-decoration:underline}
    .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    @media(min-width:980px){.grid{grid-template-columns:1fr 1fr}}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
    h3{margin:0 0 10px 0;font-size:14px;color:#cbd5e1}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input,textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--line);color:var(--text);
      padding:10px 12px;border-radius:12px;outline:none}
    textarea{min-height:90px;resize:vertical}
    button{background:var(--btn);color:white;border:0;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:800}
    button.secondary{background:var(--btn2)}
    .mini{font-size:12px;color:var(--muted)}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
    .ok{background:var(--ok)} .fail{background:var(--fail)}
    pre{margin:0;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,0.22);max-height:240px;overflow:auto;white-space:pre-wrap}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">LeeMay Training Center</div>
    <div class="pill"><a href="/">OPS Control</a> · <a href="/health">Health(JSON)</a></div>
    <div class="pill" id="pillApi">API: -</div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>상태</h3>
      <div class="mini" id="stPorts">-</div>
      <div class="mini" id="stUptime">-</div>
      <div class="mini" id="stLogs">-</div>
      <div class="row" style="margin-top:10px">
        <button class="secondary" id="btnRefresh">새로고침</button>
      </div>
    </div>

    <div class="card">
      <h3>시스템</h3>
      <div class="mini" id="sys">CPU/MEM/DISK 로딩중...</div>
    </div>

    <div class="card">
      <h3>LeeMay Chat</h3>
      <textarea id="msg" placeholder="메시지 입력..."></textarea>
      <div class="row" style="margin-top:10px">
        <button id="btnSend">전송</button>
        <button class="secondary" id="btnClear">지우기</button>
      </div>
      <div class="mini" style="margin-top:10px">응답</div>
      <pre id="chatOut">(empty)</pre>
    </div>

    <div class="card">
      <h3>YouTube Learner</h3>
      <div class="row">
        <input id="adminKey" placeholder="Admin Key (1106)" />
        <input id="ytUrl" placeholder="YouTube URL" />
      </div>
      <div class="row" style="margin-top:10px">
        <button id="btnYtStart">학습 시작</button>
        <button class="secondary" id="btnYtStatus">최근 Job 상태</button>
      </div>
      <div class="mini" style="margin-top:10px">결과</div>
      <pre id="ytOut">(empty)</pre>
    </div>
  </div>
</div>

<script>
  const API = (location.hostname.endsWith("github.io") || location.protocol === "file:")
    ? "http://127.0.0.1:5001"
    : location.origin;

  const $ = (id)=>document.getElementById(id);
  let lastJobId = "";

  function h(){
    const key = ($("adminKey").value || "").trim();
    return {"Content-Type":"application/json","X-Admin-Key":key,"X-ADMIN-TOKEN":key};
  }
  async function j(path, opts={}){
    const r = await fetch(API+path, opts);
    const t = await r.text();
    let d=null; try{d=JSON.parse(t)}catch(e){}
    return {ok:r.ok, status:r.status, data:d, text:t};
  }

  async function refresh(){
    $("pillApi").textContent = "API: " + API;

    const s = await j("/api/ops/status");
    if(s.ok){
      const p = s.data.ports || {};
      $("stPorts").innerHTML =
        `${p["5001"]?'<span class="dot ok"></span>5001 ON':'<span class="dot fail"></span>5001 OFF'} · ` +
        `${p["5000"]?'<span class="dot ok"></span>5000 ON':'<span class="dot fail"></span>5000 OFF'} · ` +
        `${p["11434"]?'<span class="dot ok"></span>11434 ON':'<span class="dot fail"></span>11434 OFF'}`;
      $("stUptime").textContent = "uptime: " + (s.data.uptime ?? s.data.uptime_sec ?? "-");
      $("stLogs").textContent = "ai_log: " + (s.data.ai_log ?? "-");
    } else {
      $("stPorts").textContent = "status failed: " + s.text;
    }

    const sys = await j("/api/system/status");
    if(sys.ok){
      $("sys").textContent = `CPU ${sys.data.cpu}% / MEM ${sys.data.memory}% / DISK FREE ${sys.data.disk_free_gb}GB`;
    } else {
      $("sys").textContent = "system status failed: " + sys.text;
    }
  }

  async function sendChat(){
    const msg = ($("msg").value||"").trim();
    const r = await j("/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message:msg,user_id:"wordycow"})});
    $("chatOut").textContent = r.data ? JSON.stringify(r.data, null, 2) : r.text;
  }

  async function ytStart(){
    const url = ($("ytUrl").value||"").trim();
    const r = await j("/api/learning/youtube/start", {method:"POST", headers:h(), body:JSON.stringify({url})});
    $("ytOut").textContent = r.data ? JSON.stringify(r.data, null, 2) : r.text;
    try{ lastJobId = r.data.job.job_id || ""; }catch(e){}
  }

  async function ytStatus(){
    if(!lastJobId){
      $("ytOut").textContent = "최근 job_id가 없습니다. 먼저 학습 시작을 누르세요.";
      return;
    }
    const r = await j(`/api/learning/job/${encodeURIComponent(lastJobId)}/status`, {headers:h()});
    $("ytOut").textContent = r.data ? JSON.stringify(r.data, null, 2) : r.text;
  }

  $("btnRefresh").onclick = refresh;
  $("btnSend").onclick = sendChat;
  $("btnClear").onclick = ()=>{$("msg").value=""; $("chatOut").textContent="(empty)";};
  $("btnYtStart").onclick = ytStart;
  $("btnYtStatus").onclick = ytStatus;

  $("adminKey").value = localStorage.getItem("leemay_admin_key") || "1106";
  $("adminKey").addEventListener("change", ()=>localStorage.setItem("leemay_admin_key", $("adminKey").value.trim()));
  refresh().catch(()=>{});
  setInterval(()=>refresh().catch(()=>{}), 2000);
</script>
</body>
</html>
