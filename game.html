<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>THE UNIQUE – GAME</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#020617;
      --panel: rgba(15,23,42,0.85);
      --panel2: rgba(30,41,59,0.55);
      --border: rgba(255,255,255,0.10);
      --gold:#fbbf24;
      --text:#e5e7eb;
      --muted:#94a3b8;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      color: var(--text);
      font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 70px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 18px;
    }

    .brand{
      display:flex;
      align-items:baseline;
      gap:10px;
      min-width:0;
    }
    .brand .title{
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;
      color: var(--gold);
      font-size: 22px;
      text-shadow: 0 0 16px rgba(251,191,36,0.25);
      white-space:nowrap;
    }
    .brand .sub{
      color: var(--muted);
      font-size: 12px;
      white-space:nowrap;
    }

    .navbtns{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      border:1px solid var(--border);
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor:pointer;
      font-weight:900;
      letter-spacing:.06em;
      transition: transform .12s ease, filter .12s ease, border-color .12s ease;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
    }
    .btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.06);
      border-color: rgba(251,191,36,0.35);
    }
    .btn.primary{
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      border-color: var(--gold);
      color: #0b1120;
    }

    .hero{
      border:1px solid rgba(251,191,36,0.35);
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      border-radius: 18px;
      padding: 16px 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      margin-bottom: 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .hero-left{
      min-width:0;
    }
    .hero-kicker{
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .hero-head{
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .02em;
    }
    .hero-desc{
      margin-top: 6px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.55;
    }

    /* ✅ 첨부한 이미지 느낌 버튼 */
    .gameImageBtn{
      width: 190px;
      height: 52px;
      border: none;
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      padding:0;
      cursor:pointer;
      flex: 0 0 auto;
      transition: transform .12s ease, filter .12s ease;
    }
    .gameImageBtn img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      filter: drop-shadow(0 14px 24px rgba(0,0,0,0.55));
    }
    .gameImageBtn:hover{
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin: 10px 0 16px;
    }
    .pill{
      border:1px solid rgba(255,255,255,0.10);
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      cursor:pointer;
      transition: filter .12s ease, border-color .12s ease;
      user-select:none;
    }
    .pill.active{
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      border-color: rgba(251,191,36,0.35);
      color: #fff;
    }

    .search{
      margin-left:auto;
      min-width: 220px;
      flex: 1 1 220px;
      max-width: 420px;
    }
    .search input{
      width:100%;
      padding: 10px 12px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,0.12);
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      color: #fff;
      outline:none;
      font-weight: 700;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 14px;
    }
    @media (max-width: 900px){
      .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }
      .gameImageBtn{ width: 170px; }
    }
    @media (max-width: 560px){
      .grid{ grid-template-columns: 1fr; }
      .gameImageBtn{ width: 160px; height: 48px; }
    }

    .card{
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      border:1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      overflow:hidden;
      box-shadow: 0 16px 32px rgba(0,0,0,0.45);
      display:flex;
      flex-direction:column;
      min-height: 210px;
    }
    .thumb{
      height: 120px;
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      border-bottom:1px solid rgba(255,255,255,0.06);
      position: relative;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      opacity: .92;
    }
    .thumb .badge{
      position:absolute;
      top:10px;
      right:10px;
      font-size: 11px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 999px;
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      border:1px solid rgba(251,191,36,0.35);
      color:#fff;
    }

    .body{
      padding: 14px 14px 12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      flex:1 1 auto;
    }
    .name{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:8px;
    }
    .name strong{
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .04em;
    }
    .name span{
      font-size: 11px;
      color: var(--muted);
      font-weight: 800;
      white-space:nowrap;
    }
    .desc{
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
      flex: 1 1 auto;
    }
    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .tag{
      font-size: 10px;
      font-weight: 900;
      letter-spacing:.06em;
      padding: 5px 8px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.12);
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      color: #cbd5e1;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top: 4px;
    }
    .play{
      flex:1;
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      border:1px solid var(--gold);
      color:#0b1120;
      font-weight: 900;
      border-radius: 12px;
      padding: 10px 12px;
      cursor:pointer;
      letter-spacing:.06em;
    }
    .detail{
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      border:1px solid rgba(255,255,255,0.12);
      color:#e5e7eb;
      font-weight: 900;
      border-radius: 12px;
      padding: 10px 12px;
      cursor:pointer;
      letter-spacing:.06em;
      white-space:nowrap;
    }

    /* Modal */
    .modal{
      position:fixed;
      inset:0;
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 999;
    }
    .modal.active{ display:flex; }
    .modalCard{
      width: min(640px, 100%);
      border-radius: 18px;
      border:1px solid rgba(251,191,36,0.35);
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7);
      overflow:hidden;
    }
    .modalTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 14px 14px;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .modalTop strong{ font-weight: 900; letter-spacing:.06em; }
    .xbtn{
      border:1px solid rgba(255,255,255,0.16);
      background: #0a0e27 url('img/game-background.png') center/cover no-repeat fixed;
      color:#fff;
      border-radius: 12px;
      padding: 8px 10px;
      cursor:pointer;
      font-weight: 900;
    }
    .modalBody{
      padding: 14px;
      color:#cbd5e1;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="title">THE UNIQUE</div>
        <div class="sub">GAME SELECT</div>
      </div>
      <div class="navbtns">
        <a class="btn" href="the-unique-main.html">MAIN</a>
        <button class="btn primary" id="btn-refresh">REFRESH</button>
      </div>
    </div>

    <div class="hero">
      <div class="hero-left">
        <div class="hero-kicker">오늘은 어떤 게임으로 리셋할까?</div>
        <div class="hero-head">게임을 고르고 바로 플레이하세요.</div>
        <div class="hero-desc">
          앞으로 게임 추가는 <b>games.json</b>에 한 줄 추가하면 자동으로 목록에 뜹니다.
        </div>
      </div>

      <!-- ✅ 첨부한 이미지 느낌 버튼 -->
      <button class="gameImageBtn" id="btn-go-first" title="첫 번째 게임 바로가기">
        <img src="img/game-btn.png" alt="GAME">
      </button>
    </div>

    <div class="toolbar">
      <div class="pill active" data-filter="all">ALL</div>
      <div class="pill" data-filter="classic">CLASSIC</div>
      <div class="pill" data-filter="mobile">MOBILE</div>
      <div class="pill" data-filter="skill">SKILL</div>

      <div class="search">
        <input id="q" placeholder="검색: snake / breakout / ..." />
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modalCard">
      <div class="modalTop">
        <strong id="mTitle">DETAIL</strong>
        <button class="xbtn" id="mClose">CLOSE</button>
      </div>
      <div class="modalBody" id="mBody"></div>
    </div>
  </div>

  <script>
    const GRID = document.getElementById("grid");
    const Q = document.getElementById("q");
    const pills = Array.from(document.querySelectorAll(".pill"));
    const modal = document.getElementById("modal");
    const mTitle = document.getElementById("mTitle");
    const mBody = document.getElementById("mBody");
    const mClose = document.getElementById("mClose");

    let items = [];
    let activeFilter = "all";

    function openModal(title, html){
      mTitle.textContent = title;
      mBody.innerHTML = html;
      modal.classList.add("active");
    }
    function closeModal(){ modal.classList.remove("active"); }

    mClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });

    function matchFilter(item){
      if(activeFilter === "all") return true;
      return (item.tags || []).includes(activeFilter);
    }

    function matchQuery(item){
      const q = (Q.value || "").trim().toLowerCase();
      if(!q) return true;
      const hay = [
        item.id, item.title, item.subtitle, item.difficulty, (item.tags||[]).join(" "), item.desc
      ].join(" ").toLowerCase();
      return hay.includes(q);
    }

    function render(){
      const view = items.filter(it => matchFilter(it) && matchQuery(it));

      if(!view.length){
        GRID.innerHTML = `<div style="color:#94a3b8; padding:12px; font-weight:800;">게임이 없습니다. games.json에 추가해보세요.</div>`;
        return;
      }

      GRID.innerHTML = view.map(it => `
        <div class="card">
          <div class="thumb">
            <img src="${it.thumb || 'img/bg-unique-main.jpg'}" onerror="this.src='img/bg-unique-main.jpg'" alt="">
            <div class="badge">${it.difficulty || 'Normal'}</div>
          </div>
          <div class="body">
            <div class="name">
              <strong>${it.title || it.id}</strong>
              <span>${it.subtitle || ''}</span>
            </div>
            <div class="desc">${it.desc || ''}</div>
            <div class="tags">
              ${(it.tags||[]).slice(0,4).map(t => `<span class="tag">${t.toUpperCase()}</span>`).join("")}
            </div>
            <div class="actions">
              <button class="play" data-play="${it.link}">PLAY</button>
              <button class="detail" data-detail="${it.id}">DETAIL</button>
            </div>
          </div>
        </div>
      `).join("");

      // bind actions
      GRID.querySelectorAll("[data-play]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const link = btn.getAttribute("data-play");
          if(!link || link === "#") return;
          window.location.href = link;
        });
      });

      GRID.querySelectorAll("[data-detail]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const id = btn.getAttribute("data-detail");
          const it = items.find(x=>x.id===id);
          if(!it) return;
          openModal(it.title || it.id, `
            <div><b>Subtitle</b>: ${it.subtitle || '-'}</div>
            <div><b>Difficulty</b>: ${it.difficulty || '-'}</div>
            <div style="margin-top:8px;"><b>Description</b><br>${it.desc || '-'}</div>
            <div style="margin-top:10px;"><b>Link</b>: ${it.link || '-'}</div>
            <div style="margin-top:10px;"><b>Tags</b>: ${(it.tags||[]).join(", ") || '-'}</div>
          `);
        });
      });
    }

    function setFilter(v){
      activeFilter = v;
      pills.forEach(p => p.classList.toggle("active", p.dataset.filter === v));
      render();
    }

    pills.forEach(p => p.addEventListener("click", () => setFilter(p.dataset.filter)));
    Q.addEventListener("input", render);

    async function loadGames(){
      const res = await fetch("games.json", { cache: "no-store" });
      const data = await res.json();
      items = Array.isArray(data) ? data : (data.items || []);
      render();

      // 상단 이미지 버튼: 첫 게임 바로가기
      const first = items[0];
      const go = document.getElementById("btn-go-first");
      if(go && first && first.link){
        go.onclick = () => (window.location.href = first.link);
      }
    }

    document.getElementById("btn-refresh").addEventListener("click", loadGames);

    loadGames().catch(err=>{
      console.error(err);
      GRID.innerHTML = `<div style="color:#fecaca; padding:12px; font-weight:900;">games.json 로드 실패</div>`;
    });
  </script>
</body>
</html>
