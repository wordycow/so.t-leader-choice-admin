<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>타로 카드 - THE UNIQUE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0515;
      --bg-purple: #1a0f2e;
      --purple: #9333ea;
      --purple-light: #c084fc;
      --purple-dark: #581c87;
      --gold: #fbbf24;
      --gold-light: #fde68a;
      --text-light: #f3f4f6;
      --text-muted: #d1d5db;
      --card-back: #4c1d95;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif KR', serif;
      background: #0a0515 url('img/tarot-old-backup-background.png') center/cover no-repeat fixed;
      min-height: 100vh;
      color: var(--text-light);
      position: relative;
      overflow-x: hidden;
    }

    /* 배경 효과 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(147,51,234,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(168,85,247,0.15) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* 별 효과 */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* 헤더 */
    .header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 0.8s ease;
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold) 0%, var(--purple-light) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(147,51,234,0.5);
      letter-spacing: 0.15em;
      margin-bottom: 15px;
    }

    .header-subtitle {
      font-size: 18px;
      color: var(--purple-light);
      letter-spacing: 0.2em;
      opacity: 0.9;
    }

    /* 돌아가기 버튼 */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--gold-light);
      background: rgba(147,51,234,0.2);
      border: 1px solid rgba(251,191,36,0.3);
      border-radius: 8px;
      text-decoration: none;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      background: rgba(147,51,234,0.3);
      border-color: rgba(251,191,36,0.5);
      transform: translateX(-4px);
    }

    /* 단계별 컨테이너 */
    .step-container {
      display: none;
      animation: fadeInUp 0.8s ease;
    }

    .step-container.active {
      display: block;
    }

    /* 질문 선택 */
    .question-card {
      background: linear-gradient(135deg, rgba(26,15,46,0.8) 0%, rgba(10,5,21,0.9) 100%);
      border: 2px solid rgba(147,51,234,0.4);
      border-radius: 20px;
      padding: 50px 40px;
      max-width: 700px;
      margin: 0 auto;
      box-shadow: 
        0 20px 60px rgba(147,51,234,0.3),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .question-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 0.05em;
    }

    .question-options {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .question-option {
      padding: 20px 25px;
      background: rgba(147,51,234,0.15);
      border: 2px solid rgba(192,132,252,0.3);
      border-radius: 12px;
      color: var(--text-light);
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
    }

    .question-option:hover {
      background: rgba(147,51,234,0.3);
      border-color: var(--purple-light);
      transform: translateX(10px);
    }

    .custom-question {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(147,51,234,0.3);
    }

    .custom-input {
      width: 100%;
      padding: 15px 20px;
      font-size: 15px;
      font-family: 'Noto Serif KR', serif;
      background: rgba(10,5,21,0.6);
      border: 2px solid rgba(147,51,234,0.4);
      border-radius: 10px;
      color: var(--text-light);
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .custom-input:focus {
      outline: none;
      border-color: var(--purple-light);
      box-shadow: 0 0 0 3px rgba(147,51,234,0.2);
    }

    .custom-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* 타로 카드 스프레드 */
    .spread-info {
      text-align: center;
      margin-bottom: 40px;
    }

    .spread-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 15px;
    }

    .spread-description {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* 선택된 카드 미리보기 영역 */
    .selected-cards-preview {
      background: linear-gradient(135deg, rgba(26,15,46,0.5) 0%, rgba(10,5,21,0.6) 100%);
      border: 2px solid rgba(147,51,234,0.4);
      border-radius: 16px;
      padding: 25px;
      margin: 30px auto;
      max-width: 900px;
    }

    .preview-title {
      text-align: center;
      font-size: 16px;
      color: var(--gold);
      margin-bottom: 20px;
      letter-spacing: 0.1em;
    }

    .preview-cards {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      min-height: 140px;
      align-items: center;
    }

    .preview-card {
      width: 90px;
      height: 150px;
      background: #ffffff;
      border: 3px solid var(--gold);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(251,191,36,0.3);
      animation: cardAppear 0.4s ease;
      position: relative;
    }

    .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-card-number {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 24px;
      height: 24px;
      background: var(--purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .preview-card-empty {
      width: 90px;
      height: 150px;
      border: 2px dashed rgba(192,132,252,0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 40px;
      opacity: 0.5;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: scale(0.5) translateY(-30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .cards-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 30px 0;
    }

    .card-wrapper {
      position: relative;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .card-wrapper.selected {
      opacity: 0.4;
      transform: scale(0.95);
      pointer-events: none;
    }

    .card-label {
      text-align: center;
      font-size: 13px;
      color: var(--purple-light);
      margin-bottom: 10px;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .tarot-card {
      width: 140px;
      height: 233px;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .tarot-card:hover {
      transform: translateY(-10px);
      filter: brightness(1.1);
    }

    .tarot-card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    /* 카드 뒷면 */
    .card-back {
      background: linear-gradient(135deg, var(--card-back) 0%, var(--purple-dark) 100%);
      border: 3px solid var(--gold);
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }

    .card-back::before {
      content: '✦';
      position: absolute;
      font-size: 100px;
      color: rgba(251,191,36,0.2);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .card-back-pattern {
      position: absolute;
      inset: 15px;
      border: 2px solid rgba(251,191,36,0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 0.2em;
      writing-mode: vertical-rl;
    }

    /* 카드 앞면 */
    .card-front {
      background: #ffffff;
      transform: rotateY(180deg);
      padding: 8px;
      flex-direction: column;
      border: 3px solid var(--gold);
      overflow: hidden;
      z-index: 1;
    }

    .card-front-content {
      text-align: center;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .card-number {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: var(--purple-dark);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .card-image {
      width: 100%;
      height: 210px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex: 1;
    }
    
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .card-name {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--purple-dark);
      margin: 6px 0 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1.2;
    }

    .card-name-kr {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .card-keyword {
      font-size: 10px;
      color: #9ca3af;
      font-style: italic;
    }

    /* 결과 화면 */
    .result-section {
      max-width: 900px;
      margin: 0 auto;
    }

    .result-header {
      text-align: center;
      margin-bottom: 50px;
      padding-bottom: 30px;
      border-bottom: 2px solid rgba(147,51,234,0.3);
    }

    .result-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 20px;
      letter-spacing: 0.1em;
    }

    .result-question {
      font-size: 18px;
      color: var(--purple-light);
      line-height: 1.6;
    }

    .interpretation-card {
      background: linear-gradient(135deg, rgba(26,15,46,0.6) 0%, rgba(10,5,21,0.7) 100%);
      border: 2px solid rgba(147,51,234,0.3);
      border-radius: 16px;
      padding: 35px;
      margin-bottom: 30px;
      position: relative;
    }

    .interpretation-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(180deg, var(--gold) 0%, var(--purple-light) 100%);
      border-radius: 16px 0 0 16px;
    }

    .card-position-title {
      font-size: 16px;
      color: var(--purple-light);
      margin-bottom: 15px;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .card-display {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .card-mini {
      width: 80px;
      height: 133px;
      background: #ffffff;
      border: 2px solid var(--gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      padding: 4px;
    }
    
    .card-mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .card-info {
      flex: 1;
    }

    .card-title-main {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 5px;
    }

    .card-title-sub {
      font-size: 15px;
      color: var(--text-muted);
    }

    .interpretation-text {
      font-size: 15px;
      line-height: 1.9;
      color: var(--text-light);
      margin-bottom: 20px;
    }

    .interpretation-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .keyword-tag {
      padding: 6px 14px;
      background: rgba(147,51,234,0.2);
      border: 1px solid rgba(192,132,252,0.3);
      border-radius: 20px;
      font-size: 13px;
      color: var(--purple-light);
    }

    /* 버튼들 */
    .btn {
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Noto Serif KR', serif;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
      border-color: var(--gold);
      color: white;
      box-shadow: 0 10px 30px rgba(147,51,234,0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(147,51,234,0.6);
    }

    .btn-secondary {
      background: transparent;
      border-color: var(--purple-light);
      color: var(--purple-light);
    }

    .btn-secondary:hover {
      background: rgba(147,51,234,0.2);
    }

    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 40px;
    }

    /* 비용 정보 */
    .cost-info {
      background: linear-gradient(135deg, rgba(251,191,36,0.1) 0%, rgba(147,51,234,0.1) 100%);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 20px;
      margin: 30px 0;
      text-align: center;
    }

    .cost-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .cost-amount {
      font-size: 32px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.05em;
    }

    .cost-amount .unit {
      font-size: 20px;
      color: var(--purple-light);
      margin-left: 8px;
    }

    /* 애니메이션 */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardFlip {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(180deg); }
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }

      .header-title {
        font-size: 36px;
      }

      .question-card {
        padding: 35px 25px;
      }

      .cards-container {
        gap: 20px;
      }

      .tarot-card {
        width: 140px;
        height: 233px;
      }

      .card-display {
        flex-direction: column;
        align-items: flex-start;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    .info-text {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- 별 효과 -->
  <div class="stars" id="stars"></div>

  <div class="container">
    <a href="the-unique-main.html" class="btn-back">
      ← 돌아가기
    </a>

    <div class="header">
      <h1 class="header-title">TAROT READING</h1>
      <p class="header-subtitle">신비로운 카드가 당신의 미래를 예언합니다</p>
    </div>

    <!-- Step 1: 질문 선택 -->
    <div class="step-container active" id="step1">
      <div class="question-card">
        <h2 class="question-title">무엇이 궁금하신가요?</h2>
        <div class="question-options">
          <div class="question-option" onclick="selectQuestion('오늘의 운세가 궁금합니다')">
            🌟 오늘의 운세
          </div>
          <div class="question-option" onclick="selectQuestion('현재 나의 연애운은 어떤가요?')">
            ❤️ 연애운
          </div>
          <div class="question-option" onclick="selectQuestion('직장/사업에서 성공할 수 있을까요?')">
            💼 사업/직장운
          </div>
          <div class="question-option" onclick="selectQuestion('재물운이 궁금합니다')">
            💰 재물운
          </div>
          <div class="question-option" onclick="selectQuestion('앞으로 어떤 일이 일어날까요?')">
            🔮 미래 예측
          </div>
        </div>
        <div class="custom-question">
          <input 
            type="text" 
            class="custom-input" 
            id="customQuestion" 
            placeholder="직접 질문을 입력하세요..."
            maxlength="100"
          >
          <button class="btn btn-primary" style="width: 100%;" onclick="selectCustomQuestion()">
            타로 카드 펼치기
          </button>
        </div>
        <div class="cost-info">
          <p class="cost-label">타로 리딩 비용</p>
          <p class="cost-amount">
            800
            <span class="unit">UT</span>
          </p>
        </div>
        <p class="info-text">
          * 6장의 카드로 과거-현재-도전-조언-숨겨진것-결과를 읽어드립니다
        </p>
      </div>
    </div>

    <!-- Step 2: 카드 선택 -->
    <div class="step-container" id="step2">
      <div class="spread-info">
        <h2 class="spread-title">카드를 선택하세요</h2>
        <p class="spread-description" id="selectedQuestion"></p>
        <p class="spread-description" style="margin-top: 10px; color: var(--gold);">
          ✦ 직관을 따라 6장의 카드를 선택해주세요 ✦
        </p>
      </div>

      <!-- 선택된 카드 미리보기 -->
      <div class="selected-cards-preview">
        <div class="preview-title">선택한 카드 (<span id="selectedCount">0</span>/6)</div>
        <div class="preview-cards" id="previewCards">
          <div class="preview-card-empty">?</div>
          <div class="preview-card-empty">?</div>
          <div class="preview-card-empty">?</div>
          <div class="preview-card-empty">?</div>
          <div class="preview-card-empty">?</div>
          <div class="preview-card-empty">?</div>
        </div>
      </div>

      <div class="cards-container" id="cardsContainer">
        <!-- 카드들이 여기에 생성됩니다 -->
      </div>

      <div class="button-group">
        <button class="btn btn-secondary" onclick="goToStep(1)">
          다시 선택하기
        </button>
      </div>
    </div>

    <!-- Step 3: 결과 -->
    <div class="step-container" id="step3">
      <div class="result-section">
        <div class="result-header">
          <h2 class="result-title">✦ 타로 리딩 결과 ✦</h2>
          <p class="result-question" id="resultQuestion"></p>
        </div>

        <div id="interpretations">
          <!-- 해석이 여기에 표시됩니다 -->
        </div>

        <div class="button-group">
          <button class="btn btn-primary" onclick="resetReading()">
            새로운 리딩 시작
          </button>
          <button class="btn btn-secondary" onclick="goToStep(1)">
            질문 변경하기
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 타로 카드 이미지 베이스 URL
    const TAROT_IMAGE_BASE = 'https://www.sacred-texts.com/tarot/pkt/img/';
    
    // 타로 카드 데이터 (메이저 아르카나 22장)
    const TAROT_CARDS = [
      { id: 0, name: 'The Fool', nameKr: '바보', image: 'ar00.jpg', keywords: ['새로운 시작', '순수함', '모험'] },
      { id: 1, name: 'The Magician', nameKr: '마법사', image: 'ar01.jpg', keywords: ['창조력', '기술', '의지'] },
      { id: 2, name: 'The High Priestess', nameKr: '여사제', image: 'ar02.jpg', keywords: ['직관', '신비', '잠재의식'] },
      { id: 3, name: 'The Empress', nameKr: '여황제', image: 'ar03.jpg', keywords: ['풍요', '창조', '모성'] },
      { id: 4, name: 'The Emperor', nameKr: '황제', image: 'ar04.jpg', keywords: ['권위', '안정', '지배'] },
      { id: 5, name: 'The Hierophant', nameKr: '교황', image: 'ar05.jpg', keywords: ['전통', '지혜', '영적 가르침'] },
      { id: 6, name: 'The Lovers', nameKr: '연인', image: 'ar06.jpg', keywords: ['사랑', '선택', '조화'] },
      { id: 7, name: 'The Chariot', nameKr: '전차', image: 'ar07.jpg', keywords: ['승리', '의지', '전진'] },
      { id: 8, name: 'Strength', nameKr: '힘', image: 'ar08.jpg', keywords: ['용기', '인내', '내적 힘'] },
      { id: 9, name: 'The Hermit', nameKr: '은둔자', image: 'ar09.jpg', keywords: ['성찰', '고독', '내면의 빛'] },
      { id: 10, name: 'Wheel of Fortune', nameKr: '운명의 수레바퀴', image: 'ar10.jpg', keywords: ['운명', '변화', '순환'] },
      { id: 11, name: 'Justice', nameKr: '정의', image: 'ar11.jpg', keywords: ['공정', '진실', '균형'] },
      { id: 12, name: 'The Hanged Man', nameKr: '매달린 사람', image: 'ar12.jpg', keywords: ['희생', '새로운 관점', '정지'] },
      { id: 13, name: 'Death', nameKr: '죽음', image: 'ar13.jpg', keywords: ['변화', '종말', '재탄생'] },
      { id: 14, name: 'Temperance', nameKr: '절제', image: 'ar14.jpg', keywords: ['균형', '조화', '중용'] },
      { id: 15, name: 'The Devil', nameKr: '악마', image: 'ar15.jpg', keywords: ['유혹', '속박', '물질주의'] },
      { id: 16, name: 'The Tower', nameKr: '탑', image: 'ar16.jpg', keywords: ['파괴', '급격한 변화', '깨달음'] },
      { id: 17, name: 'The Star', nameKr: '별', image: 'ar17.jpg', keywords: ['희망', '영감', '평온'] },
      { id: 18, name: 'The Moon', nameKr: '달', image: 'ar18.jpg', keywords: ['환상', '불안', '잠재의식'] },
      { id: 19, name: 'The Sun', nameKr: '태양', image: 'ar19.jpg', keywords: ['성공', '기쁨', '활력'] },
      { id: 20, name: 'Judgement', nameKr: '심판', image: 'ar20.jpg', keywords: ['재생', '각성', '심판'] },
      { id: 21, name: 'The World', nameKr: '세계', image: 'ar21.jpg', keywords: ['완성', '성취', '통합'] }
    ];

    // 타로 해석 템플릿 (6장 스프레드용)
    const INTERPRETATIONS = {
      past: [
        '과거, 당신은 "{keyword1}"의 강렬한 에너지 속에 있었습니다. 그 시간이 지금의 당신을 만들었고, 현재 상황의 뿌리가 되었습니다. 그때의 경험은 결코 헛되지 않았습니다.',
        '"{keyword1}"로 점철되었던 과거의 당신. 그 시절의 선택과 경험들이 모여 지금 이 순간을 만들어냈습니다. 돌이켜보면, 모든 것은 필연이었습니다.',
        '과거를 돌아보니 "{keyword1}"의 기운이 당신을 둘러싸고 있었습니다. 당시에는 몰랐지만, 그 모든 순간들이 당신을 성장시켰고 지금의 지혜를 안겨주었습니다.',
        '"{keyword1}"이 지배했던 과거. 그 시절의 아픔과 기쁨, 실패와 성공이 모두 당신의 자양분이 되어 현재의 당신을 빚어냈습니다.'
      ],
      present: [
        '지금 이 순간, "{keyword1}"의 에너지가 당신의 삶을 관통하고 있습니다. "{keyword2}"를 통해 이 시기를 지혜롭게 극복할 수 있을 것입니다. 두려워하지 마세요.',
        '현재 당신은 "{keyword1}"의 한가운데 서 있습니다. 이것은 시험이자 기회입니다. "{keyword2}"에 집중하며 한 걸음씩 나아가세요. 길은 반드시 열립니다.',
        '"{keyword1}"이 당신의 현재를 정의하고 있습니다. 이 순간이 영원할 것 같지만, 모든 것은 흘러갑니다. "{keyword2}"를 기억하며 중심을 잡으세요.',
        '지금 당신 주변에는 "{keyword1}"의 기운이 강하게 흐르고 있습니다. "{keyword2}"를 잃지 않는다면, 이 상황은 당신을 더 높은 곳으로 이끌 것입니다.'
      ],
      challenge: [
        '당신 앞에 "{keyword1}"이라는 장애물이 놓여있습니다. 하지만 이것은 당신을 시험하기 위한 우주의 선물입니다. "{keyword2}"를 무기로 삼아 용감히 맞서세요.',
        '"{keyword1}"의 도전이 당신을 기다립니다. 두려움은 자연스러운 것입니다. 하지만 "{keyword2}"를 믿는다면, 이 시련은 당신을 더욱 강하게 만들 것입니다.',
        '극복해야 할 "{keyword1}"의 벽. 높아 보이지만, 당신 안에는 이미 "{keyword2}"의 힘이 있습니다. 자신을 믿고 한 걸음씩 나아가세요.',
        '"{keyword1}"이라는 시험이 당신을 가로막고 있습니다. 그러나 이것은 성장의 기회입니다. "{keyword2}"를 깨달을 때, 길은 저절로 열릴 것입니다.'
      ],
      advice: [
        '카드가 조언합니다. "{keyword1}"을 받아들이라고. "{keyword2}"의 자세로 상황을 바라본다면, 해답은 이미 당신 곁에 있습니다.',
        '지혜로운 선택은 "{keyword1}"을 따르는 것입니다. "{keyword2}"를 잊지 말고, 당신의 직관을 믿으세요. 내면의 목소리가 길을 알려줄 것입니다.',
        '"{keyword1}"이 당신에게 필요한 답입니다. "{keyword2}"를 실천하며 조금씩 나아가세요. 완벽함보다 꾸준함이 더 중요합니다.',
        '현명한 길은 "{keyword1}"을 선택하는 것입니다. "{keyword2}"의 마음가짐으로 임한다면, 어떤 상황도 긍정적으로 바뀔 것입니다.'
      ],
      hidden: [
        '보이지 않는 곳에서 "{keyword1}"의 힘이 작용하고 있습니다. 당신이 모르는 사이, "{keyword2}"가 당신을 보호하고 인도하고 있습니다.',
        '숨겨진 진실은 "{keyword1}"입니다. 표면 아래에서 "{keyword2}"가 조용히 움직이며 상황을 변화시키고 있습니다. 인내심을 가지세요.',
        '당신이 아직 깨닫지 못한 "{keyword1}"의 영향력. 무의식 속에서 "{keyword2}"가 당신의 선택을 이끌고 있습니다. 자신의 감정에 귀 기울이세요.',
        '드러나지 않은 "{keyword1}"의 에너지. "{keyword2}"라는 형태로 언젠가 당신 앞에 모습을 드러낼 것입니다. 지금은 때를 기다리세요.'
      ],
      outcome: [
        '최종적으로 "{keyword1}"이 당신을 기다립니다. "{keyword2}"와 함께 그곳에 도달할 것입니다. 여정의 끝에는 빛이 있습니다.',
        '모든 것의 결말은 "{keyword1}"입니다. "{keyword2}"를 품고 나아간다면, 당신이 꿈꾸던 미래가 현실이 될 것입니다. 희망을 잃지 마세요.',
        '결과는 "{keyword1}"으로 귀결됩니다. "{keyword2}"의 과정을 거치며, 당신은 원하던 것보다 더 큰 것을 얻게 될 것입니다.',
        '종착지에는 "{keyword1}"이 기다립니다. "{keyword2}"라는 선물과 함께. 그곳은 당신이 상상했던 것보다 훨씬 아름다운 곳일 것입니다.'
      ]
    };

    // 상태 관리
    let currentQuestion = '';
    let selectedCards = [];
    let allCards = [];

    // 별 생성
    function createStars() {
      const starsContainer = document.getElementById('stars');
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        starsContainer.appendChild(star);
      }
    }

    // 초기화
    createStars();

    // 질문 선택
    function selectQuestion(question) {
      currentQuestion = question;
      setupCardSelection();
    }

    function selectCustomQuestion() {
      const input = document.getElementById('customQuestion');
      const question = input.value.trim();
      
      if (!question) {
        alert('질문을 입력해주세요.');
        return;
      }
      
      currentQuestion = question;
      setupCardSelection();
    }

    // 카드 선택 화면 설정
    function setupCardSelection() {
      document.getElementById('selectedQuestion').textContent = `"${currentQuestion}"`;
      
      // 22장의 카드 섞기
      allCards = [...TAROT_CARDS].sort(() => Math.random() - 0.5);
      
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';
      
      // 미리보기 초기화
      const previewCards = document.getElementById('previewCards');
      previewCards.innerHTML = `
        <div class="preview-card-empty">?</div>
        <div class="preview-card-empty">?</div>
        <div class="preview-card-empty">?</div>
        <div class="preview-card-empty">?</div>
        <div class="preview-card-empty">?</div>
        <div class="preview-card-empty">?</div>
      `;
      document.getElementById('selectedCount').textContent = '0';
      
      // 15장의 카드 표시 (6장을 선택할 수 있도록)
      for (let i = 0; i < 15; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.dataset.index = i;
        
        const card = document.createElement('div');
        card.className = 'tarot-card';
        
        const cardData = allCards[i];
        
        card.innerHTML = `
          <div class="card-back">
            <div class="card-back-pattern">TAROT</div>
          </div>
        `;
        
        wrapper.appendChild(card);
        wrapper.onclick = () => selectCard(i);
        container.appendChild(wrapper);
      }
      
      selectedCards = [];
      goToStep(2);
    }

    // 카드 선택
    function selectCard(index) {
      if (selectedCards.length >= 6) {
        alert('이미 6장의 카드를 선택했습니다.');
        return;
      }
      
      const wrapper = document.querySelector(`.card-wrapper[data-index="${index}"]`);
      if (wrapper.classList.contains('selected')) {
        return;
      }
      
      // 카드 선택 표시
      wrapper.classList.add('selected');
      
      const cardData = allCards[index];
      selectedCards.push(cardData);
      
      // 미리보기에 카드 추가
      const previewCards = document.getElementById('previewCards');
      const emptySlot = previewCards.querySelector('.preview-card-empty');
      
      if (emptySlot) {
        const previewCard = document.createElement('div');
        previewCard.className = 'preview-card';
        previewCard.innerHTML = `
          <img src="${TAROT_IMAGE_BASE}${cardData.image}" alt="${cardData.name}" />
          <div class="preview-card-number">${selectedCards.length}</div>
        `;
        emptySlot.replaceWith(previewCard);
      }
      
      // 선택된 카드 수 업데이트
      document.getElementById('selectedCount').textContent = selectedCards.length;
      
      // 6장 선택 완료 시 결과 표시
      if (selectedCards.length === 6) {
        setTimeout(() => {
          showResult();
        }, 800);
      }
    }

    // 결과 표시
    function showResult() {
      document.getElementById('resultQuestion').textContent = `"${currentQuestion}"`;
      
      const positions = [
        '과거 (Past)', 
        '현재 (Present)', 
        '도전 (Challenge)', 
        '조언 (Advice)', 
        '숨겨진 것 (Hidden)', 
        '결과 (Outcome)'
      ];
      const positionKeys = ['past', 'present', 'challenge', 'advice', 'hidden', 'outcome'];
      const container = document.getElementById('interpretations');
      container.innerHTML = '';
      
      selectedCards.forEach((card, index) => {
        const positionKey = positionKeys[index];
        const templates = INTERPRETATIONS[positionKey];
        const template = templates[Math.floor(Math.random() * templates.length)];
        
        const interpretation = template
          .replace('{keyword1}', card.keywords[0])
          .replace('{keyword2}', card.keywords[1] || card.keywords[0]);
        
        const cardHtml = `
          <div class="interpretation-card">
            <h3 class="card-position-title">${positions[index]}</h3>
            <div class="card-display">
              <div class="card-mini">
                <img src="${TAROT_IMAGE_BASE}${card.image}" alt="${card.name}" />
              </div>
              <div class="card-info">
                <div class="card-title-main">${card.name}</div>
                <div class="card-title-sub">${card.nameKr}</div>
              </div>
            </div>
            <p class="interpretation-text">${interpretation}</p>
            <div class="interpretation-keywords">
              ${card.keywords.map(k => `<span class="keyword-tag">${k}</span>`).join('')}
            </div>
          </div>
        `;
        
        container.innerHTML += cardHtml;
      });
      
      goToStep(3);
    }

    // 단계 이동
    function goToStep(step) {
      document.querySelectorAll('.step-container').forEach(el => {
        el.classList.remove('active');
      });
      document.getElementById(`step${step}`).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 리셋
    function resetReading() {
      selectedCards = [];
      document.getElementById('customQuestion').value = '';
      goToStep(1);
    }
  </script>
</body>
