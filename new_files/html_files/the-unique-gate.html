<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>The Unique – Gate</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="The Unique – 초대 전용 게이트">
  <meta property="og:description" content="Invitation-only access for action takers.">
  <meta property="og:url" content="https://wordycow.github.io/so.t-leader-choice/the-unique-gate.html">
  <meta property="og:image" content="https://wordycow.github.io/so.t-leader-choice/img/the-unique-gate-preview.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Unique – 초대 전용 게이트">
  <meta name="twitter:description" content="Invitation-only access for action takers.">
  <meta name="twitter:image" content="https://wordycow.github.io/so.t-leader-choice/img/the-unique-gate-preview.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #f9fafb;
      background: #000 url('img/gate-background.png') center/cover no-repeat fixed;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      z-index: 10;
    }

    .gate-card {
      position: relative;
      border-radius: 26px;
      padding: 28px 26px 22px;
      background: radial-gradient(circle at top, rgba(248,181,84,0.15), rgba(15,23,42,0.96));
      border: 1px solid rgba(250, 204, 21, 0.95);
      box-shadow:
        0 0 20px rgba(250, 204, 21, 0.75),
        0 28px 70px rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: visible;
      z-index: 20;
      width: min(460px, 92vw);
    }

    .gate-inner { position: relative; z-index: 1; }

    .gate-title-wrap { text-align: center; margin-bottom: 18px; }

    .gate-title {
      font-family: "Cinzel", "Times New Roman", serif;
      font-weight: 700;
      font-size: 38px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 8px;

      background: linear-gradient(180deg, #fffaf0 0%, #facc6b 45%, #d97706 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 10px rgba(250, 204, 21, 0.9),
        0 4px 18px rgba(0,0,0,1);
    }

    .gate-subtitle-en {
      font-size: 11px;
      color: #f9fafb;
      opacity: 0.9;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow:
        0 1px 3px rgba(0,0,0,0.9),
        0 0 6px rgba(0,0,0,0.6);
    }

    .form-body { max-width: 360px; margin: 0 auto; }
    .gate-input-wrap { margin-bottom: 10px; }

    .gate-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid rgba(55,65,81,0.9);
      background: radial-gradient(circle at top, rgba(15,23,42,0.90), rgba(3,7,18,0.96));
      color: #f9fafb;
      font-size: 13px;
      outline: none;
      box-shadow:
        0 4px 14px rgba(0,0,0,0.75) inset,
        0 0 0 1px rgba(0,0,0,0.55);
    }
    .gate-input::placeholder { color: #6b7280; }
    .gate-input:focus {
      border-color: rgba(248,181,84,0.95);
      box-shadow:
        0 0 0 1px rgba(248,181,84,0.6),
        0 6px 22px rgba(0,0,0,0.9) inset;
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .btn {
      width: 100%;
      padding: 10px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background 0.12s ease,
        border-color 0.12s ease,
        opacity 0.12s ease;
      user-select: none;
    }
    .btn:disabled{
      cursor: not-allowed;
      opacity: .65;
      transform: none !important;
    }

    .btn-primary {
      background: radial-gradient(circle at top, #f97316, #7f1d1d);
      border-color: rgba(248,181,84,0.95);
      color: #fef2f2;
      box-shadow:
        0 10px 26px rgba(0,0,0,1),
        0 0 0 1px rgba(0,0,0,0.5) inset;
    }
    .btn-primary:hover { transform: translateY(-1px); }

    .btn-market{
      background: radial-gradient(circle at top, rgba(250,204,21,0.95), rgba(202,138,4,0.55));
      color:#111827;
      border: 1px solid rgba(250,204,21,0.95);
      box-shadow: 0 12px 28px rgba(0,0,0,0.95);
      letter-spacing: 0.16em;
      font-weight: 900;
    }
    .btn-market span{
      font-family:"Cinzel","Times New Roman",serif;
      font-weight:900;
      letter-spacing:0.22em;
      text-transform:uppercase;
    }

    .btn-ghost {
      background: radial-gradient(circle at top, rgba(15,23,42,0.95), rgba(15,23,42,0.98));
      border-color: rgba(55,65,81,1);
      color: #e5e7eb;
      box-shadow: 0 8px 22px rgba(0,0,0,0.9);
    }
    .btn-ghost:hover {
      background: rgba(15,23,42,1);
      border-color: rgba(148,163,184,0.9);
    }

    .btn-with-icon{ gap:10px; justify-content:center; }
    .btn-with-icon svg{ width:18px; height:18px; flex:0 0 18px; display:block; }
    .btn-with-icon span{ line-height:1; }

    /* ✅ 이미지처럼 기본 안내문을 아래에 고정 느낌으로 */
    .status {
      min-height: 18px;
      font-size: 11px;
      text-align: center;
      margin-top: 10px;
      color: rgba(226,232,240,0.88); /* 기본 회색 안내 */
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      letter-spacing: 0.02em;
    }
    .status-error { color: #fecaca; }
    .status-ok { color: #bbf7d0; }
    :root{
      --bat-top: -8vh;
      --bat-right: 0vw;
      --bat-width: clamp(320px, 55vw, 900px);
      --bat-bob: 20px;

      --witch-top: 28vh;
      --witch-right: 20vw;
      --witch-width: clamp(18px, 7vw, 44px);
      --witch-bob: 6px;
    }
    .spirit{
      position:absolute;
      pointer-events:none;
      z-index: 1;
    }
    .spirit img{
      display:block;
      width:100%;
      height:auto;
      filter:none;
    }

    @keyframes floatY {
      from { transform: translateY(calc(-1 * var(--bob))); }
      to   { transform: translateY(var(--bob)); }
    }

    .spirit-bat{
      top: var(--bat-top);
      right: var(--bat-right);
      width: var(--bat-width);
      --bob: var(--bat-bob);
      animation: floatY 2.2s ease-in-out infinite alternate;
      opacity: .95;
    }

    .spirit-witch{
      top: var(--witch-top);
      right: var(--witch-right);
      width: var(--witch-width);
      --bob: var(--witch-bob);
      animation: floatY 3.2s ease-in-out infinite alternate;
    }

    @media (max-width: 768px) {
      .gate-card { padding: 24px 20px 18px; border-radius: 22px; }
      .gate-title { font-size: 32px; letter-spacing: 0.22em; }
      .form-body { max-width: 100%; }

      :root{
        --bat-top: 10vh;
        --bat-right: -22vw;
        --bat-width: 85vw;

        --witch-top: 18vh;
        --witch-right: 34vw;
        --witch-width: 12vw;
      }
    }
  </style>

  
  
  


  <!-- Medieval Magic Theme (골드 + 딥블루) -->
  <link rel="stylesheet" href="css/medieval-magic.css">
  <link rel="stylesheet" href="css/medieval-override.css">

</head>

<body>
  <div class="scene">
    <img src="img/bg-unique-gate-clean.jpg" class="scene-bg" alt="The Unique Gate background" loading="lazy" decoding="async">
    <div class="spirit spirit-witch"><img src="img/witch-float.png" alt="" loading="lazy" decoding="async"></div>
    <div class="spirit spirit-bat"><img src="img/bat-float.png" alt="" loading="lazy" decoding="async"></div>
  </div>

  <div class="page-wrap">
    <main class="gate-card">
      <div class="gate-inner">
        <div class="gate-title-wrap">
          <div class="gate-title">THE UNIQUE</div>
          <div class="gate-subtitle-en">Invitation-only access for action takers</div>
        </div>

        <form id="gate-form" class="form-body" autocomplete="off">
          <div class="gate-input-wrap">
            <input id="login-id" class="gate-input" type="text" autocomplete="username" placeholder="아이디" />
          </div>

          <div class="btn-row">
            <!-- 기본 Enter 제출은 "UNIQUE MAIN" -->
            <button type="submit" class="btn btn-primary" id="btn-main">UNIQUE MAIN</button>

            <button type="button" class="btn btn-market btn-with-icon" id="btn-market">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2ZM7.2 14h9.9c.75 0 1.41-.41 1.75-1.03l3.24-5.88A1 1 0 0 0 21.21 6H6.02L5.6 4.35A1 1 0 0 0 4.63 3.6H2a1 1 0 1 0 0 2h1.86l2.29 8.91-.94 1.72C4.52 17.37 5.48 19 6.94 19H20a1 1 0 1 0 0-2H6.94l.26-.48.0-.01Z"/>
              </svg>
              <span>UNIQUE MARKET</span>
            </button>

            <a href="the-unique-signup.html?return=the-unique-gate.html" class="btn btn-ghost">회원가입</a>

            <!-- return 버튼은 파라미터 있을 때만 노출 -->
            <button type="button" class="btn btn-ghost" id="btn-return" style="display:none;">
              이전 화면으로 계속
            </button>
          </div>

          <div id="status" class="status">아이디를 입력해 주세요.</div>

          <div class="gate-emblem" aria-hidden="true">
            <div class="xmark"></div>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
  // ✅ 구글 Apps Script 웹앱
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";

  // ✅ 로그인 성공 시 이동 대상
  const MAIN_PAGE   = "the-unique-main.html";
  const MARKET_PAGE = "market.html";

  // ✅ 인앱 브라우저 감지
  function isInAppBrowser(){
    const ua = navigator.userAgent || "";
    return /KAKAOTALK|Instagram|FBAN|FBAV|Line|NAVER|DaumApps|Whale|Telegram|TikTok/i.test(ua);
  }
  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  // ✅ 안전한 return 검증 (상대경로 html만 허용)
  function safeReturnPath(p){
    p = String(p || "").trim();
    if (!p) return "";
    if (/^[a-zA-Z]+:\/\//.test(p)) return "";
    if (p.includes("..")) return "";
    if (!/^[a-z0-9\-_/]+\.html(\?.*)?$/i.test(p)) return "";
    return p;
  }

  // ✅ JSONP 1회 호출
  function apiOnceJSONP(action, params = {}, timeoutMs = 20000) {
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);

      params.action = action;
      params.callback = cb;
      params._t = Date.now();

      const qs = new URLSearchParams(params).toString();
      const s = document.createElement("script");
      const joiner = GOOGLE_SCRIPT_URL.includes("?") ? "&" : "?";
      s.src = GOOGLE_SCRIPT_URL + joiner + qs;

      const t = setTimeout(() => {
        cleanup();
        reject(new Error("API timeout"));
      }, timeoutMs);

      window[cb] = (data) => { cleanup(); resolve(data); };
      s.onerror = () => { cleanup(); reject(new Error("API load failed")); };

      function cleanup() {
        clearTimeout(t);
        try { delete window[cb]; } catch(e){}
        try { s.remove(); } catch(e){}
      }

      document.body.appendChild(s);
    });
  }

  // ✅ JSONP 재시도
  async function apiJSONP(action, params = {}) {
    let lastErr = null;
    const tries = 3;
    for (let i = 1; i <= tries; i++){
      try{
        const timeoutMs = (i === 1) ? 16000 : 24000;
        return await apiOnceJSONP(action, params, timeoutMs);
      } catch(e){
        lastErr = e;
        await sleep(350 * i);
      }
    }
    throw lastErr || new Error("API failed");
  }

  function setStatus(msg, type=""){
    const el = document.getElementById("status");
    if (!el) return;
    el.textContent = msg || "";
    el.className = "status" + (type === "error" ? " status-error" : (type === "ok" ? " status-ok" : ""));
  }

  function pick(obj, keys){
    for (const k of keys){
      if (obj && obj[k] != null && String(obj[k]).trim() !== "") return obj[k];
    }
    return "";
  }

  function normalizeUser(u, fallbackId){
    const rawId = String(pick(u, ["id","ID","userId","userid","아이디"]) || fallbackId || "").trim();
    const idLower = rawId.toLowerCase();

    return {
      id: idLower,
      name: String(pick(u, ["name","이름","성명","fullName"]) || "").trim(),
      nickname: String(pick(u, ["nickname","닉네임","별명"]) || "").trim(),
      phone: String(pick(u, ["phone","전화번호","핸드폰","휴대폰"]) || "").trim(),
      team: String(pick(u, ["team","소속","추천인","리더","sponsor"]) || "").trim(),
      joinedAt: String(pick(u, ["joinedAt","joinAt","timestamp","타임스탬프"]) || "").trim(),
      balance: Number(pick(u, ["balance","ut","points","포인트"]) || 0),
    };
  }

  function saveUserToLocal(u){
    const idLower = String(u.id || "").toLowerCase().trim();

    localStorage.setItem("uniqueCurrentUser", JSON.stringify({
      id: idLower,
      name: u.name || "",
      phone: u.phone || "",
      team: u.team || "",
      joinedAt: u.joinedAt || "",
      nickname: u.nickname || "",
      balance: Number(u.balance || 0)
    }));

    // ✅ 다른 페이지 호환 키들
    localStorage.setItem("unique_user_id", idLower);
    localStorage.setItem("user_id", idLower);
    localStorage.setItem("uid", idLower);
    localStorage.setItem("id", idLower);

    localStorage.setItem("unique_user_name", u.name || "");
    localStorage.setItem("unique_user_nick", u.nickname || "");
    localStorage.setItem("myUtPoints", String(Number(u.balance || 0)));

    localStorage.setItem("uniqueLastLoginId", idLower);
  }

  function extractUser(resp){
    if (!resp) return null;
    if (resp.user) return resp.user;
    if (resp.data) return resp.data;
    if (resp.row)  return resp.row;
    if (resp.result && resp.result.user) return resp.result.user;

    const hasAny =
      (resp.id || resp.ID || resp.아이디 || resp.name || resp.이름 || resp.phone || resp.전화번호 || resp.team || resp.소속);
    return hasAny ? resp : null;
  }

  function isOk(resp){
    if (!resp) return false;
    if (resp.ok === true) return true;
    if (resp.success === true) return true;
    if (String(resp.status || "").toLowerCase() === "ok") return true;
    if (String(resp.result || "").toLowerCase() === "ok") return true;
    if (resp.found === true || resp.exists === true) return true;
    return false;
  }

  // ✅ 서버가 대소문자 구분해도 통과시키기 위해 3번 조회
  async function getUserByIdRobust(rawId){
    const base = String(rawId || "").trim();
    if (!base) return null;

    const candidates = [];
    for (const v of [base, base.toLowerCase(), base.toUpperCase()]){
      if (v && !candidates.includes(v)) candidates.push(v);
    }

    let lastResp = null;
    for (const idTry of candidates){
      const r = await apiJSONP("getUser", { id: idTry });
      lastResp = r;
      const u0 = extractUser(r);
      if (isOk(r) && u0) return normalizeUser(u0, idTry);
    }

    const u1 = extractUser(lastResp);
    if (isOk(lastResp) && u1) return normalizeUser(u1, base);

    return null;
  }

  function setBusy(isBusy){
    const btnMain = document.getElementById("btn-main");
    const btnMarket = document.getElementById("btn-market");
    const btnReturn = document.getElementById("btn-return");
    if (btnMain) btnMain.disabled = !!isBusy;
    if (btnMarket) btnMarket.disabled = !!isBusy;
    if (btnReturn) btnReturn.disabled = !!isBusy;
  }

  const form = document.getElementById("gate-form");
  const idInput = document.getElementById("login-id");
  const btnMarket = document.getElementById("btn-market");
  const btnReturn = document.getElementById("btn-return");

  // 쿼리 파라미터 처리
  const qs = new URLSearchParams(location.search);
  const preId = (qs.get("id") || qs.get("userid") || qs.get("user") || "").trim();
  const signup = qs.get("signup");
  const returnPage = safeReturnPath(qs.get("return"));

  // 마지막 로그인 아이디 자동 채움
  const lastId = String(localStorage.getItem("uniqueLastLoginId") || "").trim();
  if (idInput) idInput.value = preId || lastId || "";

  // 인앱 경고(스크린샷 UI 유지하면서도 안내는 뜨게)
  if (isInAppBrowser()){
    setStatus("⚠️ 카톡/인스타/텔레그램 내장 브라우저에서는 통신이 막힐 수 있어요. 크롬/사파리로 열면 안정적입니다.", "error");
  } else if (signup === "1"){
    setStatus("✅ 회원가입 완료! 아이디 입력 후 입장하세요.", "ok");
  } else {
    // ✅ 기본 상태: 이미지처럼 항상 안내문
    setStatus("아이디를 입력해 주세요.");
  }

  // return 버튼 노출(필요할 때만)
  if (returnPage && btnReturn){
    btnReturn.style.display = "inline-flex";
    btnReturn.textContent = "이전 화면으로 계속";
    btnReturn.addEventListener("click", async () => {
      await doLogin(returnPage);
    });
  }

  // 메인(Enter) 로그인
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    await doLogin(MAIN_PAGE);
  });

  // 마켓 로그인
  if (btnMarket){
    btnMarket.addEventListener("click", async () => {
      await doLogin(MARKET_PAGE);
    });
  }

  async function doLogin(targetPage){
    const rawId = (idInput?.value || "").trim();
    if (!rawId) { setStatus("아이디를 입력해 주세요.", "error"); return; }

    setBusy(true);
    setStatus("회원 확인 중...");

    try {
      const user = await getUserByIdRobust(rawId);

      if (!user || !user.id) {
        setStatus("등록되지 않은 아이디입니다. (대소문자/띄어쓰기 확인)", "error");
        setBusy(false);
        return;
      }

      // ✅ 비번 없이 통과
      saveUserToLocal(user);

      // ✅ 타겟으로 이동
      location.href = targetPage || MAIN_PAGE;

    } catch (err) {
      console.error(err);
      const msg = String(err && err.message ? err.message : err);

      if (msg.includes("timeout")) {
        setStatus("네트워크 지연으로 응답이 늦습니다. 다시 시도해 주세요.", "error");
      } else if (msg.includes("load failed")) {
        setStatus("script.google.com 연결이 차단됐을 수 있습니다. (광고차단/보안DNS/인앱브라우저 확인)", "error");
      } else {
        setStatus("서버 통신 중 오류가 발생했습니다. (잠시 후 다시 시도)", "error");
      }
      setBusy(false);
    }
  }
  </script>
</body>
