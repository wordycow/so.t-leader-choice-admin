<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 관리자 대시보드 - Upbit AI Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e4e4e7;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding: 20px;
      background: rgba(30, 30, 45, 0.8);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 32px;
      background: linear-gradient(135deg, #fbbf24 0%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logout-btn {
      padding: 10px 20px;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #ef4444;
      color: white;
    }
    
    .logout-btn[style*="color: #1E88E5"]:hover {
      background: #1E88E5 !important;
      color: white !important;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: rgba(30, 30, 45, 0.8);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(251, 191, 36, 0.5);
    }

    .stat-label {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #fbbf24;
    }

    .stat-sub {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .users-table {
      background: rgba(30, 30, 45, 0.8);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .table-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-title {
      font-size: 20px;
      font-weight: 700;
      color: #fbbf24;
    }

    .refresh-btn {
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: #10b981;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: rgba(20, 20, 30, 0.5);
    }

    th {
      padding: 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
    }

    tbody tr {
      transition: background 0.2s;
    }

    tbody tr:hover {
      background: rgba(251, 191, 36, 0.05);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-running {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }

    .status-stopped {
      background: rgba(107, 114, 128, 0.2);
      color: #9ca3af;
      border: 1px solid #6b7280;
    }

    .subscription-active {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .subscription-expired {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .profit-positive {
      color: #10b981;
      font-weight: 600;
    }

    .profit-negative {
      color: #ef4444;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9ca3af;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      margin-right: 6px;
      margin-bottom: 4px;
    }

    .btn-edit-date {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
      border: 1px solid #3b82f6;
    }

    .btn-edit-date:hover {
      background: #3b82f6;
      color: white;
    }

    .btn-add-days {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }

    .btn-add-days:hover {
      background: #10b981;
      color: white;
    }

    .btn-stop-bot {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
    }

    .btn-stop-bot:hover {
      background: #ef4444;
      color: white;
    }

    .btn-start-bot {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }

    .btn-start-bot:hover {
      background: #10b981;
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1e1e2d;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 500px;
      width: 90%;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      background: rgba(20, 20, 30, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 14px;
    }

    .form-input:focus {
      outline: none;
      border-color: #fbbf24;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-modal {
      flex: 1;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-confirm {
      background: #10b981;
      color: white;
    }

    .btn-confirm:hover {
      background: #059669;
    }

    .btn-cancel {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
    }

    .btn-cancel:hover {
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <h1>🔧 관리자 대시보드</h1>
      <div style="display: flex; gap: 12px;">
        <button class="logout-btn" style="background: rgba(30, 136, 229, 0.2); color: #1E88E5; border-color: #1E88E5;" onclick="window.location.href='/'">
          🏠 대시보드
        </button>
        <button class="logout-btn" onclick="logout()">🚪 로그아웃</button>
      </div>
    </div>

    <!-- 통계 카드 -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">📊 총 사용자</div>
        <div class="stat-value" id="totalUsers">-</div>
        <div class="stat-sub">등록된 전체 사용자</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">🚀 실행 중인 봇</div>
        <div class="stat-value" id="runningBots">-</div>
        <div class="stat-sub">현재 활성 상태</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">✅ 구독 활성</div>
        <div class="stat-value" id="activeSubscriptions">-</div>
        <div class="stat-sub">유효한 구독자</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">📈 평균 수익률</div>
        <div class="stat-value" id="totalProfit">-</div>
        <div class="stat-sub">전체 사용자 평균</div>
      </div>
    </div>

    <!-- 사용자 테이블 -->
    <div class="users-table">
      <div class="table-header">
        <div class="table-title">👥 사용자 목록</div>
        <button class="refresh-btn" onclick="loadUsers()">🔄 새로고침</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>사용자명</th>
            <th>봇 상태</th>
            <th>시드 금액</th>
            <th>현재 잔고</th>
            <th>수익률</th>
            <th>구독 만료일</th>
            <th>가입일</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr>
            <td colspan="10" class="loading">
              <div>⏳ 사용자 데이터를 불러오는 중...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 날짜 수정 모달 -->
  <div id="editDateModal" class="modal">
    <div class="modal-content">
      <div class="modal-title">📅 구독 만료일 수정</div>
      <div class="form-group">
        <label class="form-label">사용자 ID</label>
        <input type="text" class="form-input" id="modalUserId" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">새로운 만료일</label>
        <input type="date" class="form-input" id="modalExpiresAt">
      </div>
      <div class="modal-actions">
        <button class="btn-modal btn-confirm" onclick="saveExpiresDate()">✅ 저장</button>
        <button class="btn-modal btn-cancel" onclick="closeModal()">❌ 취소</button>
      </div>
    </div>
  </div>

  <script>
    let currentEditUserId = null;

    // 페이지 로드 시 데이터 불러오기
    window.addEventListener('DOMContentLoaded', () => {
      loadUsers();
      // 10초마다 자동 새로고침
      setInterval(loadUsers, 10000);
    });

    // 사용자 목록 불러오기
    async function loadUsers() {
      try {
        const response = await fetch('/api/admin/users');
        if (!response.ok) {
          throw new Error('관리자 권한이 없습니다');
        }

        const data = await response.json();
        
        // 통계 업데이트
        document.getElementById('totalUsers').textContent = data.stats.total_users;
        document.getElementById('runningBots').textContent = data.stats.running_bots;
        document.getElementById('activeSubscriptions').textContent = data.stats.active_subscriptions;
        
        const avgProfit = data.stats.average_profit_rate;
        const profitEl = document.getElementById('totalProfit');
        profitEl.textContent = avgProfit >= 0 ? `+${avgProfit.toFixed(2)}%` : `${avgProfit.toFixed(2)}%`;
        profitEl.style.color = avgProfit >= 0 ? '#10b981' : '#ef4444';

        // 사용자 테이블 업데이트
        const tbody = document.getElementById('usersTableBody');
        
        if (data.users.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="9" class="empty-state">
                <div class="empty-icon">📭</div>
                <div>등록된 사용자가 없습니다</div>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = data.users.map(user => {
          const isActive = user.subscription_expires_at && new Date(user.subscription_expires_at) > new Date();
          
          return `
            <tr>
              <td>${user.user_id}</td>
              <td><strong>${user.username || 'Guest'}</strong></td>
              <td>
                <span class="status-badge ${user.bot_running ? 'status-running' : 'status-stopped'}">
                  ${user.bot_running ? '🟢 실행' : '⚪ 정지'}
                </span>
              </td>
              <td>${formatNumber(user.seed_amount)}원</td>
              <td>${formatNumber(user.current_balance)}원</td>
              <td class="${user.profit_rate >= 0 ? 'profit-positive' : 'profit-negative'}">
                ${user.profit_rate >= 0 ? '+' : ''}${user.profit_rate.toFixed(2)}%
              </td>
              <td>
                <span class="${isActive ? 'subscription-active' : 'subscription-expired'}">
                  ${user.subscription_expires_at ? formatDate(user.subscription_expires_at) : '미설정'}
                </span>
              </td>
              <td>${formatDate(user.created_at)}</td>
              <td>
                <button class="action-btn ${user.bot_running ? 'btn-stop-bot' : 'btn-start-bot'}" 
                        onclick="${user.bot_running ? `stopUserBot('${user.user_id}')` : `startUserBot('${user.user_id}')`}">
                  ${user.bot_running ? '⏹️ 정지' : '▶️ 시작'}
                </button>
                <button class="action-btn btn-edit-date" onclick="openEditModal('${user.user_id}', '${user.subscription_expires_at || ''}')">
                  📅 날짜
                </button>
                <button class="action-btn btn-add-days" onclick="addDays('${user.user_id}', 1)">
                  +일수
                </button>
              </td>
            </tr>
          `;
        }).join('');

      } catch (error) {
        console.error('데이터 로드 실패:', error);
        document.getElementById('usersTableBody').innerHTML = `
          <tr>
            <td colspan="9" style="text-align: center; color: #ef4444; padding: 40px;">
              ❌ ${error.message}
            </td>
          </tr>
        `;
      }
    }

    // 날짜 수정 모달 열기
    function openEditModal(userId, currentDate) {
      currentEditUserId = userId;
      document.getElementById('modalUserId').value = userId;
      
      // 현재 날짜를 input에 설정
      if (currentDate && currentDate !== 'null' && currentDate !== 'None') {
        const date = new Date(currentDate);
        document.getElementById('modalExpiresAt').value = date.toISOString().split('T')[0];
      } else {
        // 기본값: 오늘부터 30일 후
        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 30);
        document.getElementById('modalExpiresAt').value = defaultDate.toISOString().split('T')[0];
      }
      
      document.getElementById('editDateModal').classList.add('active');
    }

    // 모달 닫기
    function closeModal() {
      document.getElementById('editDateModal').classList.remove('active');
      currentEditUserId = null;
    }

    // 만료일 저장
    async function saveExpiresDate() {
      const userId = currentEditUserId;
      const expiresAt = document.getElementById('modalExpiresAt').value;
      
      if (!expiresAt) {
        alert('날짜를 선택하세요');
        return;
      }
      
      try {
        const response = await fetch('/api/admin/subscription/set-date', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, expires_at: expiresAt })
        });

        const result = await response.json();
        
        if (response.ok) {
          alert(`✅ ${userId} 구독 만료일이 ${expiresAt}로 설정되었습니다`);
          closeModal();
          loadUsers();
        } else {
          throw new Error(result.message || '저장 실패');
        }
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    // N일 추가 (사용자 입력)
    async function addDays(userId, defaultDays = 1) {
      const days = prompt(`${userId}에게 추가할 일수를 입력하세요:`, defaultDays);
      
      if (!days || days <= 0) {
        alert('유효한 일수를 입력하세요');
        return;
      }
      
      const daysNum = parseInt(days);
      if (isNaN(daysNum) || daysNum <= 0) {
        alert('숫자를 입력하세요');
        return;
      }
      
      if (!confirm(`${userId}에게 ${daysNum}일을 추가하시겠습니까?`)) return;
      
      try {
        const response = await fetch('/api/admin/subscription/add-days', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, days: daysNum })
        });

        const result = await response.json();
        
        if (response.ok) {
          alert(`✅ ${result.message}`);
          loadUsers();
        } else {
          throw new Error(result.message || '추가 실패');
        }
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    // 사용자 봇 정지
    async function stopUserBot(userId) {
      if (!confirm(`${userId}의 봇을 정지하시겠습니까?`)) return;
      
      try {
        const response = await fetch('/api/admin/bot/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });

        const result = await response.json();
        
        if (response.ok) {
          alert(`✅ ${result.message}`);
          loadUsers();
        } else {
          throw new Error(result.message || '정지 실패');
        }
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    // 사용자 봇 시작
    async function startUserBot(userId) {
      if (!confirm(`${userId}의 봇을 시작하시겠습니까?`)) return;
      
      try {
        const response = await fetch('/api/admin/bot/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });

        const result = await response.json();
        
        if (response.ok) {
          alert(`✅ ${result.message}`);
          loadUsers();
        } else {
          throw new Error(result.message || '시작 실패');
        }
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }


    // 숫자 포맷팅
    function formatNumber(num) {
      return Number(num).toLocaleString('ko-KR');
    }

    // 날짜 포맷팅
    function formatDate(dateStr) {
      if (!dateStr || dateStr === 'None' || dateStr === 'null') return '-';
      const date = new Date(dateStr);
      return date.toLocaleDateString('ko-KR', { 
        year: 'numeric', 
        month: '2-digit', 
        day: '2-digit' 
      });
    }

    // 로그아웃
    function logout() {
      if (confirm('로그아웃 하시겠습니까?')) {
        window.location.href = '/logout';
      }
    }

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
      }
    });
  </script>
</body>
</html>
