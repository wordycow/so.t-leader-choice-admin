<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠 AI 학습 매매 봇 v8.0 - PATTERN LEARNING</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1600px; margin: 0 auto; }
    
    .header {
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .header h1 {
      font-size: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    
    .strategies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .strategy-card {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    
    .strategy-card:hover {
      border-color: #667eea;
      transform: translateY(-2px);
    }
    
    .strategy-card.best {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.1);
    }
    
    .strategy-name {
      font-size: 18px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
    }
    
    .strategy-stats {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 14px;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-label {
      color: #a0a0a0;
      font-size: 12px;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: #00ff88;
    }
    
    .stat-value.negative { color: #ff4757; }
    
    .patterns-section {
      background: rgba(255,255,255,0.05);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 30px;
    }
    
    .pattern-item {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid #667eea;
    }
    
    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin: 5px;
    }
    
    .btn-start {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    
    .btn-stop {
      background: linear-gradient(135deg, #ff4757, #ff6348);
      color: white;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .status-badge {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-left: 10px;
    }
    
    .status-running {
      background: rgba(0, 255, 136, 0.2);
      color: #00ff88;
      border: 1px solid #00ff88;
    }
    
    .status-stopped {
      background: rgba(255, 71, 87, 0.2);
      color: #ff4757;
      border: 1px solid #ff4757;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧠 AI 학습 매매 봇 v8.0 - PATTERN LEARNING</h1>
      <p>패턴 학습 + 멀티 전략 경쟁 + 최적 전략 자동 선택</p>
      <p style="margin-top: 10px;">
        상태: <span id="statusText" class="status-badge status-stopped">대기 중...</span>
      </p>
      <div style="margin-top: 15px;">
        <button class="btn btn-start" onclick="startBot()">🚀 학습 시작</button>
        <button class="btn btn-stop" onclick="stopBot()">⏹️ 중지</button>
      </div>
    </div>

    <h2 style="margin-bottom: 15px; color: #667eea;">🏆 전략 경쟁 현황</h2>
    <div class="strategies-grid" id="strategiesGrid"></div>

    <div class="patterns-section">
      <h2 style="margin-bottom: 15px; color: #667eea;">📊 감지된 패턴</h2>
      <div id="patternsContainer">
        <p style="color: #a0a0a0;">패턴 스캔 대기 중...</p>
      </div>
    </div>

    <div class="patterns-section">
      <h2 style="margin-bottom: 15px; color: #667eea;">📈 전체 통계</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
        <div class="stat">
          <div class="stat-label">총 거래</div>
          <div class="stat-value" id="totalTrades">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">승률</div>
          <div class="stat-value" id="winRate">0%</div>
        </div>
        <div class="stat">
          <div class="stat-label">총 수익률</div>
          <div class="stat-value" id="totalProfit">0%</div>
        </div>
        <div class="stat">
          <div class="stat-label">최고 전략</div>
          <div class="stat-value" id="bestStrategy" style="font-size: 16px;">-</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let updateInterval = null;

    async function startBot() {
      try {
        const response = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'practice', seed: 1000000 })
        });
        const data = await response.json();
        alert(data.message);
        if (data.success) {
          startUpdating();
        }
      } catch (error) {
        alert('오류: ' + error.message);
      }
    }

    async function stopBot() {
      try {
        const response = await fetch('/api/stop', { method: 'POST' });
        const data = await response.json();
        alert(data.message);
        stopUpdating();
      } catch (error) {
        alert('오류: ' + error.message);
      }
    }

    function startUpdating() {
      if (updateInterval) clearInterval(updateInterval);
      updateStatus();
      updateInterval = setInterval(updateStatus, 3000);
    }

    function stopUpdating() {
      if (updateInterval) {
        clearInterval(updateInterval);
        updateInterval = null;
      }
    }

    async function updateStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();

        // 상태 표시
        const statusText = document.getElementById('statusText');
        if (data.running) {
          statusText.innerHTML = '<span class="spinner"></span> 학습 중...';
          statusText.className = 'status-badge status-running';
        } else {
          statusText.textContent = '⏸️ 대기 중...';
          statusText.className = 'status-badge status-stopped';
        }

        // 전략 카드 업데이트
        const strategiesGrid = document.getElementById('strategiesGrid');
        strategiesGrid.innerHTML = '';
        
        for (const [id, strategy] of Object.entries(data.strategies)) {
          const perf = strategy.performance;
          const winRate = perf.trades > 0 ? (perf.wins / perf.trades * 100) : 0;
          const avgProfit = perf.trades > 0 ? (perf.total_profit / perf.trades) : 0;
          
          const isBest = data.statistics.best_strategy === id;
          
          const card = document.createElement('div');
          card.className = 'strategy-card' + (isBest ? ' best' : '');
          card.innerHTML = `
            <div class="strategy-name">${isBest ? '🏆 ' : ''}${strategy.name}</div>
            <div style="color: #a0a0a0; font-size: 13px; margin-bottom: 10px;">${strategy.description}</div>
            <div class="strategy-stats">
              <div class="stat">
                <div class="stat-label">거래</div>
                <div class="stat-value">${perf.trades}</div>
              </div>
              <div class="stat">
                <div class="stat-label">승률</div>
                <div class="stat-value">${winRate.toFixed(1)}%</div>
              </div>
              <div class="stat">
                <div class="stat-label">평균수익</div>
                <div class="stat-value ${avgProfit >= 0 ? '' : 'negative'}">${avgProfit >= 0 ? '+' : ''}${avgProfit.toFixed(2)}%</div>
              </div>
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: #667eea;">
              가중치: ${strategy.weight.toFixed(2)}
            </div>
          `;
          strategiesGrid.appendChild(card);
        }

        // 패턴 표시
        const patternsContainer = document.getElementById('patternsContainer');
        if (Object.keys(data.patterns).length > 0) {
          patternsContainer.innerHTML = '';
          for (const [ticker, patterns] of Object.entries(data.patterns)) {
            const patternDiv = document.createElement('div');
            patternDiv.className = 'pattern-item';
            const patternNames = Object.values(patterns).map(p => p.type).join(', ');
            patternDiv.innerHTML = `<strong>${ticker}</strong>: ${patternNames}`;
            patternsContainer.appendChild(patternDiv);
          }
        }

        // 전체 통계
        document.getElementById('totalTrades').textContent = data.statistics.total_trades || 0;
        const winRate = data.statistics.total_trades > 0 
          ? (data.statistics.winning_trades / data.statistics.total_trades * 100) 
          : 0;
        document.getElementById('winRate').textContent = winRate.toFixed(1) + '%';
        document.getElementById('totalProfit').textContent = 
          (data.statistics.total_profit || 0).toFixed(2) + '%';
        document.getElementById('bestStrategy').textContent = 
          data.statistics.best_strategy 
          ? data.strategies[data.statistics.best_strategy].name 
          : '-';

      } catch (error) {
        console.error('Status update error:', error);
      }
    }

    // 초기 상태 업데이트
    updateStatus();
  </script>
</body>
</html>
