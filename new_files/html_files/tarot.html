<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>정통 타로 리딩 - THE UNIQUE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- ✨ THE UNIQUE LEGENDARY DESIGN SYSTEM v4.0 -->
  <link rel="stylesheet" href="css/the-unique-core.css">
  
  <!-- 🎯 HOVER VISIBILITY ENHANCEMENT v4.1 - 가독성 최우선 CSS 전용 -->
  <link rel="stylesheet" href="css/hover-visibility-enhanced.css">
  
  <style>
    :root {
      --bg-dark: #0a0515;
      --bg-purple: #1a0f2e;
      --purple: #9333ea;
      --purple-light: #c084fc;
      --purple-dark: #581c87;
      --gold: #fbbf24;
      --gold-light: #fde68a;
      --text-light: #f3f4f6;
      --text-muted: #d1d5db;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif KR', serif;
      background: 
        linear-gradient(135deg, 
          rgba(10,5,21,0.85) 0%, 
          rgba(26,15,46,0.80) 25%,
          rgba(88,28,135,0.75) 50%,
          rgba(147,51,234,0.70) 75%,
          rgba(192,132,252,0.65) 100%
        ),
        radial-gradient(circle at 20% 30%, rgba(251,191,36,0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(192,132,252,0.20) 0%, transparent 40%),
        url('img/tarot-background.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-light);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(251,191,36,0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(147,51,234,0.20) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(192,132,252,0.10) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 10s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 0.6; transform: scale(1); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    
    @keyframes slideInRight {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes slideOutRight {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(400px); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 0.8s ease;
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-size: 64px;
      font-weight: 900;
      background: linear-gradient(135deg, 
        #fbbf24 0%, 
        #fde68a 20%,
        #c084fc 40%, 
        #9333ea 60%,
        #c084fc 80%,
        #fbbf24 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
      text-shadow: 0 0 60px rgba(251,191,36,0.6);
      animation: titleShine 5s linear infinite, titleFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(251,191,36,0.4)) drop-shadow(0 0 40px rgba(147,51,234,0.3));
    }

    @keyframes titleShine {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @keyframes titleFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }

    .header-subtitle {
      font-size: 18px;
      color: var(--gold-light);
      letter-spacing: 0.3em;
      opacity: 0.9;
    }

    .main-card {
      background: 
        linear-gradient(135deg, 
          rgba(26,15,46,0.85) 0%, 
          rgba(10,5,21,0.90) 50%,
          rgba(26,15,46,0.85) 100%
        );
      border: 3px solid transparent;
      background-clip: padding-box;
      border-radius: 32px;
      padding: 50px 40px;
      position: relative;
      box-shadow: 
        0 30px 80px rgba(0,0,0,0.9),
        0 0 80px rgba(147,51,234,0.3),
        inset 0 1px 0 rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: fadeInUp 0.8s ease 0.2s both, cardFloat 6s ease-in-out infinite;
    }

    .main-card::before {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      background: linear-gradient(45deg, 
        #fbbf24 0%, 
        #c084fc 25%, 
        #9333ea 50%, 
        #c084fc 75%, 
        #fbbf24 100%
      );
      background-size: 200% 200%;
      border-radius: 32px;
      z-index: -1;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 0.1em;
    }

    .spread-selection {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .spread-card {
      background: linear-gradient(135deg, 
        rgba(147,51,234,0.15) 0%,
        rgba(192,132,252,0.10) 50%,
        rgba(251,191,36,0.08) 100%
      );
      border: 2px solid transparent;
      background-clip: padding-box;
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .spread-card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, 
        #9333ea 0%, 
        #c084fc 25%, 
        #fbbf24 50%, 
        #c084fc 75%, 
        #9333ea 100%
      );
      background-size: 300% 300%;
      border-radius: 20px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.4s ease;
      animation: borderFlow 4s ease infinite;
    }

    @keyframes borderFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .spread-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 
        0 20px 40px rgba(147,51,234,0.4),
        0 0 60px rgba(251,191,36,0.2),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .spread-card:hover::before {
      opacity: 1;
    }

    .spread-card.selected {
      border-color: var(--gold);
      background: linear-gradient(135deg, 
        rgba(251,191,36,0.25) 0%,
        rgba(147,51,234,0.15) 100%
      );
      transform: translateY(-4px) scale(1.02);
      box-shadow: 
        0 15px 50px rgba(251,191,36,0.5),
        0 0 80px rgba(251,191,36,0.3),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .spread-card.selected::before {
      opacity: 1;
      background: linear-gradient(45deg, 
        #fbbf24 0%, 
        #fde68a 50%, 
        #fbbf24 100%
      );
    }

    .spread-icon {
      width: 120px;
      height: 120px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, 
        rgba(147,51,234,0.2) 0%,
        rgba(88,28,135,0.3) 100%
      );
      box-shadow: 
        0 10px 30px rgba(147,51,234,0.3),
        inset 0 1px 0 rgba(255,255,255,0.1);
      transition: all 0.3s ease;
      overflow: hidden;
      position: relative;
    }

    .spread-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      filter: brightness(1.1) saturate(1.2);
      transition: all 0.3s ease;
    }

    .spread-card:hover .spread-icon img {
      transform: scale(1.1);
      filter: brightness(1.3) saturate(1.4);
    }

    @keyframes iconPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.9; }
    }

    .spread-name {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #fbbf24 0%, #fde68a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      filter: drop-shadow(0 2px 8px rgba(251,191,36,0.4));
    }

    .spread-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .question-input {
      margin: 30px 0;
    }

    .input-label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 12px;
      text-align: center;
    }

    .input-field {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: block;
      padding: 16px 20px;
      background: rgba(147,51,234,0.1);
      border: 2px solid rgba(147,51,234,0.3);
      border-radius: 12px;
      color: var(--text-light);
      font-size: 16px;
      font-family: 'Noto Serif KR', serif;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(251,191,36,0.2);
    }

    .btn-draw {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 30px auto;
      padding: 18px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
      border: 2px solid var(--gold);
      border-radius: 12px;
      color: white;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-draw:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(147,51,234,0.5);
    }

    .cards-deck {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
      margin: 40px 0;
      max-height: 400px;
      overflow-y: auto;
      padding: 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
    }

    .card-back {
      aspect-ratio: 2/3;
      background: linear-gradient(135deg, #4c1d95 0%, #6b21a8 100%);
      border: 2px solid var(--gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .card-back:hover {
      transform: scale(1.05) rotate(5deg);
      box-shadow: 0 8px 20px rgba(147,51,234,0.5);
    }

    .card-back.selected {
      background: linear-gradient(135deg, var(--gold) 0%, #f59e0b 100%);
      transform: scale(1.1);
    }

    .reading-result {
      display: none;
      animation: fadeIn 0.8s ease;
    }

    .reading-result.active {
      display: block;
    }

    .drawn-cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px 0;
      flex-wrap: wrap;
    }

    .drawn-card {
      width: 200px;
      background: linear-gradient(135deg, rgba(76,29,149,0.9) 0%, rgba(107,33,168,0.9) 100%);
      border: 3px solid var(--gold);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      animation: cardFlip 0.6s ease;
    }

    .card-position {
      font-size: 14px;
      color: var(--gold-light);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card-name {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .card-direction {
      font-size: 13px;
      color: var(--purple-light);
      margin-bottom: 16px;
    }

    .card-image {
      font-size: 60px;
      margin: 20px 0;
    }

    .interpretation-section {
      background: rgba(76,29,149,0.2);
      border: 2px solid rgba(147,51,234,0.3);
      border-radius: 16px;
      padding: 30px;
      margin: 30px 0;
    }

    .interp-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .interp-content {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-light);
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes cardFlip {
      0% {
        transform: rotateY(90deg);
        opacity: 0;
      }
      100% {
        transform: rotateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }

      .main-card {
        padding: 30px 20px;
      }

      .header-title {
        font-size: 36px;
      }

      .spread-selection {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .spread-icon {
        width: 100px;
        height: 100px;
      }

      .drawn-cards {
        flex-direction: column;
        align-items: center;
      }

      .drawn-card {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="header-title">TAROT READING</h1>
      <p class="header-subtitle">정통 78장 타로 리딩</p>
      
      <!-- UT 잔액 표시 -->
      <div class="ut-balance-display" style="margin-top: 20px; padding: 12px 24px; background: linear-gradient(135deg, rgba(147,51,234,0.15), rgba(147,51,234,0.25)); border: 2px solid rgba(192,132,252,0.5); border-radius: 50px; display: inline-block; animation: pulse 2s ease-in-out infinite;">
        <span style="color: #c084fc; font-size: 14px; font-weight: 600; letter-spacing: 0.05em;">🔮 보유 UT: </span>
        <span id="tarot-ut-balance" style="color: #fff; font-size: 18px; font-weight: 900; text-shadow: 0 0 10px rgba(147,51,234,0.8);">0</span>
        <span style="color: #c084fc; font-size: 14px; font-weight: 600;"> UT</span>
      </div>
      
      <!-- 타로 리딩 비용 안내 -->
      <div style="margin-top: 12px; color: #c084fc; font-size: 13px; opacity: 0.9;">
        🎴 타로 리딩 비용: <strong style="color: #fff;">800 UT</strong>
      </div>
    </div>

    <div class="main-card">
      <!-- 스프레드 선택 -->
      <div id="spreadSelection">
        <h2 class="section-title">타로 스프레드 선택</h2>
        
        <div class="spread-selection">
          <div class="spread-card" onclick="selectSpread('one')">
            <div class="spread-icon">
              <img src="img/tarot-spreads/one-card-spread.png" alt="원 카드" loading="lazy">
            </div>
            <div class="spread-name">원 카드</div>
            <div class="spread-desc">오늘의 운세, 간단한 질문</div>
          </div>

          <div class="spread-card" onclick="selectSpread('three')">
            <div class="spread-icon">
              <img src="img/tarot-spreads/three-card-spread.png" alt="쓰리 카드" loading="lazy">
            </div>
            <div class="spread-name">쓰리 카드</div>
            <div class="spread-desc">과거-현재-미래 흐름</div>
          </div>

          <div class="spread-card" onclick="selectSpread('love')">
            <div class="spread-icon">
              <img src="img/tarot-spreads/love-spread.png" alt="연애 스프레드" loading="lazy">
            </div>
            <div class="spread-name">연애 스프레드</div>
            <div class="spread-desc">연애운, 관계 분석</div>
          </div>

          <div class="spread-card" onclick="selectSpread('career')">
            <div class="spread-icon">
              <img src="img/tarot-spreads/career-spread.png" alt="직업 스프레드" loading="lazy">
            </div>
            <div class="spread-name">직업 스프레드</div>
            <div class="spread-desc">진로, 사업, 재물운</div>
          </div>
        </div>

        <div class="question-input">
          <label class="input-label">궁금한 점을 입력하세요 (선택사항)</label>
          <input type="text" class="input-field" id="question" placeholder="예: 올해 나의 연애운은?">
        </div>

        <button class="btn-draw" onclick="startReading()">카드 뽑기 시작</button>
      </div>

      <!-- 카드 선택 -->
      <div id="cardSelection" style="display:none;">
        <h2 class="section-title">마음이 이끄는 카드를 선택하세요</h2>
        <p style="text-align:center; color: var(--gold-light); margin-bottom: 20px;">
          총 <span id="needCards">1</span>장의 카드를 선택해주세요
        </p>
        
        <div class="cards-deck" id="cardsDeck"></div>

        <button class="btn-draw" onclick="showResult()">선택 완료</button>
      </div>

      <!-- 결과 화면 -->
      <div id="readingResult" class="reading-result">
        <h2 class="section-title" id="resultTitle"></h2>

        <div class="drawn-cards" id="drawnCards"></div>

        <div class="interpretation-section">
          <h3 class="interp-title">🔮 종합 해석</h3>
          <div class="interp-content" id="overallInterp"></div>
        </div>

        <div class="interpretation-section">
          <h3 class="interp-title">💡 조언</h3>
          <div class="interp-content" id="adviceInterp"></div>
        </div>

        <button class="btn-draw" onclick="resetReading()">다시 보기</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // 타로 카드 데이터베이스 (78장)
    // ============================================

    const TAROT_DECK = [
      // Major Arcana (메이저 아르카나) - 22장
      {
        id: 0,
        name: 'The Fool',
        nameKo: '광대',
        emoji: 'img/cards/tarot/major/00-fool.png',
        upright: {
          keyword: '새로운 시작, 순수함, 모험',
          meaning: '순수한 마음으로 새로운 여정을 시작할 때입니다. 두려움 없이 앞으로 나아가세요. 예상치 못한 기회가 찾아올 것입니다.',
          love: '새로운 만남이나 관계의 새로운 국면을 맞이할 것입니다. 순수한 마음으로 다가가세요.',
          career: '새로운 프로젝트나 직장이 시작될 수 있습니다. 도전을 두려워하지 마세요.'
        },
        reversed: {
          keyword: '무모함, 경솔함, 준비 부족',
          meaning: '성급한 결정이나 무계획적인 행동을 조심하세요. 좀 더 신중하게 준비하는 시간이 필요합니다.',
          love: '관계에서 지나치게 이상적인 기대를 하고 있을 수 있습니다. 현실을 직시하세요.',
          career: '준비 없이 일을 시작하면 실패할 수 있습니다. 계획을 다시 점검하세요.'
        }
      },
      {
        id: 1,
        name: 'The Magician',
        nameKo: '마법사',
        emoji: 'img/cards/tarot/major/01-magician.png',

    // ============================================
    // 타로 리딩 시스템
    // ============================================

    let selectedSpread = null;
    let selectedCards = [];
    let shuffledDeck = [];

    function selectSpread(spreadType) {
      // 모든 스프레드 카드에서 selected 클래스 제거
      document.querySelectorAll('.spread-card').forEach(card => {
        card.classList.remove('selected');
      });
      
      // 클릭한 카드에 selected 클래스 추가
      event.currentTarget.classList.add('selected');
      
      selectedSpread = spreadType;
    }

    function startReading() {
      if (!selectedSpread) {
        alert('타로 스프레드를 먼저 선택해주세요.');
        return;
      }
      
      // UT 차감 로직
      const TAROT_COST = 800; // 타로 리딩 비용
      const currentUT = parseInt(localStorage.getItem('ut_balance') || '0');
      
      // UT 잔액 확인
      if (currentUT < TAROT_COST) {
        alert(`❌ UT가 부족합니다!\n\n필요: ${TAROT_COST} UT\n보유: ${currentUT} UT\n부족: ${TAROT_COST - currentUT} UT\n\nUT를 충전해주세요.`);
        return;
      }
      
      // UT 차감 애니메이션
      const balanceEl = document.getElementById('tarot-ut-balance');
      const oldBalance = currentUT;
      const newBalance = currentUT - TAROT_COST;
      
      // UT 차감
      localStorage.setItem('ut_balance', newBalance.toString());
      
      // 애니메이션으로 표시
      balanceEl.style.transition = 'all 0.5s ease';
      balanceEl.style.transform = 'scale(1.3)';
      balanceEl.style.color = '#ff6b6b';
      
      setTimeout(() => {
        balanceEl.textContent = newBalance;
        balanceEl.style.transform = 'scale(1)';
        balanceEl.style.color = '#fff';
      }, 300);
      
      // 차감 알림
      const notification = document.createElement('div');
      notification.style.cssText = `
        position: fixed; top: 100px; right: 20px; z-index: 10000;
        padding: 16px 24px; background: linear-gradient(135deg, #9333ea, #6b21a8);
        border: 2px solid rgba(192,132,252,0.5); border-radius: 12px;
        color: #fff; font-size: 16px; font-weight: 700;
        box-shadow: 0 8px 24px rgba(147,51,234,0.5);
        animation: slideInRight 0.5s ease;
      `;
      notification.innerHTML = `🔮 ${TAROT_COST} UT 차감<br><small style="font-size:13px; opacity:0.9;">잔액: ${newBalance} UT</small>`;
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'slideOutRight 0.5s ease';
        setTimeout(() => notification.remove(), 500);
      }, 3000);

      // 덱 섞기
      shuffledDeck = [...TAROT_DECK].sort(() => Math.random() - 0.5);
      
      // 필요한 카드 수 설정
      let needCards = 1;
      if (selectedSpread === 'three') needCards = 3;
      else if (selectedSpread === 'love' || selectedSpread === 'career') needCards = 4;

      document.getElementById('needCards').textContent = needCards;

      // 카드 덱 생성
      const deckContainer = document.getElementById('cardsDeck');
      deckContainer.innerHTML = '';
      
      for (let i = 0; i < 30; i++) {
        const cardBack = document.createElement('div');
        cardBack.className = 'card-back';
        cardBack.textContent = '🎴';
        cardBack.onclick = function() {
          if (selectedCards.length < needCards && !this.classList.contains('selected')) {
            this.classList.add('selected');
            selectedCards.push(i);
          } else if (this.classList.contains('selected')) {
            this.classList.remove('selected');
            selectedCards = selectedCards.filter(idx => idx !== i);
          }
        };
        deckContainer.appendChild(cardBack);
      }

      // 화면 전환
      document.getElementById('spreadSelection').style.display = 'none';
      document.getElementById('cardSelection').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function showResult() {
      const needCards = selectedSpread === 'one' ? 1 : 
                       selectedSpread === 'three' ? 3 : 4;

      if (selectedCards.length !== needCards) {
        alert(`${needCards}장의 카드를 선택해주세요.`);
        return;
      }

      // 선택한 카드 가져오기
      const drawnCards = selectedCards.map(idx => {
        const card = shuffledDeck[idx % TAROT_DECK.length];
        const isReversed = Math.random() > 0.5;
        return { ...card, isReversed };
      });

      // 결과 표시
      displayResult(drawnCards);

      // 화면 전환
      document.getElementById('cardSelection').style.display = 'none';
      document.getElementById('readingResult').classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function displayResult(cards) {
      const question = document.getElementById('question').value || '운세';
      
      // 제목 설정
      const spreadNames = {
        'one': '원 카드 리딩',
        'three': '쓰리 카드 스프레드',
        'love': '연애 운세',
        'career': '직업·재물 운세'
      };
      document.getElementById('resultTitle').textContent = spreadNames[selectedSpread];

      // 카드 표시
      const container = document.getElementById('drawnCards');
      container.innerHTML = '';

      const positions = {
        'one': ['현재 상황'],
        'three': ['과거', '현재', '미래'],
        'love': ['나의 마음', '상대의 마음', '관계의 흐름', '조언'],
        'career': ['현재 상황', '장애물', '강점', '결과']
      };

      const positionLabels = positions[selectedSpread];

      cards.forEach((card, idx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'drawn-card';
        
        const interpretation = card.isReversed ? card.reversed : card.upright;
        
        cardDiv.innerHTML = `
          <div class="card-position">${positionLabels[idx]}</div>
          <div class="card-name">${card.nameKo}</div>
          <div class="card-direction">${card.isReversed ? '역방향 ↓' : '정방향 ↑'}</div>
          <div class="card-image">
            <img src="${card.emoji}" alt="${card.nameKo}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px; box-shadow: 0 8px 32px rgba(251,191,36,0.3);">
          </div>
          <div style="font-size: 13px; color: var(--gold-light); margin-top: 12px;">
            ${interpretation.keyword}
          </div>
        `;
        
        container.appendChild(cardDiv);
      });

      // 종합 해석
      generateOverallInterpretation(cards);

      // 조언
      generateAdvice(cards);
      
      // ⚡ AI 분석 버튼 추가
      setTimeout(initAIAnalysisButton, 100);
    }

    function generateOverallInterpretation(cards) {
      const context = selectedSpread === 'love' ? 'love' : 
                     selectedSpread === 'career' ? 'career' : 'meaning';
      
      let interpretation = '';

      cards.forEach((card, idx) => {
        const meaning = card.isReversed ? card.reversed : card.upright;
        const contextText = meaning[context] || meaning.meaning;
        
        if (selectedSpread === 'three') {
          const labels = ['과거에는', '현재', '미래에는'];
          interpretation += `<p style="margin-bottom: 16px;"><strong>${labels[idx]}:</strong> ${contextText}</p>`;
        } else if (selectedSpread === 'one') {
          interpretation = `<p>${contextText}</p>`;
        } else {
          interpretation += `<p style="margin-bottom: 16px;">${contextText}</p>`;
        }
      });

      document.getElementById('overallInterp').innerHTML = interpretation;
    }

    function generateAdvice(cards) {
      const uprightCount = cards.filter(c => !c.isReversed).length;
      const reversedCount = cards.length - uprightCount;

      let advice = '';

      if (uprightCount >= cards.length * 0.7) {
        advice = '대체로 긍정적인 흐름입니다. 현재의 방향을 유지하며 자신감을 가지고 나아가세요. 타로는 당신의 노력이 좋은 결과를 가져올 것임을 말하고 있습니다.';
      } else if (reversedCount >= cards.length * 0.7) {
        advice = '도전적인 시기입니다. 하지만 이는 성장의 기회이기도 합니다. 현재 상황을 재평가하고, 필요하다면 접근 방식을 바꿔보세요. 인내심을 가지고 한 걸음씩 나아가면 극복할 수 있습니다.';
      } else {
        advice = '빛과 그림자가 공존하는 시기입니다. 긍정적인 면을 키우고 부정적인 면은 개선하려는 노력이 필요합니다. 균형잡힌 시각으로 상황을 바라보세요.';
      }

      // 카드별 특별 조언
      const hasDeathOrTower = cards.some(c => ['Death', 'The Tower'].includes(c.name));
      if (hasDeathOrTower) {
        advice += ' 큰 변화의 시기이지만, 이는 더 나은 미래를 위한 필수적인 과정입니다. 변화를 두려워하지 마세요.';
      }

      const hasSunOrWorld = cards.some(c => ['The Sun', 'The World'].includes(c.name));
      if (hasSunOrWorld) {
        advice += ' 성공과 완성의 에너지가 함께합니다. 지금이 목표를 향해 전진할 최적의 시기입니다.';
      }

      document.getElementById('adviceInterp').textContent = advice;
    }

    function resetReading() {
      selectedSpread = null;
      selectedCards = [];
      shuffledDeck = [];
      
      document.getElementById('question').value = '';
      document.querySelectorAll('.spread-card').forEach(card => {
        card.classList.remove('selected');
      });
      
      document.getElementById('spreadSelection').style.display = 'block';
      document.getElementById('cardSelection').style.display = 'none';
      document.getElementById('readingResult').classList.remove('active');
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    // ========================================
    // 🤖 AI 분석 시스템
    // ========================================
    
    function initAIAnalysisButton() {
      // 기존 버튼 제거
      const existing = document.getElementById('ai-analysis-btn');
      if (existing) existing.remove();
      
      const existingPanel = document.getElementById('ai-analysis-panel');
      if (existingPanel) existingPanel.remove();
      
      // AI 분석 버튼 생성
      const adviceSection = document.getElementById('adviceInterp').parentElement;
      const aiButton = document.createElement('button');
      aiButton.id = 'ai-analysis-btn';
      aiButton.innerHTML = '🤖 AI 딥 분석 시작';
      aiButton.style.cssText = `
        width: 100%; max-width: 400px; margin: 20px auto; display: block;
        padding: 16px 24px; font-size: 18px; font-weight: 700;
        background: linear-gradient(135deg, #a855f7, #ec4899);
        border: none; border-radius: 999px; color: #fff;
        cursor: pointer; box-shadow: 0 10px 30px rgba(168,85,247,0.5);
        transition: all 0.3s ease;
      `;
      aiButton.onmouseover = () => aiButton.style.transform = 'translateY(-2px)';
      aiButton.onmouseout = () => aiButton.style.transform = 'translateY(0)';
      aiButton.onclick = performAIAnalysis;
      
      adviceSection.parentElement.appendChild(aiButton);
      
      // AI 분석 결과 패널 생성
      const aiPanel = document.createElement('div');
      aiPanel.id = 'ai-analysis-panel';
      aiPanel.style.cssText = `
        display: none; margin-top: 24px; padding: 24px;
        background: linear-gradient(135deg, rgba(88,28,135,0.15), rgba(15,23,42,0.95));
        border-radius: 20px; border: 1px solid rgba(168,85,247,0.4);
        box-shadow: 0 0 30px rgba(168,85,247,0.3);
      `;
      aiPanel.innerHTML = `
        <h3 style="color:#a855f7; font-size:22px; margin-bottom:16px; text-align:center;">
          🔮 AI 딥 분석 결과
        </h3>
        
        <div id="energy-analysis" style="margin-bottom:20px; padding:16px; background:rgba(15,23,42,0.8); border-radius:12px;">
          <h4 style="color:#fbbf24; font-size:16px; margin-bottom:10px;">⚡ 에너지 분석</h4>
          <div id="energy-content" style="color:#e5e7eb; line-height:1.6;"></div>
        </div>
        
        <div id="timeline-analysis" style="display:none; margin-bottom:20px; padding:16px; background:rgba(15,23,42,0.8); border-radius:12px;">
          <h4 style="color:#fbbf24; font-size:16px; margin-bottom:10px;">⏰ 과거-현재-미래 분석</h4>
          <div id="timeline-content" style="color:#e5e7eb; line-height:1.6;"></div>
        </div>
        
        <div id="deep-insight" style="margin-bottom:20px; padding:16px; background:rgba(88,28,135,0.25); border-radius:12px; border:1px solid rgba(168,85,247,0.3);">
          <h4 style="color:#c084fc; font-size:16px; margin-bottom:10px;">💎 심층 통찰</h4>
          <div id="insight-content" style="color:#e5e7eb; line-height:1.7; font-size:15px;"></div>
        </div>
        
        <div id="action-steps" style="margin-bottom:20px; padding:16px; background:rgba(15,23,42,0.8); border-radius:12px;">
          <h4 style="color:#fbbf24; font-size:16px; margin-bottom:10px;">🎯 실천 가이드</h4>
          <ul id="action-list" style="color:#e5e7eb; line-height:1.8; padding-left:24px;"></ul>
        </div>
        
        <div id="affirmation" style="padding:20px; background:linear-gradient(135deg, rgba(168,85,247,0.2), rgba(236,72,153,0.2)); border-radius:12px; text-align:center; border:2px solid rgba(168,85,247,0.4);">
          <h4 style="color:#e879f9; font-size:16px; margin-bottom:12px;">✨ 오늘의 확언</h4>
          <div id="affirmation-text" style="color:#fce7f3; font-size:17px; font-weight:600; line-height:1.6; font-style:italic;"></div>
        </div>
      `;
      
      adviceSection.parentElement.appendChild(aiPanel);
    }
    
    function performAIAnalysis() {
      if (!selectedCards || selectedCards.length === 0) {
        alert('먼저 카드를 뽑아주세요!');
        return;
      }
      
      // AI 엔진 실행
      const aiResult = TAROT_AI_ENGINE.generateAIReading(selectedCards, selectedSpread);
      
      // 결과 표시
      const panel = document.getElementById('ai-analysis-panel');
      panel.style.display = 'block';
      
      // 에너지 분석
      const energyDiv = document.getElementById('energy-content');
      energyDiv.innerHTML = `
        <p><strong>지배 에너지:</strong> ${translateSuit(aiResult.combination.dominantEnergy)}</p>
        <p><strong>종합 레벨:</strong> ${translateLevel(aiResult.combination.synthesisLevel)}</p>
        <div style="margin-top:10px; padding:10px; background:rgba(251,191,36,0.1); border-radius:8px;">
          <small>에너지 분포: ${Object.entries(aiResult.combination.energyScore).map(([k,v]) => `${translateSuit(k)}(${v})`).join(' | ')}</small>
        </div>
      `;
      
      // 시간대 분석 (3장일 때만)
      if (aiResult.timeline) {
        const timelineDiv = document.getElementById('timeline-analysis');
        const timelineContent = document.getElementById('timeline-content');
        timelineDiv.style.display = 'block';
        timelineContent.innerHTML = `
          <div style="margin-bottom:12px;">
            <strong style="color:#fbbf24;">📜 과거:</strong> ${aiResult.timeline.past.lesson}
          </div>
          <div style="margin-bottom:12px;">
            <strong style="color:#fbbf24;">⚡ 현재:</strong> 도전 - ${aiResult.timeline.present.challenge}<br>
            <span style="margin-left:20px;">기회 - ${aiResult.timeline.present.opportunity}</span>
          </div>
          <div style="margin-bottom:12px;">
            <strong style="color:#fbbf24;">🌟 미래:</strong> ${aiResult.timeline.future.potential}<br>
            <span style="margin-left:20px;">조언 - ${aiResult.timeline.future.advice}</span>
          </div>
          <div style="margin-top:16px; padding:12px; background:rgba(168,85,247,0.2); border-radius:8px;">
            <strong>전체 흐름:</strong> ${aiResult.timeline.overallFlow}
          </div>
        `;
      }
      
      // 심층 통찰
      document.getElementById('insight-content').textContent = aiResult.deepInsight;
      
      // 액션 스텝
      const actionList = document.getElementById('action-list');
      actionList.innerHTML = aiResult.actionSteps.map(step => `<li>${step}</li>`).join('');
      
      // 긍정 확언
      document.getElementById('affirmation-text').textContent = aiResult.affirmation;
      
      // 스크롤
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    
    function translateSuit(suit) {
      const names = {
        major: '메이저 아르카나', cups: '컵(감정)', swords: '소드(정신)',
        pentacles: '펜타클(물질)', wands: '완드(창조)', emotional: '감정',
        mental: '정신', material: '물질', creative: '창조', universal: '우주'
      };
      return names[suit] || suit;
    }
    
    function translateLevel(level) {
      const levels = {
        highly_positive: '매우 긍정 ⭐⭐⭐⭐⭐',
        positive: '긍정 ⭐⭐⭐⭐',
        balanced: '균형 ⚖️',
        challenging: '도전 💪',
        transformative: '변화 🔥'
      };
      return levels[level] || level;
    }
    
    // ============================================
    // UT 잔액 초기화 및 업데이트
    // ============================================
    function updateUTDisplay() {
      const balance = parseInt(localStorage.getItem('ut_balance') || '0');
      const balanceEl = document.getElementById('tarot-ut-balance');
      if (balanceEl) {
        balanceEl.textContent = balance;
      }
    }
    
    // 페이지 로드 시 UT 잔액 표시
    window.addEventListener('DOMContentLoaded', updateUTDisplay);
    
    // 다른 탭에서 UT 변경 시 업데이트
    window.addEventListener('storage', function(e) {
      if (e.key === 'ut_balance') {
        updateUTDisplay();
      }
    });
  </script>
  
  <!-- AI 엔진 로드 -->
  <script src="tarot-ai-enhancement.js"></script>
