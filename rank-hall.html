<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>so.t 직급의 전당</title>

  <!-- 디스코드 / 카톡 링크 썸네일용 (rank-hall.html) -->

  <!-- 선택: 트위터 카드 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="so.t 직급의 전당">
  <meta name="twitter:description" content="so.t에서 직급을 달성한 리더들의 명예의 전당입니다.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #0a0e27 url('img/rank-background.png') center/cover no-repeat fixed;
      color: #e5e7eb;
      min-height: 100vh;
      /* 우주 배경 + 살짝 어두운 그라디언트 */
      background-image:
        url("img/bg-stars.jpg"),
        radial-gradient(circle at top, rgba(15,23,42,0.25) 0, rgba(15,23,42,0.9) 65%, #020617 100%);
      background-size: cover, cover;
      background-position: center top, center top;
      background-attachment: fixed, fixed;
      animation: bg-pan 60s linear infinite alternate;
    }

    @keyframes bg-pan {
      0% { background-position: center top, center top; }
      100% { background-position: center 20%, center top; }
    }

    .page-wrap {
      max-width: 1100px;
      margin: 24px auto 40px;
      padding: 0 12px 32px;
      width: 100%;
    }

    header { margin-bottom: 16px; }

    h1 { font-size: 26px; margin: 0 0 6px; }

    .sub {
      font-size: 13px;
      color: #cbd5f5;
      margin: 0 0 10px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }

    .filter-row select {
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.8);
      background: #0a0e27 url('img/rank-background.png') center/cover no-repeat fixed;
      color: #e5e7eb;
      font-size: 12px;
    }

    main { margin-top: 10px; }

    .rank-section { margin-bottom: 28px; }

    .rank-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .rank-title h2 { margin: 0; font-size: 18px; }

    .rank-title span.label {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(191,219,254,0.9);
      background: #0a0e27 url('img/rank-background.png') center/cover no-repeat fixed;
      color: #e5e7eb;
    }

    /* 🔸 직급 조건 + 수당 설명 영역 */
    .rank-meta {
      margin: 2px 0 10px;
      padding-left: 2px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .rank-condition {
      font-size: 11px;
      color: #cbd5f5;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .rank-pay {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
    }

    .rank-pay-label {
      font-size: 12px;
      font-weight: 600;
      color: #fef3c7;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .rank-pay-amount {
      font-size: 26px;
      font-weight: 900;
      color: #ffd54a;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 6px rgba(0,0,0,1);
    }

    .rank-pay-tail {
      font-size: 12px;
      color: #fef9c3;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .rank-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* 기본 카드 스타일 (배경 완전 투명) */
    .card {
      background: #0a0e27 url('img/rank-background.png') center/cover no-repeat fixed;
      border-radius: 18px;
      overflow: visible;
      width: 210px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      transform: translateY(8px);
      opacity: 0;
      animation: fadeUp 0.4s forwards;
      backdrop-filter: none;
    }

    /* 직급별 카드 폭 (Member 가장 작고 Pro10 가장 크게) */
    .card.xxs   { width: 100px; }  /* Member */
    .card.xs    { width: 145px; }  /* Star1 */
    .card.sm    { width: 175px; }  /* Star2 */
    .card.md    { width: 195px; }  /* Star3 */
    .card.lg    { width: 220px; }  /* Pro1~3 */
    .card.xl    { width: 245px; }  /* Pro4~6 */
    .card.xxl   { width: 275px; }  /* Pro7~9 */
    .card.xxxl  { width: 300px; }  /* Pro10 */

    .card-image-wrap {
      position: relative;
      padding: 10px 10px 0;
      display: flex;
      justify-content: center;
      background: #0a0e27 url('img/rank-background.png') center/cover no-repeat fixed;
    }

    .card-image-wrap img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 14px 14px 8px 8px;
    }

    .card-body {
      padding: 8px 10px 10px;
      text-align: center;
      background: #0a0e27 url('img/rank-background.png') center/cover no-repeat fixed;
    }

    .card-name {
      font-size: 18px;
      font-weight: 700;
      color: #facc15;
      letter-spacing: 0.02em;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card.xxs   .card-name { font-size: 10px; }  /* Member */
    .card.xs    .card-name { font-size: 14px; }  /* Star1 */
    .card.sm    .card-name { font-size: 16px; }  /* Star2 */
    .card.md    .card-name { font-size: 18px; }  /* Star3 */
    .card.lg    .card-name { font-size: 19px; }  /* Pro1~3 */
    .card.xl    .card-name { font-size: 20px; }  /* Pro4~6 */
    .card.xxl   .card-name { font-size: 21px; }  /* Pro7~9 */
    .card.xxxl  .card-name { font-size: 22px; }  /* Pro10 */

    .card-name-sub {
      font-size: 12px;
      color: #e5e7eb;
      opacity: 0.9;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-bottom {
      font-size: 11px;
      color: #fef3c7;
      opacity: 0.95;
    }

    .card-name,
    .card-name-sub,
    .card-bottom {
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .card:hover {
      transform: translateY(0);
      box-shadow: 0 20px 55px rgba(0,0,0,0.95);
      transition: transform 0.18s ease-out, box-shadow 0.18s ease-out;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .card,
      .card.xxs,
      .card.xs,
      .card.sm,
      .card.md,
      .card.lg,
      .card.xl,
      .card.xxl,
      .card.xxxl {
        width: calc(50% - 8px);
      }
      .rank-pay-amount { font-size: 22px; }
    }

    @media (max-width: 480px) {
      .card,
      .card.xxs,
      .card.xs,
      .card.sm,
      .card.md,
      .card.lg,
      .card.xl,
      .card.xxl,
      .card.xxxl {
        width: 100%;
      }
      .rank-pay-amount { font-size: 20px; }
    }

    .empty-text {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 24px;
    }
  </style>

  
  
  


  <!-- Medieval Magic Theme (골드 + 딥블루) -->

</head>
<body>
  <div class="page-wrap">
    <header>
      <h1>so.t 직급의 전당</h1>
      <p class="sub">
        ✅ rank-hall.json이 <b>members 구조</b>든 <b>배열 구조</b>든 자동으로 읽습니다. (노출(visible)만 표시)
      </p>
      <div class="filter-row">
        <span>필터:</span>
        <select id="rank-filter">
          <option value="all">전체 직급</option>
          <option value="Star">Star 계열만</option>
          <option value="Pro">Pro 계열만</option>
        </select>
      </div>
    </header>

    <main id="rank-main">
      <p id="empty" class="empty-text" style="display:none;">
        아직 표시할 직급자가 없습니다. 관리자 페이지에서 rank-hall.json을 먼저 채워 주세요.
      </p>
    </main>
  </div>

  <script>
    // Member까지 포함한 직급 정렬 순서 (위에서 아래)
    const RANK_ORDER = [
      "Pro10","Pro9","Pro8","Pro7","Pro6","Pro5","Pro4","Pro3","Pro2","Pro1",
      "Star3","Star2","Star1","Member"
    ];

    // 🔸 직급 조건 + 수당(하루 금액) 정의
    const RANK_INFO = {
      Member: { condition: "구독 중 (직급 미달성)", payAmount: "$0", payTail: "" },
      Star1: { condition: "직급 달성 조건: 좌·우 직접추천 2:1 또는 1:2 (최소 1:1 충족)", payAmount: "$10",  payTail: "USDT / day x 60 day" },
      Star2: { condition: "직급 달성 조건: 좌·우 팀 7:7",  payAmount: "$20",  payTail: "USDT / day x 60 day" },
      Star3: { condition: "직급 달성 조건: 좌·우 팀 15:15", payAmount: "$45",  payTail: "USDT / day x 60 day" },
      Pro1:  { condition: "직급 달성 조건: 좌·우 팀 40:40",  payAmount: "$120", payTail: "USDT / day x 60 day" },
      Pro2:  { condition: "직급 달성 조건: 좌·우 팀 80:80",  payAmount: "$200", payTail: "USDT / day x 60 day" },
      Pro3:  { condition: "직급 달성 조건: 좌·우 팀 150:150", payAmount: "$300", payTail: "USDT / day x 60 day" },
      Pro4:  { condition: "직급 달성 조건: 좌·우 팀 250:250", payAmount: "$500", payTail: "USDT / day x 60 day" },
      Pro5:  { condition: "직급 달성 조건: 좌·우 팀 400:400", payAmount: "$800", payTail: "USDT / day x 60 day" },
      Pro6:  { condition: "직급 달성 조건: 좌·우 팀 650:650", payAmount: "$1,300", payTail: "USDT / day x 60 day" },
      Pro7:  { condition: "직급 달성 조건: 좌·우 팀 1000:1000", payAmount: "$2,000", payTail: "USDT / day x 60 day" },
      Pro8:  { condition: "직급 달성 조건: 좌·우 팀 2000:2000", payAmount: "$3,000", payTail: "USDT / day x 60 day" },
      Pro9:  { condition: "직급 달성 조건: 좌·우 팀 3000:3000", payAmount: "$4,000", payTail: "USDT / day x 60 day" },
      Pro10: { condition: "직급 달성 조건: 좌·우 팀 4000:4000", payAmount: "$5,000", payTail: "USDT / day x 60 day" }
    };

    function getRankIndex(rank) {
      const i = RANK_ORDER.indexOf(rank);
      return i === -1 ? 999 : i;
    }

    function rankLabel(rank) {
      if (!rank) return "";
      if (rank === "Member") return "Member";
      if (rank.startsWith("Star")) return `스타 ${rank.replace("Star", "")}`;
      if (rank.startsWith("Pro"))  return `Pro ${rank.replace("Pro", "")}`;
      return rank;
    }

    function sectionTitle(rank) {
      if (rank === "Member") return "MEMBER";
      if (rank.startsWith("Star")) return `STAR ${rank.replace("Star","")}`;
      if (rank.startsWith("Pro"))  return `PRO ${rank.replace("Pro","")}`;
      return rank;
    }

    function getImageForRank(rank) {
      if (!rank) return "img/member.png";
      if (rank === "Member") return "img/member.png";
      if (rank.startsWith("Star")) return `img/star${rank.replace("Star","")}.png`;
      if (rank.startsWith("Pro"))  return `img/pro${rank.replace("Pro","")}.png`;
      return "img/member.png";
    }

    function getCardSizeClass(rank) {
      if (!rank || rank === "Member") return "xxs";
      if (rank.startsWith("Star")) {
        const n = parseInt(rank.replace("Star", ""), 10) || 1;
        if (n === 1) return "xs";
        if (n === 2) return "sm";
        return "md";
      }
      if (rank.startsWith("Pro")) {
        const n = parseInt(rank.replace("Pro", ""), 10) || 1;
        if (n <= 3) return "lg";
        if (n <= 6) return "xl";
        if (n <= 9) return "xxl";
        return "xxxl";
      }
      return "md";
    }

    function passesFilter(rank, filterValue) {
      if (filterValue === "all") return true;
      if (filterValue === "Star") return rank.startsWith("Star");
      if (filterValue === "Pro")  return rank.startsWith("Pro");
      return true;
    }

    // ✅ members/items/배열 전부 호환
    function extractArray(json) {
      if (Array.isArray(json)) return json;
      if (json && Array.isArray(json.members)) return json.members;
      if (json && Array.isArray(json.items)) return json.items;
      return [];
    }

    // ✅ STAR1/PRO2/MEMBER 같은 대문자도 Star1/Pro2/Member로 정규화
    function romanToInt(roman){
      if (!roman) return NaN;
      const s = roman.toUpperCase();
      const map = {I:1, V:5, X:10, L:50, C:100, D:500, M:1000};
      let total = 0;
      for (let i=0; i<s.length; i++){
        const v = map[s[i]] || 0;
        const next = map[s[i+1]] || 0;
        total += (v < next) ? -v : v;
      }
      return total;
    }

    function normalizeRank(raw){
      let t = (raw || "").toString().trim();
      if (!t) return "Member";

      const uMap = {"Ⅰ":"I","Ⅱ":"II","Ⅲ":"III","Ⅳ":"IV","Ⅴ":"V","Ⅵ":"VI","Ⅶ":"VII","Ⅷ":"VIII","Ⅸ":"IX","Ⅹ":"X"};
      t = t.replace(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]/g, ch => uMap[ch] || ch);

      const compact = t.replace(/\s+/g, "");
      const upper = compact.toUpperCase();

      if (upper === "MEMBER" || upper === "MEM" || upper === "멤버" || upper === "회원" || upper === "일반") return "Member";
      if (upper === "STAFF" || upper === "스태프") return "Member"; // 이 페이지에 STAFF 섹션 없어서 안전하게 Member로 처리

      function toNum(rest){
        if (!rest) return "";
        if (/^\d+$/.test(rest)) return rest;
        const n = romanToInt(rest);
        if (Number.isFinite(n) && n > 0) return String(n);
        return rest;
      }

      // STAR1 / PRO2
      if (upper.startsWith("STAR")) return "Star" + toNum(upper.slice(4).replace(/^[-_]+/, ""));
      if (upper.startsWith("PRO"))  return "Pro"  + toNum(upper.slice(3).replace(/^[-_]+/, ""));

      // 이미 Star1/Pro2 형태
      if (compact.toLowerCase().startsWith("star")) return "Star" + toNum(compact.slice(4));
      if (compact.toLowerCase().startsWith("pro"))  return "Pro"  + toNum(compact.slice(3));

      return "Member";
    }

    function mapItem(x){
      const rank = normalizeRank(x.rank || x.level || x.title || "");
      const name = (x.name || "").toString();
      const note = (x.note || x.tagline || x.memo || x.tagline || "").toString();
      const visible = (x.visible !== false);
      const order = Number.isFinite(+x.order) ? +x.order : 0;
      const joinDate = (x.joinDate || "").toString(); // 없으면 빈값(표시 안 됨)

      return { name, rank, note, visible, order, joinDate };
    }

    async function loadData() {
      try {
        const res = await fetch("rank-hall.json?v=" + Date.now(), { cache: "no-store" });
        const json = res.ok ? await res.json() : [];
        const rawArr = extractArray(json);

        const rankData = rawArr.map(mapItem);

        renderAllSections(rankData, document.getElementById("rank-filter").value);

        document.getElementById("rank-filter").addEventListener("change", (e) => {
          renderAllSections(rankData, e.target.value);
        });
      } catch (err) {
        console.error(err);
        const empty = document.getElementById("empty");
        empty.style.display = "block";
        empty.textContent = "데이터를 불러오는 중 오류가 발생했습니다.";
      }
    }

    function renderAllSections(rankData, filterValue) {
      const main = document.getElementById("rank-main");
      const empty = document.getElementById("empty");
      main.innerHTML = "";
      main.appendChild(empty);

      // ✅ visible만 표시 + rank 없으면 Member로 이미 보정됨
      const valid = rankData.filter(item => item.visible !== false);

      if (!valid.length) {
        empty.style.display = "block";
        empty.textContent = "아직 표시할 직급자가 없습니다. 관리자 페이지에서 rank-hall.json을 먼저 채워 주세요.";
        return;
      }

      const filtered = valid.filter(item => passesFilter(item.rank, filterValue));
      if (!filtered.length) {
        empty.style.display = "block";
        empty.textContent = "선택한 필터에 해당하는 직급자가 없습니다.";
        return;
      }
      empty.style.display = "none";

      // rank별 그룹핑
      const grouped = {};
      for (const item of filtered) {
        if (!grouped[item.rank]) grouped[item.rank] = [];
        grouped[item.rank].push(item);
      }

      // ✅ 각 rank 내 정렬: order 있으면 order 오름차순, 없으면 joinDate
      Object.keys(grouped).forEach(rank => {
        grouped[rank].sort((a,b) => {
          const ao = Number.isFinite(+a.order) ? +a.order : 999999;
          const bo = Number.isFinite(+b.order) ? +b.order : 999999;
          if (ao !== bo) return ao - bo;

          // fallback
          if (!a.joinDate && !b.joinDate) return 0;
          if (!a.joinDate) return 1;
          if (!b.joinDate) return -1;
          return a.joinDate.localeCompare(b.joinDate);
        });
      });

      // rank 섹션 출력 순서
      RANK_ORDER.forEach(rank => {
        const list = grouped[rank];
        if (!list || !list.length) return;

        const section = document.createElement("section");
        section.className = "rank-section";

        const titleRow = document.createElement("div");
        titleRow.className = "rank-title";
        titleRow.innerHTML = `
          <h2>${sectionTitle(rank)}</h2>
          <span class="label">${rankLabel(rank)} 직급 • ${list.length}명</span>
        `;
        section.appendChild(titleRow);

        const info = RANK_INFO[rank];
        if (info) {
          const meta = document.createElement("div");
          meta.className = "rank-meta";
          meta.innerHTML = `
            <div class="rank-condition">${info.condition}</div>
            ${info.payAmount ? `
              <div class="rank-pay">
                <span class="rank-pay-label">지급 구독 수수료</span>
                <span class="rank-pay-amount">${info.payAmount}</span>
                <span class="rank-pay-tail">${info.payTail}</span>
              </div>` : ""}
          `;
          section.appendChild(meta);
        }

        const grid = document.createElement("div");
        grid.className = "rank-grid";

        list.forEach((item, idx) => {
          const imgSrc = getImageForRank(item.rank);
          const sizeClass = getCardSizeClass(item.rank);
          const name = item.name || "";
          const rawNote = (item.note || "").trim();

          const noteHtml = rawNote ? `<div class="card-name-sub">${rawNote}</div>` : "";
          const bottomHtml = item.joinDate ? `<div class="card-bottom">${item.joinDate}</div>` : "";

          const card = document.createElement("article");
          card.className = `card ${sizeClass}`;
          card.style.animationDelay = `${idx * 0.03}s`;

          card.innerHTML = `
            <div class="card-image-wrap">
              <img src="${imgSrc}" alt="${item.rank}" loading="lazy" />
            </div>
            <div class="card-body">
              <div class="card-name">${name}</div>
              ${noteHtml}
              ${bottomHtml}
            </div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        main.appendChild(section);
      });
    }

    loadData();
  </script>
</body>
</html>
