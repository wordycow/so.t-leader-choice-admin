<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 급등/급락 포착 봇 v7.3 - SURGE & DIP HUNTER</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 헤더 */
    .header {
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .header h1 {
      font-size: 36px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffd700, #ff6b00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    /* 로딩 스피너 */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-indicator.running {
      background: rgba(0, 212, 255, 0.2);
      color: #00d4ff;
      border: 1px solid #00d4ff;
    }

    .status-indicator.stopped {
      background: rgba(255, 71, 87, 0.2);
      color: #ff4757;
      border: 1px solid #ff4757;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-indicator.running .status-dot {
      background: #00d4ff;
    }

    .status-indicator.stopped .status-dot {
      background: #ff4757;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .header p {
      font-size: 16px;
      color: #a0a0a0;
    }

    /* 컨트롤 패널 */
    .control-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .control-card {
      background: rgba(30, 30, 50, 0.6);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }

    .control-card h3 {
      margin-bottom: 15px;
      color: #ffd700;
      font-size: 18px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }

    .btn-start {
      background: linear-gradient(135deg, #00d4ff, #0099ff);
      color: white;
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 153, 255, 0.4);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ff4757, #ff6348);
      color: white;
    }

    .btn-stop:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
    }

    .mode-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .mode-btn.active {
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.2);
      color: #00d4ff;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
    }

    /* 통계 대시보드 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(30, 30, 50, 0.8), rgba(20, 20, 40, 0.8));
      padding: 25px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }

    .stat-label {
      font-size: 14px;
      color: #a0a0a0;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: #00d4ff;
    }

    .stat-value.positive {
      color: #00ff88;
    }

    .stat-value.negative {
      color: #ff4757;
    }

    /* 급등 알림 */
    .surge-alerts {
      background: rgba(30, 30, 50, 0.6);
      padding: 25px;
      border-radius: 12px;
      border: 2px solid #ffd700;
      margin-bottom: 30px;
      max-height: 400px;
      overflow-y: auto;
    }

    .surge-alerts h3 {
      color: #ffd700;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .surge-item {
      background: rgba(255, 215, 0, 0.1);
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #ffd700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .surge-ticker {
      font-size: 18px;
      font-weight: 700;
      color: #ffd700;
    }

    .surge-price {
      font-size: 16px;
      color: #00d4ff;
    }

    .surge-signals {
      background: rgba(255, 215, 0, 0.2);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    /* 거래 내역 */
    .trades-section {
      background: rgba(30, 30, 50, 0.6);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 30px;
    }

    .trades-section h3 {
      color: #00d4ff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .trade-item {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid transparent;
    }

    .trade-item.buy {
      border-left-color: #00ff88;
    }

    .trade-item.sell {
      border-left-color: #ff4757;
    }

    .trade-type {
      font-weight: 700;
      font-size: 14px;
    }

    .trade-type.buy {
      color: #00ff88;
    }

    .trade-type.sell {
      color: #ff4757;
    }

    .trade-ticker {
      font-size: 16px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .trade-profit {
      font-size: 16px;
      font-weight: 700;
    }

    .trade-profit.positive {
      color: #00ff88;
    }

    .trade-profit.negative {
      color: #ff4757;
    }

    /* 상태 표시 */
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-indicator.running {
      background: #00ff88;
      animation: pulse 2s infinite;
    }

    .status-indicator.stopped {
      background: #ff4757;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* 스크롤바 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 212, 255, 0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <h1>🚀 급등/급락 포착 봇 v7.3 - SURGE & DIP HUNTER</h1>
      <p>24시간 감시 → 급등/급락 신호 포착 → 초고속 진입 → 자동 익절</p>
      <p style="margin-top: 10px;">
        <span class="status-indicator stopped" id="statusIndicator">
          <span class="status-dot"></span>
          <span id="statusText">대기 중...</span>
        </span>
      </p>
    </div>

    <!-- 컨트롤 패널 -->
    <div class="control-panel">
      <!-- 모드 선택 -->
      <div class="control-card">
        <h3>🎮 모드 선택</h3>
        <div class="mode-selector">
          <div class="mode-btn active" id="practiceModeBtn" onclick="selectMode('practice')">
            연습 모드<br><small>(무료, 시뮬레이션)</small>
          </div>
          <div class="mode-btn" id="liveModeBtn" onclick="selectMode('live')">
            실전 모드<br><small>(실제 거래)</small>
          </div>
        </div>
        <label style="color: #a0a0a0; font-size: 14px; display: block; margin-bottom: 5px;">
          시뮬레이션 시드 (원)
        </label>
        <input type="number" id="simulationSeed" value="1000000" placeholder="시뮬레이션 시드 (예: 1000000)" />
      </div>

      <!-- 봇 제어 -->
      <div class="control-card">
        <h3>⚙️ 봇 제어</h3>
        <button class="btn btn-start" id="startBtn" onclick="startBot()">▶️ Bot Start</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopBot()">⏸️ Bot Stop</button>
      </div>

      <!-- API 설정 -->
      <div class="control-card">
        <h3>🔑 API 설정</h3>
        <input type="password" id="accessKey" placeholder="Access Key" />
        <input type="password" id="secretKey" placeholder="Secret Key" />
        <button class="btn" style="background: #6c5ce7; color: white;" onclick="saveApiKeys()">💾 저장</button>
      </div>
    </div>

    <!-- 통계 대시보드 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">💰 현재 잔고</div>
        <div class="stat-value" id="currentBalance">0원</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">📈 총 수익</div>
        <div class="stat-value positive" id="totalProfit">+0원</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">📊 수익률</div>
        <div class="stat-value positive" id="profitRate">+0.00%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🎯 승률</div>
        <div class="stat-value" id="winRate">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🚀 급등 감지</div>
        <div class="stat-value" id="surgesDetected">0건</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">💼 거래 횟수</div>
        <div class="stat-value" id="tradesExecuted">0건</div>
      </div>
    </div>

    <!-- 급등 알림 -->
    <div class="surge-alerts">
      <h3>🚀 최근 급등 알림</h3>
      <div id="surgeAlertsList">
        <p style="color: #a0a0a0; text-align: center; padding: 20px;">
          급등 신호 대기 중... 봇을 시작하세요!
        </p>
      </div>
    </div>

    <!-- 거래 내역 -->
    <div class="trades-section">
      <h3>📊 거래 내역</h3>
      <div id="tradesList">
        <p style="color: #a0a0a0; text-align: center; padding: 20px;">
          거래 내역이 없습니다.
        </p>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'practice';
    let updateInterval = null;

    // 모드 선택
    function selectMode(mode) {
      currentMode = mode;
      document.getElementById('practiceModeBtn').classList.remove('active');
      document.getElementById('liveModeBtn').classList.remove('active');
      
      if (mode === 'practice') {
        document.getElementById('practiceModeBtn').classList.add('active');
      } else {
        document.getElementById('liveModeBtn').classList.add('active');
      }
    }

    // 봇 시작
    async function startBot() {
      const seed = parseInt(document.getElementById('simulationSeed').value) || 1000000;
      
      try {
        const response = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: currentMode,
            simulation_seed: seed
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          alert('✅ 봇이 시작되었습니다!');
          startUpdating();
        } else {
          alert('❌ ' + data.message);
        }
      } catch (error) {
        alert('❌ 오류: ' + error.message);
      }
    }

    // 봇 중지
    async function stopBot() {
      try {
        const response = await fetch('/api/stop', {
          method: 'POST'
        });
        
        const data = await response.json();
        
        if (data.success) {
          alert('⏸️ 봇이 중지되었습니다.');
          stopUpdating();
        }
      } catch (error) {
        alert('❌ 오류: ' + error.message);
      }
    }

    // API 키 저장
    async function saveApiKeys() {
      const accessKey = document.getElementById('accessKey').value;
      const secretKey = document.getElementById('secretKey').value;
      
      if (!accessKey || !secretKey) {
        alert('⚠️ API 키를 모두 입력하세요.');
        return;
      }
      
      try {
        const response = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_key: accessKey, secret_key: secretKey })
        });
        
        const data = await response.json();
        
        if (data.success) {
          alert('✅ API 키가 저장되었습니다!');
        } else {
          alert('❌ ' + data.message);
        }
      } catch (error) {
        alert('❌ 오류: ' + error.message);
      }
    }

    // 상태 업데이트 시작
    function startUpdating() {
      if (updateInterval) clearInterval(updateInterval);
      
      updateStatus();
      updateInterval = setInterval(updateStatus, 3000);
    }

    // 상태 업데이트 중지
    function stopUpdating() {
      if (updateInterval) {
        clearInterval(updateInterval);
        updateInterval = null;
      }
    }

    // 상태 업데이트
    async function updateStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        
        // 상태 표시
        const indicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        
        if (data.running) {
          indicator.className = 'status-indicator running';
          statusText.innerHTML = `<span class="spinner"></span> 실행 중 (${data.mode === 'practice' ? '연습' : '실전'} 모드)`;
        } else {
          indicator.className = 'status-indicator stopped';
          statusText.textContent = '⏸️ 대기 중...';
        }
        
        // 시뮬레이션 통계
        const sim = data.simulation;
        document.getElementById('currentBalance').textContent = sim.current_krw.toLocaleString() + '원';
        
        const profit = sim.total_value - sim.seed;
        document.getElementById('totalProfit').textContent = (profit >= 0 ? '+' : '') + profit.toLocaleString() + '원';
        document.getElementById('totalProfit').className = 'stat-value ' + (profit >= 0 ? 'positive' : 'negative');
        
        document.getElementById('profitRate').textContent = (sim.profit_rate >= 0 ? '+' : '') + sim.profit_rate.toFixed(2) + '%';
        document.getElementById('profitRate').className = 'stat-value ' + (sim.profit_rate >= 0 ? 'positive' : 'negative');
        
        // 급등 통계
        const stats = data.surge_statistics;
        document.getElementById('winRate').textContent = stats.win_rate.toFixed(1) + '%';
        document.getElementById('surgesDetected').textContent = stats.total_surges_detected + '건';
        document.getElementById('tradesExecuted').textContent = stats.total_trades_executed + '건';
        
        // 급등 알림
        const surgeList = document.getElementById('surgeAlertsList');
        if (data.recent_surges && data.recent_surges.length > 0) {
          surgeList.innerHTML = data.recent_surges.map(surge => `
            <div class="surge-item">
              <div>
                <div class="surge-ticker">${surge.ticker}</div>
                <div class="surge-price">${surge.price.toLocaleString()}원</div>
              </div>
              <div class="surge-signals">${surge.signals}개 신호</div>
            </div>
          `).join('');
        }
        
        // 거래 내역
        const tradesList = document.getElementById('tradesList');
        if (data.recent_trades && data.recent_trades.length > 0) {
          tradesList.innerHTML = data.recent_trades.map(trade => `
            <div class="trade-item ${trade.type.toLowerCase()}">
              <div>
                <span class="trade-type ${trade.type.toLowerCase()}">${trade.type}</span>
                <span class="trade-ticker">${trade.ticker}</span>
              </div>
              <div>
                ${trade.type === 'SELL' ? `
                  <span class="trade-profit ${trade.profit_krw >= 0 ? 'positive' : 'negative'}">
                    ${trade.profit_krw >= 0 ? '+' : ''}${trade.profit_krw.toLocaleString()}원 (${trade.profit_rate >= 0 ? '+' : ''}${trade.profit_rate.toFixed(2)}%)
                  </span>
                ` : `
                  <span>${trade.krw.toLocaleString()}원</span>
                `}
              </div>
            </div>
          `).join('');
        }
        
      } catch (error) {
        console.error('상태 업데이트 오류:', error);
      }
    }

    // 페이지 로드 시 초기 상태 업데이트
    updateStatus();
  </script>
</body>
</html>
