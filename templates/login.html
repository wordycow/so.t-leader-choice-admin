<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 로그인 - Upbit AI Trading Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      background: rgba(30, 30, 45, 0.8);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px;
      width: 90%;
      max-width: 480px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 1;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 30%, #ef4444 60%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .logo p {
      color: #9ca3af;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(20, 20, 35, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #e4e4e7;
      font-size: 15px;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: rgba(99, 102, 241, 0.5);
      background: rgba(20, 20, 35, 0.8);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      color: #6b7280;
      font-size: 14px;
    }

    .info {
      margin-top: 24px;
      padding: 16px;
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid #3b82f6;
      border-radius: 8px;
      font-size: 13px;
      color: #93c5fd;
    }

    .error {
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid #ef4444;
      border-radius: 8px;
      font-size: 14px;
      color: #fca5a5;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>🏆 Upbit AI Bot</h1>
      <p>AI 기반 자동 트레이딩 시스템</p>
    </div>

    <div class="error" id="errorMessage"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">👤 사용자 이름</label>
        <input type="text" id="username" placeholder="사용자 이름을 입력하세요" required>
      </div>

      <div class="form-group">
        <label for="email">📧 이메일 (선택)</label>
        <input type="email" id="email" placeholder="example@email.com">
      </div>

      <button type="submit" class="btn btn-primary">🚀 시작하기</button>
    </form>

    <div class="divider">또는</div>

    <button class="btn btn-secondary" onclick="registerUser()">✨ 새 계정 만들기</button>

    <div class="info">
      <strong>💡 안내</strong><br>
      • 처음 방문하신 경우 "새 계정 만들기"를 클릭하세요<br>
      • 기존 사용자는 사용자 이름으로 로그인하세요<br>
      • 이메일은 선택 사항입니다
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      
      if (!username) {
        showError('사용자 이름을 입력해주세요!');
        return;
      }
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // 세션 저장
          sessionStorage.setItem('user_id', data.user_id);
          sessionStorage.setItem('username', data.username);
          
          // 대시보드로 이동
          window.location.href = '/';
        } else {
          showError(data.message || '로그인 실패');
        }
      } catch (error) {
        showError('네트워크 오류: ' + error.message);
      }
    });
    
    async function registerUser() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      
      if (!username) {
        showError('사용자 이름을 입력해주세요!');
        return;
      }
      
      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email })
        });
        
        const data = await response.json();
        
        if (data.success) {
          alert('✅ 계정이 생성되었습니다!\n\n사용자명: ' + data.username);
          
          // 자동 로그인
          sessionStorage.setItem('user_id', data.user_id);
          sessionStorage.setItem('username', data.username);
          
          // 대시보드로 이동
          window.location.href = '/';
        } else {
          showError(data.message || '계정 생성 실패');
        }
      } catch (error) {
        showError('네트워크 오류: ' + error.message);
      }
    }
    
    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = '❌ ' + message;
      errorEl.style.display = 'block';
      
      setTimeout(() => {
        errorEl.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
