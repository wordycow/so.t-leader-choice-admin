<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>THE UNIQUE – 2048</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#020617;
      --panel: rgba(15,23,42,0.80);
      --border: rgba(255,255,255,0.10);
      --gold:#fbbf24;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --cell: rgba(2,6,23,0.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #020617 55%, #000 100%);
      color:var(--text);
      font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:18px;
    }
    .wrap{ width:min(920px,100%); display:grid; grid-template-columns: 1fr 320px; gap:14px; }
    @media (max-width: 860px){ .wrap{ grid-template-columns:1fr; } }

    .card{
      background: var(--panel);
      border:1px solid rgba(251,191,36,0.25);
      border-radius:18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      overflow:hidden;
    }
    .top{
      padding:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .title{
      font-family:"Cinzel",serif;
      letter-spacing:.18em;
      font-weight:700;
      text-transform:uppercase;
      color:var(--gold);
    }
    .btn{
      border:1px solid var(--border);
      background: rgba(2,6,23,0.35);
      color: var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:900;
      letter-spacing:.06em;
      transition: transform .12s ease, filter .12s ease, border-color .12s ease;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
    }
    .btn:hover{ transform:translateY(-1px); filter:brightness(1.06); border-color:rgba(251,191,36,0.35); }
    .btn.primary{ background:var(--gold); border-color:var(--gold); color:#0b1120; }

    .boardWrap{ padding:14px; display:flex; justify-content:center; }
    .board{
      width:min(560px,100%);
      aspect-ratio: 1/1;
      background: rgba(2,6,23,0.35);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:16px;
      padding:12px;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:10px;
      position:relative;
      touch-action: none;
    }
    .cell{
      background: rgba(15,23,42,0.55);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      font-size: 22px;
      color: #e5e7eb;
      user-select:none;
    }

    .tile{
      position:absolute;
      width: calc((100% - 30px) / 4);
      height: calc((100% - 30px) / 4);
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      color:#0b1120;
      transition: transform 120ms ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.45);
      user-select:none;
    }
    .tile span{ font-size: 22px; }
    .tile.v128 span, .tile.v256 span, .tile.v512 span{ font-size: 20px; }
    .tile.v1024 span, .tile.v2048 span{ font-size: 18px; }

    .side{ padding:14px; display:flex; flex-direction:column; gap:12px; }
    .stat{
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(2,6,23,0.30);
      border-radius:16px;
      padding:12px;
    }
    .stat .k{ color:var(--muted); font-size:12px; font-weight:800; }
    .stat .v{ font-size:22px; font-weight:900; margin-top:4px; color:#fff; }
    .hint{ font-size:12px; color:#cbd5e1; line-height:1.6; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .row .btn{ flex:1; }

    .overlay{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,0.55);
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:10px;
      border-radius:16px;
      padding:14px;
      text-align:center;
    }
    .overlay.active{ display:flex; }
    .overlay h2{
      margin:0;
      font-size:22px;
      font-weight:900;
      color:#fff;
    }
    .overlay p{
      margin:0;
      color:#cbd5e1;
      font-size:12px;
      line-height:1.5;
    }
    .footerNote{
      font-size:11px;
      color:#94a3b8;
      text-align:center;
      padding:10px 0 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="title">2048</div>
        <div class="row">
          <a class="btn" href="../game.html">GAME LIST</a>
          <a class="btn" href="../the-unique-main.html">MAIN</a>
        </div>
      </div>

      <div class="boardWrap">
        <div class="board" id="board">
          <!-- base cells -->
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

          <div class="overlay" id="overlay">
            <h2 id="ovTitle">GAME OVER</h2>
            <p id="ovText">RESTART를 눌러 다시 시작하세요.</p>
            <button class="btn primary" id="ovBtn">RESTART</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="top">
        <div class="title">CONTROL</div>
        <button class="btn primary" id="btnRestart">RESTART</button>
      </div>
      <div class="side">
        <div class="stat">
          <div class="k">SCORE</div>
          <div class="v" id="score">0</div>
        </div>
        <div class="stat">
          <div class="k">BEST</div>
          <div class="v" id="best">0</div>
        </div>
        <div class="hint">
          ✅ PC: 방향키 / WASD<br>
          ✅ 모바일: 스와이프<br>
          목표: 2048 만들기
        </div>
        <div class="footerNote">THE UNIQUE • Games</div>
      </div>
    </div>
  </div>

  <script>
    const boardEl = document.getElementById("board");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const btnRestart = document.getElementById("btnRestart");
    const overlay = document.getElementById("overlay");
    const ovBtn = document.getElementById("ovBtn");
    const ovTitle = document.getElementById("ovTitle");
    const ovText = document.getElementById("ovText");

    let grid, score, best;

    const COLORS = {
      2:  "#fde68a",
      4:  "#fbbf24",
      8:  "#fb923c",
      16: "#f97316",
      32: "#f87171",
      64: "#ef4444",
      128:"#a7f3d0",
      256:"#34d399",
      512:"#22c55e",
      1024:"#93c5fd",
      2048:"#60a5fa"
    };

    function loadBest(){
      try{ best = Number(localStorage.getItem("u2048_best")||"0")||0; }catch(_){ best=0; }
      bestEl.textContent = best;
    }
    function saveBest(){ try{ localStorage.setItem("u2048_best", String(best)); }catch(_){} }

    function emptyGrid(){
      return Array.from({length:4}, ()=>Array(4).fill(0));
    }

    function randEmpty(){
      const cells = [];
      for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(grid[r][c]===0) cells.push([r,c]);
      if(!cells.length) return null;
      return cells[Math.floor(Math.random()*cells.length)];
    }

    function addTile(){
      const spot = randEmpty();
      if(!spot) return false;
      const [r,c] = spot;
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      return true;
    }

    function reset(){
      grid = emptyGrid();
      score = 0;
      scoreEl.textContent = "0";
      overlay.classList.remove("active");
      addTile(); addTile();
      render();
    }

    function canMove(){
      for(let r=0;r<4;r++){
        for(let c=0;c<4;c++){
          if(grid[r][c]===0) return true;
          const v = grid[r][c];
          if(r<3 && grid[r+1][c]===v) return true;
          if(c<3 && grid[r][c+1]===v) return true;
        }
      }
      return false;
    }

    function moved(oldG){
      for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(oldG[r][c]!==grid[r][c]) return true;
      return false;
    }

    function cloneG(){
      return grid.map(row=>row.slice());
    }

    function slideLine(line){
      // remove zeros
      const arr = line.filter(v=>v!==0);
      for(let i=0;i<arr.length-1;i++){
        if(arr[i]===arr[i+1]){
          arr[i] *= 2;
          score += arr[i];
          arr[i+1] = 0;
        }
      }
      const merged = arr.filter(v=>v!==0);
      while(merged.length<4) merged.push(0);
      return merged;
    }

    function move(dir){
      const old = cloneG();

      if(dir==="L"){
        for(let r=0;r<4;r++){
          grid[r] = slideLine(grid[r]);
        }
      }
      if(dir==="R"){
        for(let r=0;r<4;r++){
          const rev = grid[r].slice().reverse();
          const slid = slideLine(rev).reverse();
          grid[r] = slid;
        }
      }
      if(dir==="U"){
        for(let c=0;c<4;c++){
          const col = [grid[0][c],grid[1][c],grid[2][c],grid[3][c]];
          const slid = slideLine(col);
          for(let r=0;r<4;r++) grid[r][c]=slid[r];
        }
      }
      if(dir==="D"){
        for(let c=0;c<4;c++){
          const col = [grid[0][c],grid[1][c],grid[2][c],grid[3][c]].reverse();
          const slid = slideLine(col).reverse();
          for(let r=0;r<4;r++) grid[r][c]=slid[r];
        }
      }

      if(moved(old)){
        addTile();
        render();
        if(score>best){ best=score; bestEl.textContent=String(best); saveBest(); }
        if(!canMove()) end(false);
        if(has2048()) end(true);
      }
    }

    function has2048(){
      for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(grid[r][c]===2048) return true;
      return false;
    }

    function end(win){
      overlay.classList.add("active");
      ovTitle.textContent = win ? "YOU WIN!" : "GAME OVER";
      ovText.textContent = win ? "2048을 만들었다. 계속해도 되고, RESTART로 리셋해도 됨." : "움직일 수 없다. RESTART로 다시 시작.";
    }

    function render(){
      scoreEl.textContent = String(score);
      // remove old tiles
      boardEl.querySelectorAll(".tile").forEach(t=>t.remove());

      const gap = 10;
      const pad = 12;
      // board inner size = 100% - padding*2
      // cell size = (inner - gap*3)/4
      // for positioning, use percent based transform
      for(let r=0;r<4;r++){
        for(let c=0;c<4;c++){
          const v = grid[r][c];
          if(!v) continue;
          const tile = document.createElement("div");
          tile.className = "tile v"+v;
          tile.style.background = COLORS[v] || "#fbbf24";
          tile.style.transform = `translate(${c*100}%, ${r*100}%)`;
          tile.innerHTML = `<span>${v}</span>`;
          boardEl.appendChild(tile);
        }
      }
    }

    // keyboard
    window.addEventListener("keydown", (e)=>{
      const k = e.key.toLowerCase();
      if(k==="arrowleft" || k==="a") move("L");
      else if(k==="arrowright" || k==="d") move("R");
      else if(k==="arrowup" || k==="w") move("U");
      else if(k==="arrowdown" || k==="s") move("D");
    });

    // touch swipe
    let sx=0, sy=0;
    boardEl.addEventListener("touchstart", (e)=>{
      const t = e.touches[0];
      sx=t.clientX; sy=t.clientY;
    }, {passive:true});
    boardEl.addEventListener("touchend", (e)=>{
      const t = e.changedTouches[0];
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      if(Math.abs(dx)<18 && Math.abs(dy)<18) return;
      if(Math.abs(dx)>Math.abs(dy)) move(dx>0 ? "R":"L");
      else move(dy>0 ? "D":"U");
    }, {passive:true});

    btnRestart.addEventListener("click", reset);
    ovBtn.addEventListener("click", reset);

    loadBest();
    reset();
  </script>
</body>
</html>
