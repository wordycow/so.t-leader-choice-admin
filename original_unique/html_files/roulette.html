<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>UNIQUE ROYAL ROULETTE</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="./img/slot/marble.jpg?v=20260126">
  <link rel="preload" as="image" href="./img/slot/carbon.jpg?v=20260126">
  <link rel="preload" as="image" href="./img/slot/velvet.jpg?v=20260126">

  <!-- ✅ FIX: Supabase는 반드시 여기서 로드(스크립트 깨짐 방지) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  
  <style>
    :root{
      --bg0:#05070f;
      --bg1:#070b18;
      --gold1:#ffd36b;
      --gold2:#f7b500;
      --gold3:#ffcc00;
      --muted:#a8b0c6;
      --txt:#e9edf7;
      --pink:#ff0a78;

      --radius:22px;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --glow: 0 0 18px rgba(255, 200, 70, 0.18);

      --roundSec: 1200;      /* 15분 */
      --lockSec: 60;        /* 60초 남으면 베팅 잠금 */
      --freezeSec: 30;      /* 승자 표시 30초 유지 */

      --themeBarH: 44px;    /* 하단 테마바 높이 */
    }

    *{box-sizing:border-box}

    html,body{
      height:100%;
      margin:0;
      padding:0;
      background:#05070f;
    }

    body{
      margin:0;
      color:var(--txt);
      font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      overflow-x:hidden;
      padding-bottom: calc(var(--themeBarH) + env(safe-area-inset-bottom));
      background-color:#05070f;
    }

    /* ==========================
      럭셔리 배경 3종 (MARBLE/CARBON/VELVET) + 이미지 연결
      (roulette.html = games 폴더 기준 경로: ./img/slot/...)
    ========================== */
    body[data-bg="0"]{
  background:
    radial-gradient(1200px 650px at 50% -10%, rgba(255, 208, 80, 0.10), transparent 60%),
    radial-gradient(1100px 700px at 18% 22%, rgba(255,255,255,0.40), transparent 62%),
    radial-gradient(900px 600px at 90% 38%, rgba(255, 30, 120, 0.05), transparent 64%),
    /* 아래쪽 살짝 눌러서 '화이트인데도 고급스럽게' */
    radial-gradient(1400px 900px at 50% 110%, rgba(0,0,0,0.72), rgba(0,0,0,0.18)),
    linear-gradient(180deg, rgba(255,255,255,0.62), rgba(230,234,246,0.14)),
    url("./img/slot/marble.jpg?v=20260126") center/cover no-repeat fixed;
}
    body[data-bg="1"]{
      background:
        radial-gradient(1100px 700px at 50% -10%, rgba(255, 208, 80, 0.09), transparent 60%),
        repeating-linear-gradient(135deg,
          rgba(255,255,255,0.03) 0 2px,
          rgba(0,0,0,0.00) 2px 10px),
        repeating-linear-gradient(45deg,
          rgba(255,255,255,0.02) 0 1px,
          rgba(0,0,0,0.00) 1px 8px),
        linear-gradient(180deg, rgba(4,6,13,0.58), rgba(7,11,24,0.75)),
        url("./img/slot/carbon.jpg?v=20260126") center/cover no-repeat fixed;
    }

    body[data-bg="2"]{
  background:
    radial-gradient(950px 560px at 50% 0%, rgba(255, 208, 80, 0.08), transparent 62%),
    radial-gradient(900px 650px at 22% 30%, rgba(150, 60, 255, 0.18), transparent 58%),
    radial-gradient(900px 650px at 85% 55%, rgba(255, 10, 120, 0.16), transparent 62%),
    radial-gradient(1400px 900px at 50% 115%, rgba(0,0,0,0.88), rgba(0,0,0,0.20)),
    linear-gradient(180deg, rgba(10,4,20,0.72), rgba(0,0,0,0.86)),
    url("./img/slot/velvet.jpg?v=20260126") center/cover no-repeat fixed;
}
    /* 모바일에 fixed는 버벅일 수 있으니 모바일만 해제 */
    @media (max-width: 980px){
      body[data-bg="0"], body[data-bg="1"], body[data-bg="2"]{
        background-attachment: scroll, scroll, scroll, scroll, scroll;
      }
    }

    /* Top ticker */
    .ticker{
      position:sticky; top:0; z-index:60;
      width:100%;
      border-bottom:1px solid rgba(255, 208, 80, 0.10);
      background: linear-gradient(180deg, rgba(0,0,0,0.76), rgba(0,0,0,0.35));
      backdrop-filter: blur(10px);
    }
    .ticker .inner{
      display:flex; gap:14px; align-items:center;
      white-space:nowrap;
      padding:10px 14px;
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.06em;
      color: rgba(255, 208, 80, 0.85);
      font-size:12px;
      overflow:hidden;
    }
    .marquee{
      display:inline-block;
      animation: scroll 22s linear infinite;
      padding-left:100%;
    }
    @keyframes scroll{ 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }

    /* Layout */
    .wrap{
      width:100%;
      max-width: 1800px;   /* ✅ PC 꽉차게 크게 */
      margin: 0 auto;
      padding: 14px 14px 18px;
      min-height: calc(100vh - 44px);
    }
    .grid{
      display:grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 14px;
      align-items:stretch;
    }

    .card{
      background: linear-gradient(180deg, rgba(0,0,0,0.58), rgba(0,0,0,0.28));
      border:1px solid rgba(255, 208, 80, 0.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Mobile: 회색 뜨는 느낌 제거(진한 블랙 + 블러 OFF) */
    @media (max-width: 980px){
      .card{
        background: rgba(0,0,0,0.82);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    /* Stage (wheel area) */
    .stage{
      display:flex;
      flex-direction:column;
      height: calc(100vh - 70px - var(--themeBarH));
      min-height: 680px;
      background:
        radial-gradient(900px 700px at 45% 35%, rgba(0,0,0,0.0), rgba(0,0,0,0.55)),
        linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.6));
      border-right:1px solid rgba(255, 208, 80, 0.10);
    }

    /* Wheel viewport */
    .wheelViewport{
      position:relative;
      width:100%;
      flex: 1 1 auto;
      min-height: 520px;
      overflow:hidden;
      border-bottom:1px solid rgba(255, 208, 80, 0.10);
      background:
        radial-gradient(800px 500px at 50% 25%, rgba(255,255,255,0.06), transparent 55%),
        radial-gradient(1200px 900px at 50% 70%, rgba(0,0,0,0.75), rgba(0,0,0,0.15));
    }

    .wheelDock{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      width: min(78vh, 820px);
      height: min(78vh, 820px);
      max-width: 92vw;
      max-height: 92vw;
    }

    canvas#wheel{
      width:100%;
      height:100%;
      display:block;
      filter: drop-shadow(0 24px 60px rgba(0,0,0,0.55));
    }

    /* ✅ Pointer (triangle only) - 찐한 금색 */
    .pointer{
      position:absolute;
      left:50%;
      top:10px;
      transform: translateX(-50%);
      width:0;height:0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 26px solid var(--gold3);
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.55)) drop-shadow(0 0 10px rgba(255,204,0,0.22));
      z-index:20;
      opacity:0.98;
    }

    /* HUD under wheel */
    .hud{
      flex: 0 0 auto;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px;
    }
    .hudBox{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.22));
      border:1px solid rgba(255, 208, 80, 0.12);
      border-radius: 16px;
      padding: 12px 12px;
    }
    .hudLabel{
      font-family:"Cinzel", serif;
      letter-spacing:.08em;
      font-size:11px;
      color: rgba(255,255,255,0.60);
      margin-bottom:6px;
    }
    .hudValue{
      font-family:"Cinzel", serif;
      font-size:34px;
      font-weight:700;
      color: var(--gold3);
      text-shadow: 0 0 18px rgba(255, 208, 80, 0.18);
      line-height:1.1;
    }
    .hudValue.small{
      font-size:28px;
      color:#fff;
      text-shadow:none;
      font-family:"Rajdhani", sans-serif;
      letter-spacing:.04em;
    }

    /* Countdown pretty */
    .countBig{
      font-family:"Rajdhani", sans-serif;
      font-weight:800;
      font-size:34px;
      letter-spacing:.06em;
      color: #fff;
    }
    .countWarn{
      color: var(--gold3);
      text-shadow: 0 0 18px rgba(255, 208, 80, 0.24);
    }
    .countFinal{
      color: var(--pink);
      text-shadow: 0 0 18px rgba(255, 10, 120, 0.25);
      animation: blink 0.65s steps(2, end) infinite;
    }
    @keyframes blink{ 50%{opacity:0.25} }

    /* Right panel */
    #sideCard{
      display:flex;
      flex-direction:column;
      height: calc(100vh - 70px - var(--themeBarH));
      min-height: 680px;
    }
    .sideTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 208, 80, 0.10);
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.12));
    }
    .sideTitle{
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.08em;
      font-size:12px;
      color: rgba(255, 208, 80, 0.9);
      line-height:1.1;
    }
    .sideStatus{
      font-size:11px;
      color: rgba(255,255,255,0.60);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 210px;
    }

    /* Player Bar (BGM) */
    .playerBar{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 8px 10px;
      border:1px solid rgba(255, 208, 80, 0.14);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.25));
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
      max-width: 100%;
      overflow:hidden;
    }
    .pBtn{
      width:34px;height:34px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.88);
      cursor:pointer;
      flex: 0 0 auto;
    }
    .pBtn:active{ transform: translateY(1px); }

    .pMeta{
      min-width: 0;
      display:flex;
      flex-direction:column;
      gap:2px;
      flex: 1 1 auto;
    }
    .pName{
      font-family:"Cinzel", serif;
      font-weight:700;
      font-size:12px;
      letter-spacing:.06em;
      color: rgba(255, 208, 80, 0.92);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pSub{
      font-size:11px;
      color: rgba(255,255,255,0.55);
    }
    .volWrap{
      display:flex;
      align-items:center;
      gap:8px;
      flex: 0 0 auto;
      justify-content:flex-end;
    }
    .volLabel{
      font-family:"Cinzel", serif;
      font-size:11px;
      letter-spacing:.07em;
      color: rgba(255,255,255,0.62);
      white-space:nowrap;
    }
    input[type="range"]{ width: 120px; max-width: 24vw; }

    /* Bet panel */
    .betBox{ padding: 14px; }
    .row{
      display:flex; align-items:center; justify-content:space-between; gap: 10px;
      margin-bottom: 10px;
    }
    .kv{
      font-size:12px;
      color: rgba(255,255,255,0.65);
      letter-spacing:.02em;
    }
    .kv b{ color:#fff; font-weight:700; }
    .pill{
      padding:6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255, 208, 80, 0.14);
      background: rgba(0,0,0,0.25);
      color: rgba(255, 208, 80, 0.88);
      font-size:12px;
      white-space:nowrap;
    }
    .pill.open{ color: rgba(255, 208, 80, 0.88); border-color: rgba(255, 208, 80, 0.18); }
    .pill.closed{ color: rgba(255,255,255,0.88); border-color: rgba(255,255,255,0.14); }

    .amountBox{
      border:1px solid rgba(255, 208, 80, 0.22);
      background: rgba(0,0,0,0.28);
      border-radius: 14px;
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Rajdhani", sans-serif;
      font-weight:800;
      letter-spacing:.06em;
      color: var(--gold3);
      font-size:22px;
      box-shadow: var(--glow);
      margin-bottom: 10px;
      user-select:none;
    }

    .btnRow{
      display:flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn{
      flex:1;
      height: 42px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.28);
      color: rgba(255,255,255,0.88);
      cursor:pointer;
      font-weight:700;
      user-select:none;
    }
    .btn.gold{
      border:1px solid rgba(255, 208, 80, 0.35);
      color: var(--gold3);
    }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    /* BET NOW 버튼: OPEN(번쩍) / CLOSED(크로스) */
    .betNow{
      position: relative;
      width:100%;
      height: 54px;
      border-radius: 999px;
      border:1px solid rgba(255, 208, 80, 0.22);
      background:
        radial-gradient(120% 180% at 50% 0%, rgba(255,255,255,0.06), transparent 62%),
        linear-gradient(90deg, rgba(10,12,20,0.95), rgba(12,14,24,0.92));
      color: rgba(255, 230, 160, .95);
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.12em;
      cursor:pointer;
      overflow:hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,.04);
      margin-bottom: 10px;
      user-select:none;
    }
    .betNow.is-open{
      border-color: rgba(255, 208, 80, 0.55);
      box-shadow:
        0 0 0 1px rgba(255, 208, 80, .12),
        0 16px 50px rgba(0,0,0,.58),
        0 0 28px rgba(255, 10, 120, .22);
    }
    .betNow.is-open::before{
      content:"";
      position:absolute; inset:-2px;
      background:
        linear-gradient(110deg,
          transparent 0%,
          rgba(255, 208, 80, 0.00) 35%,
          rgba(255, 208, 80, 0.35) 45%,
          rgba(255, 10, 120, 0.25) 55%,
          rgba(255, 208, 80, 0.00) 65%,
          transparent 100%);
      transform: translateX(-60%);
      animation: betShine 1.35s linear infinite;
      mix-blend-mode: screen;
      pointer-events:none;
    }
    .betNow.is-open::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(80% 140% at 15% 50%, rgba(255, 20, 120, .30), transparent 60%),
        radial-gradient(80% 140% at 85% 50%, rgba(255, 60, 120, .16), transparent 62%);
      opacity: .90;
      pointer-events:none;
    }
    @keyframes betShine{
      0%{ transform: translateX(-70%); opacity:.65; }
      65%{ opacity: .98; }
      100%{ transform: translateX(70%); opacity:.65; }
    }

    .betNow.is-closed,
    .betNow:disabled{
      cursor:not-allowed;
      color: rgba(255,255,255,0.35);
      border-color: rgba(255,255,255,0.10);
      background:
        radial-gradient(120% 180% at 50% 0%, rgba(255,255,255,0.04), transparent 62%),
        linear-gradient(90deg, rgba(8,10,18,0.95), rgba(8,10,18,0.88));
      box-shadow: 0 12px 30px rgba(0,0,0,.62), inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .betNow.is-closed::before,
    .betNow:disabled::before{
      content:"";
      position:absolute; inset:0;
      background:
        linear-gradient(135deg,
          transparent 0 46%,
          rgba(255, 60, 120, 0.85) 46% 49%,
          transparent 49% 100%);
      opacity: .55;
      pointer-events:none;
      animation:none;
    }
    .betNow.is-closed::after,
    .betNow:disabled::after{
      content:"";
      position:absolute; inset:0;
      background:
        repeating-linear-gradient(0deg,
          rgba(255,255,255,0.05) 0 1px,
          transparent 1px 6px);
      opacity:.18;
      pointer-events:none;
    }

    /* Lists */
    .list{
      flex:1 1 auto;
      overflow:auto;
      padding: 10px 14px 14px;
      border-top:1px solid rgba(255, 208, 80, 0.10);
    }
    .listTitle{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom: 8px;
    }
    .listTitle span{
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.08em;
      font-size:12px;
      color: rgba(255,255,255,0.70);
    }
    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 10px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.22);
      margin-bottom: 8px;
    }
    .nameWrap{
      display:flex; align-items:center; gap:10px;
      min-width:0;
    }
    .dot{
      width:10px;height:10px;border-radius:999px;
      background: var(--pink);
      box-shadow: 0 0 14px rgba(255, 10, 120, 0.25);
      flex: 0 0 auto;
    }
    .nm{
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 220px;
    }
    .amt{
      font-family:"Rajdhani", sans-serif;
      font-weight:800;
      letter-spacing:.05em;
      color: var(--gold3);
      white-space:nowrap;
    }

    /* Winner overlay */
    .winner{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: radial-gradient(600px 420px at 50% 35%, rgba(0,0,0,0.25), rgba(0,0,0,0.88));
      z-index:40;
    }
    .winnerCard{
      width:min(520px, 92vw);
      border-radius: 22px;
      border:1px solid rgba(255, 208, 80, 0.22);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.55));
      box-shadow: 0 26px 80px rgba(0,0,0,0.65);
      padding: 16px 16px 14px;
      text-align:center;
    }
    .winnerTop{
      font-family:"Cinzel", serif;
      letter-spacing:.12em;
      color: rgba(255, 208, 80, 0.9);
      font-weight:700;
      font-size:13px;
      margin-bottom: 10px;
    }
    .winnerName{
      font-family:"Cinzel", serif;
      font-size:34px;
      font-weight:700;
      color:#fff;
      text-shadow: 0 0 18px rgba(255,255,255,0.12);
      margin-bottom: 6px;
      word-break:break-word;
    }
    .winnerSub{
      font-family:"Rajdhani", sans-serif;
      font-size:18px;
      letter-spacing:.08em;
      color: var(--gold3);
    }

    /* ==========================
      ✅ 테마 버튼: 얇고 세련된 하단 바
    ========================== */
    .themeBar{
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      transform: translateX(-50%);
      z-index: 90;
      width: min(720px, 94vw);
      height: var(--themeBarH);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(255, 208, 80, 0.16);
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.55);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .themeBar .seg{
      width:100%;
      height: 100%;
      display:flex;
      gap: 6px;
    }
    .themeBar button{
      flex:1;
      height: 100%;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.22);
      color: rgba(255,255,255,0.78);
      font-family:"Cinzel", serif;
      font-weight:700;
      letter-spacing:.08em;
      cursor:pointer;
      font-size:11px;
      white-space:nowrap;
      user-select:none;
    }
    .themeBar button.active{
      border-color: rgba(255, 208, 80, 0.45);
      color: rgba(255, 208, 80, 0.92);
      box-shadow: inset 0 0 0 1px rgba(255, 208, 80, 0.10), 0 8px 22px rgba(0,0,0,0.45);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.18));
    }

    /* ✅ 모바일 클릭 지연/드래그 방지 */
    .btn, .betNow, .pBtn, .themeBar button{
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Mobile rules */
    @media (max-width: 980px){

/* ==========================

// ⚠️ Apps Script 웹앱(/exec) URL
const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec";

// ✅ CORS 안전 비콘 (로그용)
function gasBeacon(params){
  if(!GAS_WEBAPP_URL) return;
  try{
    const q = new URLSearchParams({ action:"logRoulette", ...params });
    const url = GAS_WEBAPP_URL + (GAS_WEBAPP_URL.includes("?") ? "&" : "?") + q.toString();
    const img = new Image();
    img.referrerPolicy = "no-referrer";
    img.src = url;
  }catch(e){
    console.warn("[GAS LOG] fail", e);
  }
}

// ✅ JSONP (시트 잔액 읽기용: getUserInfo)
function gasJsonp(action, params={}){
  return new Promise((resolve, reject)=>{
    if(!GAS_WEBAPP_URL) return resolve(null);
    const cb = "__gas_cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    const script = document.createElement("script");
    const cleanup = ()=>{
      try{ delete window[cb]; }catch(_){}
      if(script && script.parentNode) script.parentNode.removeChild(script);
    };
    window[cb] = (data)=>{ cleanup(); resolve(data); };
    script.onerror = ()=>{ cleanup(); reject(new Error("GAS JSONP error")); };

    const qs = new URLSearchParams({ action, callback: cb, ...params });
    script.src = GAS_WEBAPP_URL + (GAS_WEBAPP_URL.includes("?") ? "&" : "?") + qs.toString();
    document.head.appendChild(script);
  });
}

async function gasGetBalance(id){
  try{
    const r = await gasJsonp("getUserInfo", { id });
    if(r && r.ok && typeof r.balance !== "undefined"){
      return Math.max(0, Math.floor(Number(r.balance)||0));
    }
  }catch(_){}
  return 0;
}

// ✅ 우리 표준 로그 포맷: k/type/round/id/delta/bal/meta
function uid_(){
  return (crypto?.randomUUID?.() || (Date.now()+"_"+Math.random().toString(16).slice(2)));
}
function makeLogKey_(...parts){
  return parts.join("|");
}
function gasLog({k,type,round,id,delta,bal,meta}){
  gasBeacon({
    k: String(k||""),
    type: String(type||""),
    round: String(round||""),
    id: String(id||""),
    delta: String(delta ?? 0),
    bal: (bal === undefined || bal === null) ? "" : String(bal),
    meta: String(meta||"")
  });
}

let walletBalance = 0;

async function sbFetchWallet(playerId){

    .from("roulette_wallets")

async function sbSubscribeWallet(playerId){

  if(sbWalletChannel){
    try{ await sb.removeChannel(sbWalletChannel); }catch(e){}

    }, (payload) => {

      if(n && typeof n.balance !== "undefined"){
        walletBalance = Math.max(0, Number(n.balance)||0);
        markUIDirty();
      }
    })

}

/* ==========================

========================== */
async function sbSetWalletBalance(playerId, balance){
  const pid = String(playerId||"").trim().toLowerCase();
  const bal = Math.max(0, Math.floor(Number(balance)||0));
  const { data, error } = await sb.rpc("rpc_set_wallet_balance", {

    p_balance: bal
  });
  if(error){
    console.warn("[SB] rpc_set_wallet_balance error", error);
    return { ok:false, balance: 0 };
  }
  const row = Array.isArray(data) ? data[0] : data;
  return { ok:true, balance: Math.max(0, Number(row?.balance)||0) };
}

/* ==========================
   ✅ RPC: 라운드 seed(회사 100UT) 1회만 실제 차감/확정
========================== */
async function sbEnsureSeedForRound(rk){
  const { data, error } = await sb.rpc("rpc_ensure_seed", {
    p_round: String(rk),
    p_seed: COMPANY_SEED_DEFAULT
  });
  if(error){
    console.warn("[SB] rpc_ensure_seed error", error);
    seedForRound = 0;
    return { ok:false, seed:0, reserved:false, company_balance:null };
  }
  const row = Array.isArray(data) ? data[0] : data;
  const seed = Math.max(0, Number(row?.seed)||0);
  const reserved = !!row?.reserved;
  const companyBal = (row?.company_balance === undefined || row?.company_balance === null)
    ? null
    : Math.max(0, Number(row.company_balance)||0);

  seedForRound = seed;
  markUIDirty();

  // ✅ 회사 seed가 "이번 라운드에 새로" 예약됐다면 -> 시트도 즉시 차감
  if(reserved && seed > 0){
    gasLog({
      k: makeLogKey_(rk, "SEED", COMPANY_ID, uid_()),
      type: "SEED",
      round: rk,
      id: COMPANY_ID,
      delta: -seed,
      bal: companyBal, // 가능하면 절대값 세팅
      meta: `seed=${seed}`
    });
  }
  return { ok:true, seed, reserved, company_balance: companyBal };
}

/* ==========================
   Bets (Server)
========================== */
async function sbFetchRoundBets(rk){
  if(!sb) return [];
  const { data, error } = await sb
    .from("roulette_bets")
    .select("id, round, player_id, amount, created_at")
    .eq("round", String(rk))
    .order("created_at", { ascending: true });

  if(error){
    console.warn("[SB] fetch error", error);
    setSyncStatus("동기화: ERROR");
    return [];
  }
  return (data || []).map(x => ({
    key: x.id,
    round: String(x.round),
    id: String(x.player_id||"").trim().toLowerCase(),
    amount: Number(x.amount)||0,
    ts: new Date(x.created_at).getTime()
  }));
}

async function sbRefreshRound(rk){
  const rows = await sbFetchRoundBets(rk);
  serverBetMap.clear();
  for(const r of rows) serverBetMap.set(r.key, r);
  setSyncStatus("동기화: LIVE");
  markUIDirty();
}

async function sbResubscribeRound(rk){
  if(!sb) return;

  const rr = String(rk);
  if(currentSubscribedRound === rr && sbChannel) return;
  currentSubscribedRound = rr;

  await sbRefreshRound(rr);

  if(sbChannel){
    try{ await sb.removeChannel(sbChannel); }catch(e){}
    sbChannel = null;
  }

  sbChannel = sb.channel("roulette_bets_" + rr)
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "roulette_bets",
      filter: `round=eq.${rr}`
    }, (payload) => {
      const n = payload.new;
      serverBetMap.set(n.id, {
        key: n.id,
        round: String(n.round),
        id: String(n.player_id||"").trim().toLowerCase(),
        amount: Number(n.amount)||0,
        ts: new Date(n.created_at).getTime()
      });
      setSyncStatus("동기화: LIVE");
      markUIDirty();
    })
    .subscribe((status) => {
      if(status === "SUBSCRIBED") setSyncStatus("동기화: LIVE");
      if(status === "CHANNEL_ERROR") setSyncStatus("동기화: ERROR");
      if(status === "TIMED_OUT") setSyncStatus("동기화: TIMEOUT");
    });
}

  ytIndex = (ytIndex - 1 + PLAYLIST.length) % PLAYLIST.length;

  updateBgmMeta();

  if(!ytPlayer || !PLAYLIST.length) return;
  let next = ytIndex;
  if(PLAYLIST.length > 1){
    while(next === ytIndex) next = Math.floor(Math.random() * PLAYLIST.length);

  ytPlayer.loadVideoById(PLAYLIST[ytIndex]);
  updateBgmMeta();

        updatePlayBtnIcon();
      }
    }
  });

  document.getElementById("pPlay").onclick = () => {
    const st = ytPlayer.getPlayerState();

    else { ytPlayer.unMute(); ytPlayer.playVideo(); }

  document.getElementById("pRand").onclick = () => { ytPlayer.unMute(); randomTrack(); };
  document.getElementById("pVol").oninput = (e)=> ytPlayer.setVolume(+e.target.value);

  window.addEventListener("resize", dockBgmBar);
}

  const hasCompany = rb.some(b => (b.id || "").toLowerCase() === COMPANY_ID);

  const base = [...rb];

  // ✅ DB에 회사 베팅이 없을 때만(=seed가 DB에 안 들어가는 구조일 때만) 화면에 seed를 얹는다
  if(seedForRound > 0 && !hasCompany){
    base.unshift({ round: roundKey, id: COMPANY_ID, amount: seedForRound, ts: Date.now() });
  }
  return aggregateById(base);
}

const canvas = document.getElementById("wheel");

// elapsedSec(초) -> rpm
function rpmByElapsed(t){
  t = Math.max(0, t|0);

  if(t <= 10)   return 0;   // 00:00~00:10
  if(t <= 240)  return 1;   // 00:11~04:00
  if(t <= 480)  return 2;   // 04:01~08:00
  if(t <= 720)  return 4;   // 08:01~12:00
  if(t <= 960)  return 8;   // 12:01~16:00
  if(t <= 1170) return 16;  // 16:01~19:30
  if(t <= 1180) return 12;  // 19:31~19:40
  if(t <= 1192) return 8;   // 19:41~19:52
  if(t <= 1194) return 4;   // 19:53~19:54
  if(t <= 1196) return 3;   // 19:55~19:56
  if(t <= 1198) return 2;   // 19:57~19:58
  if(t <= 1199) return 1;   // 19:59
  return 0;
}

function radPerSecFromRpm(rpm){
  return (rpm * 2 * Math.PI) / 60;
}

function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function hashStr(s){
  s = String(s||"");
  let h = 2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h>>>0);
}
const SEG_PALETTES = [
  {a:"#0b0f1a", b:"#39445e", c:"#05060b"},
  {a:"#081b3a", b:"#2f6bff", c:"#040a16"},
  {a:"#063426", b:"#19c7a1", c:"#041a13"},
  {a:"#2a0a2a", b:"#a76bff", c:"#120514"},
  {a:"#3a0018", b:"#d4145a", c:"#16000a"},
  {a:"#1a0f00", b:"#ffd36b", c:"#080500"},
];
function pickPalette(name){
  const idx = hashStr(name) % SEG_PALETTES.length;
  return SEG_PALETTES[idx];
}

function layoutWheelDesktop(){
  const isDesktop = matchMedia("(min-width: 981px)").matches;
  const vp = document.getElementById("wheelViewport");
  const dock = vp ? vp.querySelector(".wheelDock") : null;
  const pointer = document.getElementById("pointer");
  if(!vp || !dock || !pointer) return;

  if(!isDesktop){
    dock.style.width = "";
    dock.style.height = "";
    pointer.style.top = "";
    return;
  }

  const vpRect = vp.getBoundingClientRect();
  const size = Math.floor(Math.min(vpRect.width, vpRect.height) * 0.985);
  dock.style.width = size + "px";
  dock.style.height = size + "px";

  const tip = parseFloat(getComputedStyle(pointer).borderTopWidth) || 26;
  const dockRect = dock.getBoundingClientRect();
  const dockTopRel = dockRect.top - vpRect.top;

  const overlap = 4;
  const top = Math.max(0, Math.round(dockTopRel - tip + overlap));
  pointer.style.top = top + "px";
}

function resizeCanvas(){
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  layoutWheelDesktop();
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height= Math.floor(rect.height * dpr);
  drawWheel();
}
window.addEventListener("resize", ()=>{ resizeCanvas(); dockBgmBar(); });

function drawWheel(players = null){
  const list = players || getCurrentAggregatedPlayers();
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const R = Math.min(W,H)*0.46;

  ctx.clearRect(0,0,W,H);

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(wheelAngle);

  const grd = ctx.createLinearGradient(-R, -R, R, R);
  grd.addColorStop(0, "#8b6a00");
  grd.addColorStop(0.35, "#ffd36b");
  grd.addColorStop(0.65, "#f7b500");
  grd.addColorStop(1, "#4a3400");
  ctx.beginPath();
  ctx.arc(0,0,R*1.03,0,Math.PI*2);
  ctx.lineWidth = R*0.08;
  ctx.strokeStyle = grd;
  ctx.stroke();

  const total = Math.max(1, list.reduce((s,p)=>s+p.amount,0));
  let start = -Math.PI/2;

  for(let i=0;i<list.length;i++){
    const p = list[i];
    const frac = Math.max(0.001, p.amount/total);
    const ang = frac * Math.PI*2;

    const pal = pickPalette(p.id);
    const segGrd = ctx.createRadialGradient(0,0,R*0.18, 0,0,R*1.03);
    segGrd.addColorStop(0, pal.b);
    segGrd.addColorStop(0.62, pal.a);
    segGrd.addColorStop(1, pal.c);

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R*0.92, start, start+ang);
    ctx.closePath();
    ctx.fillStyle = segGrd;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(start)*R*0.92, Math.sin(start)*R*0.92);
    ctx.strokeStyle = "rgba(255, 208, 80, 0.14)";
    ctx.lineWidth = 2*dpr;
    ctx.stroke();

    const mid = start + ang/2;
    drawLabelOnWheel(p.id, p.amount, mid, ang, R);

    start += ang;
  }

  const cR = R*0.22;
  const ring = ctx.createLinearGradient(-cR, -cR, cR, cR);
  ring.addColorStop(0, "#3c2a00");
  ring.addColorStop(0.5, "#ffd36b");
  ring.addColorStop(1, "#5a3b00");

  ctx.beginPath();
  ctx.arc(0,0,cR*1.02,0,Math.PI*2);
  ctx.fillStyle="#000";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0,0,cR*1.02,0,Math.PI*2);
  ctx.lineWidth = cR*0.22;
  ctx.strokeStyle = ring;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0,0,cR*0.78,0,Math.PI*2);
  ctx.fillStyle="#07070b";
  ctx.fill();

  ctx.font = `${Math.floor(cR*0.55)}px Cinzel`;
  ctx.fillStyle = "#ffd36b";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.shadowColor="rgba(255, 208, 80, 0.28)";
  ctx.shadowBlur=18*dpr;
  ctx.fillText("UNIQUE", 0, 0);
  ctx.shadowBlur=0;

  ctx.restore();
}

function drawLabelOnWheel(name, amt, midAngle, segAngle, R){
  const label = displayId(name);
  const amountText = `${amt}`;

  if(segAngle < 0.06) return;

  const scale = clamp(segAngle / 0.55, 0.55, 1.0);
  const nameSize = Math.floor(clamp(R*0.055, 12*dpr, 22*dpr) * scale);
  const amtSize  = Math.floor(clamp(R*0.050, 11*dpr, 20*dpr) * scale);

  const r = R * 0.62;

  ctx.save();
  ctx.rotate(midAngle);
  ctx.translate(r, 0);
  ctx.rotate(Math.PI);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.55)";
  ctx.shadowBlur = 10*dpr;

  const maxW = R * (0.40 * scale);
  let t = label;
  ctx.font = `${nameSize}px Cinzel`;
  while(ctx.measureText(t).width > maxW && t.length > 3) t = t.slice(0, -1);
  if(t !== label) t = t.slice(0, Math.max(2, t.length-1)) + "…";

  if(segAngle < 0.18){
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.strokeStyle = "rgba(0,0,0,0.38)";
    ctx.lineWidth = 3*dpr;
    ctx.strokeText(t, 0, 0);
    ctx.fillText(t, 0, 0);
    ctx.restore();
    return;
  }

  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.strokeStyle = "rgba(0,0,0,0.38)";
  ctx.lineWidth = 3*dpr;
  ctx.strokeText(t, 0, -R*0.065*scale);
  ctx.fillText(t, 0, -R*0.065*scale);

  ctx.font = `${amtSize}px Rajdhani`;
  ctx.fillStyle = "rgba(255, 210, 130, 0.95)";
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 3*dpr;
  ctx.strokeText(amountText, 0, R*0.065*scale);
  ctx.fillText(amountText, 0, R*0.065*scale);

  ctx.restore();
}

function computeStopAngle(players, winIndex){
  const total = Math.max(1, players.reduce((s,p)=>s+p.amount,0));
  let start = -Math.PI/2;
  for(let i=0;i<players.length;i++){
    const ang = Math.max(0.001, players[i].amount/total) * Math.PI*2;
    const mid = start + ang/2;
    if(i === winIndex) return (-Math.PI/2) - mid;
    start += ang;
  }
  return 0;
}

function alignRoundStart(ms){
  return Math.floor(ms / (ROUND_SEC*1000)) * (ROUND_SEC*1000);
}
function initRound(){
  const now = Date.now();
  roundStartAt = alignRoundStart(now);
  roundEndAt = roundStartAt + ROUND_SEC*1000;
  roundKey = String(roundStartAt);
  frozenPlayers = null;
  frozenRoundKey = null;
  frozenDone = false;
  settleRequestedRoundKey = null;
}
function fmtMMSS(sec){
  sec = Math.max(0, sec|0);
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

async function startNextRound(nowMs){
  roundStartAt = alignRoundStart(nowMs);
  roundEndAt = roundStartAt + ROUND_SEC*1000;
  roundKey = String(roundStartAt);

  frozenPlayers = null;
  frozenRoundKey = null;
  frozenDone = false;

  await sbResubscribeRound(roundKey);
  await sbEnsureSeedForRound(roundKey); // ✅ 회사 seed 실제 차감/확정 + 시트 반영
  markUIDirty();
}

/* ==========================
   11) Main Loop
========================== */
function updateClockAndState(){
  try{
    const now = Date.now();

    // ✅ dt 보정(프레임마다 속도 일정)
    const perfNow = performance.now();
    let dt = (perfNow - lastFramePerf) / 1000;
    lastFramePerf = perfNow;
    dt = Math.max(0, Math.min(0.05, dt)); // 0~50ms로 캡

    let leftSec = Math.ceil((roundEndAt - now)/1000);
    if(leftSec < 0) leftSec = 0;

    const elapsedSec = Math.floor((now - roundStartAt)/1000);

    // LOCK 스냅샷(표시용)
    if(!settling && !frozenDone && leftSec <= LOCK_SEC){
      frozenDone = true;
      (async ()=>{
        try{
          await sbRefreshRound(roundKey);
          frozenPlayers = getCurrentAggregatedPlayers();
          frozenRoundKey = roundKey;
          markUIDirty();
        }catch(e){
          console.warn("[FREEZE SNAPSHOT] error", e);
        }
      })();
    }

    // ✅ 라운드 종료(20:00) → 정산 시작(오버레이 유지) → 결과 받으면 즉시 다음 라운드로
    if(!settling && now >= roundEndAt){
      settling = true;
      wheelRunning = false;

      // 정산 대기 화면(즉시 띄우기)
      if(lastWinnerInfo){
        ensureWinnerOverlay(lastWinnerInfo.winner, lastWinnerInfo.payout, lastWinnerInfo.fee, lastWinnerInfo.total);
      }else{
        ensureWinnerOverlay("SETTLING...", 0, 0, 0);
      }

      const players = (frozenPlayers && frozenRoundKey === roundKey)
        ? frozenPlayers
        : getCurrentAggregatedPlayers();

      if(settleRequestedRoundKey !== roundKey){
        settleRequestedRoundKey = roundKey;

        (async ()=>{
          const res = await sbSettleRound(roundKey);

          if(!res){
            lastWinnerInfo = { winner:"SETTLE ERROR", payout:0, fee:0, total:0 };
            ensureWinnerOverlay("SETTLE ERROR", 0, 0, 0);
            markUIDirty();

            // 에러여도 다음 라운드로 넘어가게
            await startNextRound(Date.now()).catch(()=>{});
            settling = false;
            return;
          }

          const winner = String(res.winner_id || "").trim().toLowerCase();
          const total  = Number(res.total)||0;
          const fee    = Number(res.fee)||0;
          const payout = Number(res.payout)||0;
          const seed   = Number(res.seed)||0;

          // 서버가 준 seed 있으면 UI도 고정
          if(Number.isFinite(seed)) seedForRound = Math.max(0, seed);

          const companyBal = (res.company_balance === undefined || res.company_balance === null)
            ? null : Math.max(0, Number(res.company_balance)||0);
          const winnerBal = (res.winner_balance === undefined || res.winner_balance === null)
            ? null : Math.max(0, Number(res.winner_balance)||0);

          // ✅ GAS 로그 (정산 3개: SETTLE / FEE / PAYOUT)
          const settleK = makeLogKey_(roundKey, "SETTLE", uid_());
          gasLog({
            k: settleK,
            type: "SETTLE",
            round: roundKey,
            id: "",
            delta: 0,
            bal: "",
            meta: JSON.stringify({ winner, total, fee, payout, seed })
          });
          if(fee > 0){
            gasLog({
              k: settleK + "|FEE",
              type: "FEE",
              round: roundKey,
              id: COMPANY_ID,
              delta: +fee,
              bal: companyBal,
              meta: `fee=${fee}`
            });
          }
          if(payout > 0){
            gasLog({
              k: settleK + "|PAYOUT",
              type: "PAYOUT",
              round: roundKey,
              id: winner,
              delta: +payout,
              bal: winnerBal,
              meta: `payout=${payout}`
            });
          }

          // 바늘 위치 고정(표시용)
          const winIndex = players.findIndex(p => String(p.id).toLowerCase() === winner);
          if(winIndex >= 0) wheelAngle = computeStopAngle(players, winIndex);
          else wheelAngle = 0;

          // ✅ “전판 우승자” 저장 + 오버레이 업데이트
          lastWinnerInfo = { winner, payout, fee, total };
          ensureWinnerOverlay(winner, payout, fee, total);

          // 내 지갑 최신값 동기화
          walletBalance = await sbFetchWallet(MY_ID);
          markUIDirty();

          // ✅ 바로 다음 라운드로(20분 컷은 alignRoundStart가 유지)
          await startNextRound(Date.now()).catch(()=>{});
          settling = false;
        })();
      }
    }

    // ✅ 시작 10초: 전판 우승자 화면 + 0rpm
    const introPhase = (elapsedSec <= INTRO_SEC);

    // 오버레이 on/off
    if(settling || introPhase){
      if(lastWinnerInfo){
        ensureWinnerOverlay(lastWinnerInfo.winner, lastWinnerInfo.payout, lastWinnerInfo.fee, lastWinnerInfo.total);
      }else{
        ensureWinnerOverlay("WAITING", 0, 0, 0);
      }
    }else{
      ensureWinnerOverlayOff();
    }

    // TIME LEFT 표시
    const timeEl = document.getElementById("timeLeft");
    if(leftSec <= 60){
      timeEl.textContent = String(Math.max(0,leftSec));
      timeEl.className = "countBig countWarn";
      if(leftSec <= 10) timeEl.className = "countBig countFinal";
    }else{
      timeEl.textContent = fmtMMSS(leftSec);
      timeEl.className = "countBig";
    }

    // 베팅 잠금(기존 유지): 종료 60초 전만 잠금
    bettingLocked = (leftSec <= LOCK_SEC);
    setBettingUI(!bettingLocked);

    const playersForDisplay = (frozenPlayers && frozenRoundKey === roundKey)
      ? frozenPlayers
      : getCurrentAggregatedPlayers();

    // ✅ RPM 스케줄 적용(소개 10초는 0rpm)
    const rpm = rpmByElapsed(elapsedSec);

    wheelRunning = (!settling && !introPhase && leftSec > 0 && rpm > 0);
    if(wheelRunning){
      wheelAngle += radPerSecFromRpm(rpm) * dt;
    }

    drawWheel(playersForDisplay);
    refreshUI(playersForDisplay);

  }catch(err){
    console.error("[UI LOOP ERROR]", err);
  }finally{
    requestAnimationFrame(updateClockAndState);
  }
}


/* ==========================
   Theme Switch (원본 유지)
========================== */
(function(){
  const KEY = "unique_bg_theme";
  const host = document.body;
  const wrap = document.getElementById("themeBar");
  if(!wrap) return;

  function setTheme(n){
    host.setAttribute("data-bg", String(n));
    localStorage.setItem(KEY, String(n));
    [...wrap.querySelectorAll("button[data-bg]")].forEach(b=>{
      b.classList.toggle("active", b.dataset.bg === String(n));
    });
  }

  wrap.addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-bg]");
    if(!btn) return;
    setTheme(btn.dataset.bg);
  });

  setTheme(localStorage.getItem(KEY) ?? "0");
})();

/* ==========================
   init
========================== */
async function init(){
  if(!SB_ENABLED){
    setSyncStatus("동기화: OFF (SUPABASE REQUIRED)");
    setBettingUI(false);
    return;
  }

  initRound();
  resizeCanvas();

  setSyncStatus("동기화: CONNECTING...");

  // ✅ 1) 시트 원장 잔액 읽기 (나 + 회사)
  const sheetBalMe = await gasGetBalance(MY_ID);
  const sheetBalCompany = await gasGetBalance(COMPANY_ID);

  // ✅ 2) Supabase 지갑을 시트로 스냅샷 동기화
  await sbSetWalletBalance(COMPANY_ID, sheetBalCompany);
  const meSync = await sbSetWalletBalance(MY_ID, sheetBalMe);
  setWalletLocal(meSync.ok ? meSync.balance : sheetBalMe);

  // ✅ 3) 지갑 실시간 구독
  walletBalance = await sbFetchWallet(MY_ID);
  await sbSubscribeWallet(MY_ID);

  // ✅ 4) 라운드 구독 + 회사 seed 확정(실제 차감)
  await sbResubscribeRound(roundKey);
  await sbEnsureSeedForRound(roundKey);

  sbStartPolling();

  markUIDirty();
  refreshUI(null, true);
  requestAnimationFrame(updateClockAndState);
}
init();
</script>
