<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>THE UNIQUE SLOT - CYBERPUNK NEON</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* === [DESIGN V3: ULTRA CYBERPUNK PURPLE NEON] === */
    :root {
      --neon-cyan: #00f3ff;
      --neon-purple: #c600ff; /* 메인 테마색: 강렬한 퍼플 */
      --neon-pink: #ff00cc;
      --neon-gold: #ffd700;
      
      --bg-dark: #050208;
      /* 유리 질감도 보라색 틴트 추가 */
      --glass-panel: rgba(30, 10, 40, 0.5); 
      --glass-lcd: rgba(20, 5, 30, 0.6);
    }
 
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
  margin: 0; padding: 0;
  background-color: var(--bg-dark);
  color: white; font-family: 'Rajdhani', sans-serif;

  /* 스크롤 허용 코드 */
  overflow-x: hidden;
  overflow-y: auto; 
  min-height: 100vh;

  display: flex; justify-content: center; align-items: center;
}

    /* 배경: 어둡게 눌러서 네온이 돋보이게 */
    #game-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center; z-index: -2;
      filter: brightness(0.5) contrast(1.2) hue-rotate(20deg); /* 보라색 느낌 강조 */
      background-color: #000;
      transition: background-image 0.2s ease-in-out;
    }
    
    /* 사이버 그리드: 퍼플 베이스로 변경 */
    .cyber-grid {
      position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
      background: 
        linear-gradient(transparent 95%, rgba(198, 0, 255, 0.1) 96%, transparent 97%), /* 퍼플 라인 */
        linear-gradient(90deg, transparent 95%, rgba(0, 243, 255, 0.05) 96%, transparent 97%); /* 시안 라인(보조) */
      background-size: 60px 60px;
      transform: perspective(600px) rotateX(60deg);
      animation: gridMove 20s linear infinite; z-index: -1;
    }
    @keyframes gridMove { 0% { transform: perspective(600px) rotateX(60deg) translateY(0); } 100% { transform: perspective(600px) rotateX(60deg) translateY(60px); } }

    #game-container {
      width: 100%; max-width: 550px; height: 100%; max-height: 100vh;
      display: flex; flex-direction: column;
      padding: 15px; position: relative; justify-content: center; gap: 15px;
    }

    /* --- 1. 상단 헤더 & 잭팟 --- */
    .top-section {
      flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px;
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 15px;
      background: rgba(255,255,255,0.03); 
      border: 1px solid rgba(198, 0, 255, 0.2); /* 퍼플 테두리 */
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(198, 0, 255, 0.1) inset;
    }

    .btn-go-main {
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
      color: #fff; padding: 8px 18px; border-radius: 25px;
      font-size: 0.9rem; font-weight: 800; text-decoration: none;
      box-shadow: 0 0 15px rgba(198, 0, 255, 0.5);
      border: 1px solid rgba(255,255,255,0.3);
      transition: 0.2s; letter-spacing: 1px;
    }
    .btn-go-main:active { transform: scale(0.95); filter: brightness(1.2); }

    .user-info {
      font-size: 1.1rem; font-weight: bold; color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    /* 잭팟 패널: 골드 + 퍼플 조합 */
    .jackpot-panel {
      background: rgba(10, 0, 20, 0.4); /* 어두운 보라색 배경 */
      border: 2px solid rgba(255, 215, 0, 0.6); border-radius: 16px;
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: center; gap: 20px;
      /* 골드와 퍼플 빛이 섞인 그림자 */
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), 0 0 15px rgba(198, 0, 255, 0.3) inset;
      position: relative; overflow: hidden;
    }
    .jackpot-panel::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,215,0,0.2) 50%, transparent 60%);
      animation: shine 3s infinite; pointer-events: none;
    }
    @keyframes shine { 0% { transform: translate(-100%, -100%) rotate(45deg); } 100% { transform: translate(100%, 100%) rotate(45deg); } }

    .jp-star {
      font-size: 3rem; 
      background: linear-gradient(to bottom, #fff7e0, #ffd700, #b38728);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255,215,0,0.8));
      animation: pulseStar 1.5s infinite alternate;
    }
    @keyframes pulseStar { from { transform: scale(1); filter: drop-shadow(0 0 5px gold); } to { transform: scale(1.15); filter: drop-shadow(0 0 20px gold); } }

    .jp-text-group { text-align: left; }
    .jp-label { 
      font-size: 0.95rem; font-weight: 800; letter-spacing: 3px; margin-bottom: 2px;
      color: var(--neon-purple); text-shadow: 0 0 5px var(--neon-purple);
    }
    .jp-amount {
      font-size: 3.2rem; font-weight: 900; line-height: 1;
      background: linear-gradient(to bottom, #ffffff, #ffd700, #ffaa00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
    }
    .unit { font-size: 1.4rem; color: var(--neon-gold); margin-left: 8px; text-shadow: 0 0 10px var(--neon-gold); -webkit-text-fill-color: initial; }

    /* --- 2. [핵심] 슬롯 머신 프레임 (두꺼운 퍼플 네온) --- */
    .machine-frame {
      flex: 0 0 auto; width: 100%;
      aspect-ratio: 5 / 4.8; max-height: 50vh;
      position: relative;
      /* 내부 배경 */
      background: rgba(5, 0, 10, 0.5); 
      
      /* [핵심] 두꺼운 네온 테두리 및 강렬한 빛 번짐 효과 */
      border: 5px solid var(--neon-purple); /* 실제 튜브 두께 */
      border-radius: 20px; /* 둥근 튜브 느낌 */
      box-shadow: 
        0 0 15px var(--neon-purple),       /* 1차 밝은 빛 */
        0 0 40px rgba(198, 0, 255, 0.6),   /* 2차 중간 빛 */
        0 0 80px rgba(198, 0, 255, 0.3),   /* 3차 넓은 확산광 */
        inset 0 0 30px rgba(198, 0, 255, 0.4); /* 내부 반사광 */
        
      overflow: hidden;
    }
    #slot-canvas { width: 100%; height: 100%; display: block; }
    /* 승리 라인도 퍼플/골드로 변경 */
    .win-line {
      position: absolute; top: 50%; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, transparent, var(--neon-gold), var(--neon-purple), transparent);
      box-shadow: 0 0 25px var(--neon-purple);
      transform: translateY(-50%); display: none; z-index: 10;
      filter: blur(1px);
    }

    /* --- 3. 컨트롤 덱 (버튼 디자인 업그레이드) --- */
    .control-deck {
      flex: 1 0 auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 15px;
      background: var(--glass-panel);
      border-top: 3px solid var(--neon-purple); /* 상단 테두리도 퍼플 */
      border-radius: 25px 25px 0 0;
      padding: 20px 20px 30px 20px;
      box-shadow: 0 -10px 40px rgba(198, 0, 255, 0.2); /* 상단 퍼플 그림자 */
      position: relative;
    }

    /* 정보창 (LCD) */
    .info-lcd {
      background: var(--glass-lcd);
      border: 1px solid rgba(198, 0, 255, 0.3); /* 퍼플 테두리 */
      border-radius: 12px; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .msg-area { font-size: 1.2rem; color: #e0e0e0; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .msg-area.win { color: var(--neon-gold); text-shadow: 0 0 15px var(--neon-gold); animation: blink 0.5s infinite; }
    
    .wallet-area { text-align: right; }
    .wallet-lbl { font-size: 0.75rem; color: var(--neon-purple); font-weight: 700; letter-spacing: 1px; margin-bottom: 3px;}
    .wallet-val { font-size: 1.8rem; color: var(--neon-cyan); font-weight: 800; text-shadow: 0 0 10px rgba(0, 243, 255, 0.6); }

    /* 상단 버튼 줄 */
    .btn-row-top {
      display: flex; justify-content: space-between; align-items: stretch;
      gap: 12px; height: 60px;
    }

    /* 공통 버튼 스타일 (더 입체적이고 고급스럽게) */
    .cyber-btn {
      border: none; outline: none; cursor: pointer;
      font-family: 'Rajdhani', sans-serif; font-weight: 800;
      border-radius: 14px; color: #e0e0e0;
      transition: all 0.15s ease-out; position: relative; overflow: hidden;
      text-transform: uppercase;
    }
    .cyber-btn:active { transform: scale(0.96); }

    /* [업그레이드] 기능 버튼 (Sound, Auto) - 어두운 보라색 유리 질감 */
    .btn-func {
      width: 80px; font-size: 0.85rem; line-height: 1.2;
      background: linear-gradient(145deg, rgba(40, 10, 50, 0.8), rgba(20, 5, 30, 0.9));
      border: 2px solid rgba(198, 0, 255, 0.3);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      color: rgba(255,255,255,0.7);
    }
    /* 활성화시 강렬한 퍼플/시안 빛 */
    .btn-func.active {
      background: linear-gradient(145deg, var(--neon-purple), #9900cc);
      border: 2px solid var(--neon-cyan);
      color: #fff;
      box-shadow: 0 0 25px rgba(198, 0, 255, 0.8), inset 0 0 10px rgba(255,255,255,0.3);
      text-shadow: 0 0 5px #fff;
    }

    /* [업그레이드] 베팅 컨트롤 */
    .bet-control {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--glass-lcd); padding: 6px; border-radius: 16px;
      border: 2px solid rgba(198, 0, 255, 0.3);
    }
    .btn-step {
      width: 50px; height: 100%; font-size: 1.8rem;
      background: linear-gradient(145deg, rgba(60, 20, 80, 0.8), rgba(30, 10, 50, 0.9));
      border: 1px solid rgba(198, 0, 255, 0.4); color: var(--neon-purple);
    }
    .btn-step:active { background: var(--neon-purple); color: #fff; box-shadow: 0 0 15px var(--neon-purple); }

    .bet-display { flex: 1; text-align: center; }
    .bet-lbl { font-size: 0.7rem; color: var(--neon-purple); letter-spacing: 1px; }
    .bet-val { font-size: 1.6rem; color: var(--neon-gold); font-weight: 900; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

    /* [업그레이드] 스핀 버튼 (크고 아름답게) */
    .spin-container { width: 100%; height: 90px; /* 높이 증가 */ }
    .btn-spin {
      width: 100%; height: 100%;
      /* 골드 -> 퍼플 -> 핑크의 화려한 그라데이션 */
      background: linear-gradient(90deg, #ff9a00, var(--neon-purple), #ff0055);
      background-size: 200% 200%;
      animation: spinGradient 3s ease infinite;
      
      color: #fff; font-size: 3rem; font-weight: 900; letter-spacing: 6px;
      border: 3px solid rgba(255,255,255,0.4); border-radius: 18px;
      text-shadow: 0 3px 10px rgba(0,0,0,0.5);
      /* 강력한 퍼플 빛 번짐 */
      box-shadow: 0 0 40px rgba(198, 0, 255, 0.6), inset 0 3px 5px rgba(255,255,255,0.5);
    }
    @keyframes spinGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .btn-spin:active { transform: scale(0.97); box-shadow: 0 0 20px rgba(198, 0, 255, 0.8); }
    .btn-spin:disabled { filter: grayscale(1) brightness(0.5); cursor: not-allowed; animation: none; }

    /* 잭팟 오버레이 (스타일 유지) */
    #jackpot-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 100;
      display: none; justify-content: center; align-items: center; flex-direction: column;
    }
    #jackpot-overlay.show { display: flex; animation: fadeIn 0.3s; }
    .jp-title { 
      font-size: 5rem; margin: 0;
      background: linear-gradient(to bottom, #fff7e0, #ffd700, #b38728);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: pulse 0.3s infinite alternate; 
      filter: drop-shadow(0 0 30px #b38728);
    }
    .jp-win { font-size: 4rem; color: #fff; text-shadow: 0 0 30px var(--neon-cyan); margin-top: 20px; font-weight: 900; }
    .coin { position: absolute; width: 50px; height: 50px; background: gold; border-radius: 50%; animation: fall linear infinite; z-index: -1; border: 3px solid #fff; box-shadow: 0 0 15px gold;}
    
    @keyframes fall { to { transform: translateY(120vh) rotate(360deg); } }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
    @keyframes blink { 50% { opacity: 0.5; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 모바일 최적화 */
    @media (max-width: 420px) {
      #game-container { padding: 10px; gap: 10px; }
      .header-bar { padding: 5px 10px; }
      .btn-go-main { padding: 6px 12px; font-size: 0.8rem; }
      .user-info { font-size: 1rem; }
      .jackpot-panel { padding: 8px 15px; gap: 10px; }
      .jp-star { font-size: 2.2rem; }
      .jp-amount { font-size: 2.2rem; }
      .unit { font-size: 1rem; }
      
      .control-deck { padding: 15px 10px 20px 10px; }
      .btn-row-top { height: 50px; }
      .btn-func { width: 65px; font-size: 0.75rem; }
      .btn-step { width: 40px; font-size: 1.4rem; }
      .bet-val { font-size: 1.3rem; }
      
      .spin-container { height: 75px; }
      .btn-spin { font-size: 2.2rem; letter-spacing: 3px; }
    }
  </style>
</head>
<body>

  <div id="game-bg"></div>
  <div class="cyber-grid"></div>

  <div id="jackpot-overlay">
    <h1 class="jp-title">JACKPOT!</h1>
    <div class="jp-win" id="jp-ani-amount">0</div>
    <div id="coin-container"></div>
  </div>

  <div id="game-container">
    
    <div class="top-section">
      <div class="header-bar">
        <a href="https://wordycow.github.io/so.t-leader-choice/the-unique-main.html" class="btn-go-main">GO MAIN</a>
        <div class="user-info" id="user-id">GUEST</div>
      </div>
      
      <div class="jackpot-panel">
        <div class="jp-star">★</div>
        <div class="jp-text-group">
          <span class="jp-label">JACKPOT POOL</span>
          <span class="jp-amount"><span id="jackpot-pool">...</span> <span class="unit">UT</span></span>
        </div>
      </div>
    </div>

    <div class="machine-frame" id="machine-frame">
      <canvas id="slot-canvas"></canvas>
      <div class="win-line"></div>
    </div>

    <div class="control-deck">
      <div class="info-lcd">
        <div class="msg-area" id="status-msg" style="display:flex; align-items:center; justify-content:center; height:100%;">READY</div>
        <div class="wallet-area">
          <span class="wallet-lbl">MY WALLET</span>
          <span class="wallet-val" id="wallet-balance">0</span>
        </div>
      </div>

      <div class="btn-row-top">
        <button id="btn-sound" class="cyber-btn btn-func">SOUND<br>OFF</button>
        
        <div class="bet-control">
          <button id="btn-bet-minus" class="cyber-btn btn-step">-</button>
          <div class="bet-display">
            <div class="bet-lbl">BET</div>
            <div class="bet-val" id="current-bet">10</div>
          </div>
          <button id="btn-bet-plus" class="cyber-btn btn-step">+</button>
        </div>

        <button id="btn-auto" class="cyber-btn btn-func">AUTO<br>OFF</button>
      </div>

      <div class="spin-container">
        <button id="btn-spin" class="cyber-btn btn-spin">SPIN</button>
      </div>
    </div>

  </div>

  <script>
    const CONFIG = {
      API_URL: "https://script.google.com/macros/s/AKfycbxtdOVoV2PtB_UbCLu2OzZHo6JjNks-0gk4s2fci52HjuuBNy3uwuf7DP7ePTK7S6VI/exec",
      imgObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/img/slot/',
        bg: ['bg1.png', 'bg2.png', 'bg3.png', 'bg4.png', 'bg5.png'],
        symbols: [
          'star1.png','star2.png','star3.png',
          'pro1.png','pro2.png','pro3.png','pro4.png','pro5.png','pro6.png','pro7.png',
          'pro8.png','pro9.png','pro10.png'
        ]
      },
      soundObj: {
        path: 'https://wordycow.github.io/so.t-leader-choice/games/sounds/',
        spin: 'spinning-sound.MP3',
        stop: 'stop-stop-stop-sound.MP3',
        win: 'win-sound.MP3',
        lose: 'lose-sound.MP3',
        jackpot: 'jackpot-sound.MP3',
        btn: 'start-button-sound.MP3'
      },
      reels: 5,
      rows: 5 
    };

    const SYMBOL_ALIAS = {
      "1":"star1","A":"star1","2":"star2","3":"star3","4":"pro1","5":"pro2","6":"pro3",
      "7":"pro4","8":"pro5","9":"pro6","10":"pro7","11":"pro8","J":"pro8","12":"pro9","Q":"pro9","13":"pro10","K":"pro10"
    };

    // [수정] 심플하고 고급스러운 네이밍 (로마자 표기)
    const SYMBOL_INFO = {
      "star1": "STAR I",
      "star2": "STAR II",
      "star3": "STAR III",
      
      "pro1":  "PRO I",
      "pro2":  "PRO II",
      "pro3":  "PRO III",
      "pro4":  "PRO IV",
      "pro5":  "PRO V",
      "pro6":  "PRO VI",
      "pro7":  "PRO VII",
      "pro8":  "PRO VIII",
      "pro9":  "PRO IX",
      "pro10": "PRO X"
    };

    let state = {
      id: null, wallet: 0, bet: 10, isSpinning: false, audioEnabled: false, isAuto: false, jackpotPool: 0,
      bgIntervalId: null, bgIdx: 0, isGuest: false
    };

    let els = {};
    const audios = {};
    const SlotCanvasImages = {};

    const SlotCanvas = (() => {
      const buffer = 3;
      let canvas, ctx;
      let dpr = 1;
      let cw = 0, ch = 0;
      let reelW = 0, sym = 0, xPad = 0, yPad = 0;
      let reels = [];
      let raf = null, last = 0, running = false;
      let onAllStopped = null, onReelStopped = null;

      const baseNames = CONFIG.imgObj.symbols.map(f => f.replace(".png",""));

      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
      function easeOutBack(t){ const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
      function keyToBaseName(key){
        if (key == null) return randBase();
        const s = String(key).trim();
        if (SYMBOL_ALIAS[s]) return SYMBOL_ALIAS[s];
        if (baseNames.includes(s)) return s;
        if (s.endsWith(".png")) return s.replace(".png","");
        return randBase();
      }
      function randBase(){ return baseNames[(Math.random() * baseNames.length) | 0]; }

      function makeReel(i){
        return {
          i, symbols: [], offset: 0, speed: 0, mode: "idle",
          startAt: 0, stopAt: 0, final: null,
          decelStart: 0, decelDur: 600,
          speedStart: 0, speedEnd: 200,
          snapStart: 0, snapDur: 400, snapFrom: 0
        };
      }

      function fillReel(r){
        const need = CONFIG.rows + buffer * 2 + 5;
        r.symbols = [];
        for (let k=0;k<need;k++) r.symbols.push(randBase());
        r.offset = Math.random() * (sym || 1);
      }

      function resize(){
        if (!canvas) return;
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const rect = canvas.getBoundingClientRect();
        const newW = Math.floor(rect.width * dpr);
        const newH = Math.floor(rect.height * dpr);
        if (newW === cw && newH === ch) return;
        const oldSym = sym || 1;
        cw = newW; ch = newH;
        canvas.width = cw; canvas.height = ch;
        reelW = cw / CONFIG.reels;
        sym = Math.floor(Math.min(reelW, ch / CONFIG.rows)); 
        xPad = Math.floor((reelW - sym) / 2);
        yPad = Math.floor((ch - sym * CONFIG.rows) / 2);
        reels.forEach(r => { r.offset = (r.offset / oldSym) * sym; });
      }

      function init(c, hooks={}){
        canvas = c;
        ctx = canvas.getContext("2d", { alpha: true });
        reels = [];
        for (let i=0;i<CONFIG.reels;i++) reels.push(makeReel(i));
        resize();
        reels.forEach(fillReel);
        onReelStopped = hooks.onReelStopped || null;
      }

      function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
      function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=null; }

      function startSpin(){
        const now = performance.now();
        reels.forEach((r, i) => {
          r.mode = "wait";
          r.startAt = now + i * 80; 
          r.stopAt = 0; r.final = null; r.speed = 0;
        });
        start();
      }

      function scheduleStop(keys, doneCb){
        const now = performance.now();
        onAllStopped = doneCb;
        for (let col=0; col<CONFIG.reels; col++){
          // 3-row 시각화 (서버는 25개 keys를 주지만, 캔버스는 3줄만 그림)
          reels[col].final = [
             randBase(), 
             keyToBaseName(keys[col]),       // Row 0
             keyToBaseName(keys[col + 5]),   // Row 1
             keyToBaseName(keys[col + 10]),  // Row 2
             randBase()
          ]; 
          reels[col].stopAt = now + 800 + col * 350; 
        }
      }

      function abortToIdle(){ reels.forEach(r => { r.mode = "idle"; r.speed = 0; r.final = null; }); }

      function update(dt, now){
        for (const r of reels){
          if (r.mode === "wait" && now >= r.startAt) { r.mode = "spin"; r.speed = 1500 + r.i * 200; }
          if (r.mode === "spin"){
            r.speed = Math.min(3500, r.speed + 2000 * dt);
            if (r.stopAt && now >= r.stopAt){
              r.mode = "decel"; r.decelStart = now; r.speedStart = r.speed; r.speedEnd = 200;
            }
          }
          if (r.mode === "decel"){
            const p = Math.min(1, (now - r.decelStart) / r.decelDur);
            r.speed = r.speedStart + (r.speedEnd - r.speedStart) * easeOutCubic(p);
            if (p >= 1){
              if (r.final){
                for(let k=0; k<CONFIG.rows; k++) {
                   if(r.final[k]) r.symbols[buffer + k] = r.final[k];
                }
              }
              r.mode = "snap"; r.snapStart = now; r.snapFrom = r.offset; r.speed = 0;
            }
          }
          if (r.mode === "spin" || r.mode === "decel"){
            r.offset += r.speed * dt;
            while (r.offset >= sym){
              r.offset -= sym;
              r.symbols.pop(); r.symbols.unshift(randBase()); 
            }
          }
          if (r.mode === "snap"){
            const p = Math.min(1, (now - r.snapStart) / r.snapDur);
            r.offset = r.snapFrom + (0 - r.snapFrom) * easeOutBack(p);
            if (p >= 1){
              r.offset = 0; r.mode = "stopped";
              if (typeof onReelStopped === "function") onReelStopped(r.i);
            }
          }
        }
      }

      function draw(){
        if (!ctx) return;
        ctx.clearRect(0,0,cw,ch);
        // 캔버스 배경도 투명하게 (0.1 alpha)
        ctx.save(); ctx.globalAlpha = 0.1; ctx.fillStyle = "#000"; ctx.fillRect(0,0,cw,ch); ctx.restore();

        for (const r of reels){
          const rx = r.i * reelW;
          ctx.save(); ctx.beginPath(); ctx.rect(rx, 0, reelW, ch); ctx.clip();
          if (r.mode === "spin" && r.speed > 1800) ctx.filter = "blur(2px)"; else ctx.filter = "none";
          for (let i=0;i<r.symbols.length;i++){
            const base = r.symbols[i];
            const img = SlotCanvasImages[base];
            const x = rx + xPad;
            const y = yPad + ((i - buffer) * sym) + r.offset; 
            if (y > -sym && y < ch + sym){
              if (img && img.complete) ctx.drawImage(img, x, y, sym, sym);
              else { ctx.fillStyle = "#111"; ctx.fillRect(x, y, sym, sym); }
            }
          }
          ctx.restore();
          // 릴 구분선 (더 얇고 은은하게)
          ctx.save(); ctx.strokeStyle = "rgba(198, 0, 255, 0.1)"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, ch); ctx.stroke(); ctx.restore();
        }
      }

      function loop(now){
        const dt = Math.min(0.05, (now - last)/1000); last = now;
        update(dt, now); draw();
        if (reels.every(r => r.mode === "stopped" || r.mode === "idle") && onAllStopped){
          const cb = onAllStopped; onAllStopped = null; cb();
        }
        raf = requestAnimationFrame(loop);
      }
      return { init, resize, startSpin, scheduleStop, abortToIdle, stop };
    })();

    async function init() {
      console.log("THE UNIQUE: CYBERPUNK NEON V3");
      els = {
        bg: document.getElementById('game-bg'), 
        machineFrame: document.getElementById('machine-frame'), canvas: document.getElementById('slot-canvas'),
        spinBtn: document.getElementById('btn-spin'), autoBtn: document.getElementById('btn-auto'), soundBtn: document.getElementById('btn-sound'),
        walletSpan: document.getElementById('wallet-balance'), jackpotPool: document.getElementById('jackpot-pool'),
        betSpan: document.getElementById('current-bet'), statusMsg: document.getElementById('status-msg'),
        plus: document.getElementById('btn-bet-plus'), minus: document.getElementById('btn-bet-minus'),
        userId: document.getElementById('user-id'),
        jpOverlay: document.getElementById('jackpot-overlay'), jpAmount: document.getElementById('jp-ani-amount'), coinBox: document.getElementById('coin-container')
      };

      els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`;

      const localId = localStorage.getItem('user_id') || localStorage.getItem('loginId') || localStorage.getItem('id');
      const paramId = new URLSearchParams(window.location.search).get('id');
      
      if (paramId) state.id = paramId;
      else if (localId) state.id = localId;
      else state.id = null;

      if (!state.id) {
        state.isGuest = true;
        els.userId.innerText = "GUEST";
        els.spinBtn.disabled = false;
        setStatus("WELCOME GUEST");
      } else {
        state.isGuest = false;
        els.userId.innerText = state.id;
        await syncUserData();
      }

      for(let k in CONFIG.soundObj){
        if(k!=='path') try{ audios[k] = new Audio(CONFIG.soundObj.path + CONFIG.soundObj[k]); if(k==='spin') audios[k].loop=true; }catch(e){}
      }

      await preloadSymbolImages();

      SlotCanvas.init(els.canvas, {
        onReelStopped: () => {
          if (state.audioEnabled && audios.stop) {
            const s = audios.stop.cloneNode(); s.volume = 0.8; s.play().catch(()=>{});
          }
        }
      });

      window.addEventListener("resize", () => SlotCanvas.resize());
      new ResizeObserver(()=>SlotCanvas.resize()).observe(els.machineFrame);

      els.spinBtn.addEventListener('click', ()=>{ 
        if (state.isGuest) {
          window.location.href = "https://wordycow.github.io/so.t-leader-choice/the-unique-gate.html";
          return;
        }
        state.isAuto=false; updateAutoBtn(); onSpinClick(); 
      });

      els.plus.addEventListener('click', ()=>changeBet(5));
      els.minus.addEventListener('click', ()=>changeBet(-5));
      els.soundBtn.addEventListener('click', ()=>toggleSound(!state.audioEnabled));
      els.autoBtn.addEventListener('click', toggleAuto);
      els.jpOverlay.addEventListener('click', closeJackpot);

      updateUI();
    }

    async function preloadSymbolImages(){
      const bases = CONFIG.imgObj.symbols.map(f => f.replace(".png",""));
      const jobs = bases.map(base => new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve([base, img]);
        img.onerror = () => resolve([base, null]);
        img.src = CONFIG.imgObj.path + base + ".png";
      }));
      const res = await Promise.all(jobs);
      for(const [b, i] of res) if(i) SlotCanvasImages[b] = i;
    }

    function toggleSound(st){
      state.audioEnabled = st;
      els.soundBtn.innerHTML = st ? "SOUND<br>ON" : "SOUND<br>OFF";
      els.soundBtn.classList.toggle("active", st);
      if(!st) Object.values(audios).forEach(a=>a.pause());
      else if(audios.btn) audios.btn.play().catch(()=>{});
    }

    function toggleAuto(){ 
      if(state.isGuest) return; 
      state.isAuto = !state.isAuto; updateAutoBtn(); 
      if(state.isAuto && !state.isSpinning) onSpinClick(); 
    }
    function updateAutoBtn(){ 
      els.autoBtn.innerHTML = state.isAuto ? "AUTO<br>ON" : "AUTO<br>OFF"; 
      els.autoBtn.classList.toggle("active", state.isAuto); 
    }

    function setStatus(msg, isWin){ 
      // 단순 텍스트일 경우 (READY, SPINNING 등)
      els.statusMsg.innerHTML = `<span style="color:${isWin?'var(--neon-gold)':'#555'}; font-weight:700; font-size:1.1rem;">${msg}</span>`; 
      els.statusMsg.className = isWin ? "msg-area win" : "msg-area"; 
    }

    async function syncUserData(ani){
      if(!state.id) return;
      try {
        const res = await jsonpRequest('getSlotState', { id: state.id });
        if(res.ok){
          const nb = Number(res.user.balance);
          state.jackpotPool = Number(res.jackpotTotal);
          if(ani) animateValue(els.walletSpan, state.wallet, nb, 1000);
          else els.walletSpan.innerText = nb.toLocaleString();
          state.wallet = nb;
          updateUI();
          if(!ani) setStatus("READY");
          els.spinBtn.disabled = false;
        }
      } catch(e) { setStatus("NETWORK ERROR"); }
    }

    async function onSpinClick(){
      if(state.isSpinning) return;
      if(state.wallet < state.bet) { state.isAuto=false; updateAutoBtn(); alert("잔액 부족"); return; }

      state.isSpinning = true; els.spinBtn.disabled = true; setStatus("SPINNING...");
      animateValue(els.walletSpan, state.wallet, state.wallet - state.bet, 500); state.wallet -= state.bet;

      if(state.audioEnabled && audios.spin){ audios.spin.currentTime=0; audios.spin.volume=0.6; audios.spin.play().catch(()=>{}); }
      
      startBgEffect(150);
      SlotCanvas.startSpin();

      try {
        const res = await jsonpRequest('slotSpin', { id: state.id, bet: state.bet });
        if(!res.ok) throw new Error();
        SlotCanvas.scheduleStop(res.spin.keys, () => handleSpinEnd(res));
      } catch(e) {
        if(state.audioEnabled) audios.spin.pause();
        SlotCanvas.abortToIdle();
        state.isSpinning = false; els.spinBtn.disabled = false;
        syncUserData();
      }
    }

    function handleSpinEnd(data){
      state.isSpinning = false; stopBgEffect();
      if(state.audioEnabled) audios.spin.pause();
      els.spinBtn.disabled = false;

      const spin = data.spin;
      
      let isWin = false;
      let msgHTML = "TRY AGAIN";

      if(spin.kind !== "lose"){
        isWin = true;
        
        const symKey = spin.winSymbol; 
        const cnt = spin.winCount;     
        const amt = Number(spin.payout).toLocaleString();
        
        const imgUrl = CONFIG.imgObj.path + symKey + ".png";
        const symName = SYMBOL_INFO[symKey] || symKey.toUpperCase();

        let title = "WIN!";
        let color = "var(--neon-cyan)";

        if (spin.kind === "jackpot") {
           title = "🚨 JACKPOT 🚨";
           color = "#ff0055"; 
        } else if (cnt >= 8) {
           title = "EPIC WIN!";
           color = "var(--neon-purple)"; 
        } else if (cnt >= 6) {
           title = "BIG WIN!";
           color = "var(--neon-gold)"; 
        } else if (cnt >= 5) {
           title = "LUCKY HIT";
        }

        // [레이아웃 보호] Flexbox + 이미지 크기 고정
        msgHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;">
            <span style="color:${color}; font-size:1.2rem; font-weight:800; line-height:1.2;">${title}</span>
            
            <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin: 4px 0;">
              <span style="color:#fff; font-size:1rem; font-weight:700;">${cnt} x</span>
              <img src="${imgUrl}" style="width:30px; height:30px; object-fit:contain; display:block;">
              <span style="color:#fff; font-size:1rem; font-weight:700;">${symName}</span>
            </div>
            
            <span style="color:${color}; font-weight:900; font-size:1.1rem; line-height:1;">+${amt} UT</span>
          </div>
        `;

        if(spin.kind === "jackpot"){
          showJackpotOverlay(Number(spin.payout));
          if(state.audioEnabled) audios.jackpot.play().catch(()=>{});
        } else {
          if(state.audioEnabled) audios.win.play().catch(()=>{});
        }

      } else {
        if(state.audioEnabled) audios.lose.play().catch(()=>{});
        msgHTML = `<span style="color:#555; font-weight:700; font-size:1.1rem;">TRY AGAIN</span>`;
      }

      els.statusMsg.innerHTML = msgHTML; 
      els.statusMsg.className = isWin ? "msg-area win" : "msg-area";
      
      const newBal = Number(data.user.balance);
      if(state.wallet !== newBal) animateValue(els.walletSpan, state.wallet, newBal, 1000);
      state.wallet = newBal;
      state.jackpotPool = Number(data.jackpotTotal);
      updateUI();

      if(state.isAuto){
        setTimeout(() => {
          if(state.isAuto && state.wallet >= state.bet) onSpinClick();
          else if(state.isAuto) toggleAuto();
        }, 1500);
      }
    }

    function showJackpotOverlay(amt){
      els.jpOverlay.style.display = 'flex';
      els.jpOverlay.classList.add('show');
      animateValue(els.jpAmount, 0, amt, 3000);
      createCoins();
    }
    function closeJackpot(){
      els.jpOverlay.style.display = 'none';
      els.jpOverlay.classList.remove('show');
      els.coinBox.innerHTML = '';
    }
    function createCoins(){
      els.coinBox.innerHTML = '';
      for(let i=0;i<60;i++){
        const c = document.createElement('div');
        c.className = 'coin';
        c.style.left = Math.random()*100+'vw';
        c.style.animationDuration = (Math.random()*2+1)+'s';
        els.coinBox.appendChild(c);
      }
    }

    function startBgEffect(ms){
      clearInterval(state.bgIntervalId);
      state.bgIntervalId = setInterval(()=>{
        state.bgIdx = (state.bgIdx+1)%CONFIG.imgObj.bg.length;
        els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}${CONFIG.imgObj.bg[state.bgIdx]}')`;
      }, ms);
    }
    function stopBgEffect(){
      clearInterval(state.bgIntervalId);
      els.bg.style.backgroundImage = `url('${CONFIG.imgObj.path}bg1.png')`;
    }

    function jsonpRequest(action, params){
      return new Promise((resolve, reject)=>{
        const cb = 'cb_'+Math.round(Math.random()*100000);
        window[cb] = (d) => { delete window[cb]; document.body.removeChild(s); resolve(d); };
        const s = document.createElement('script');
        params.action = action; params.callback = cb;
        s.src = `${CONFIG.API_URL}?${new URLSearchParams(params)}`;
        s.onerror = () => { delete window[cb]; document.body.removeChild(s); reject(); };
        document.body.appendChild(s);
      });
    }

    function animateValue(obj, start, end, duration){
      let s = null;
      const step = (t) => {
        if(!s) s = t;
        const p = Math.min((t-s)/duration, 1);
        obj.innerText = Math.floor(p*(end-start)+start).toLocaleString();
        if(p<1) requestAnimationFrame(step); else obj.innerText = end.toLocaleString();
      };
      requestAnimationFrame(step);
    }

    function updateUI(){
      els.betSpan.innerText = state.bet;
      els.jackpotPool.innerText = Number(state.jackpotPool||0).toLocaleString();
      els.walletSpan.innerText = Number(state.wallet||0).toLocaleString();
    }
    function changeBet(d){
      if(state.isSpinning) return;
      const n = state.bet + d;
      if(n>=5 && n<=1000){ state.bet=n; updateUI(); }
    }

    window.onload = init;
  </script>
</body>
</html>
